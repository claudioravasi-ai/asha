/* =========================================================================
   RESUMEN DE LA EVOLUCION PARA EL PACIENTE
   -------------------------------------------------------------------------
   Una pagina, en castellano llano, que el paciente puede leer sin que le
   traduzcan nada, y que puede mostrarle a otro medico o a la familia.

   TRES DECISIONES QUE VALE LA PENA EXPLICAR

   1. Es un resumen CONCEPTUAL, no la historia clinica. El correo electronico
      no es un canal seguro: no lo controla el consultorio, queda copiado en
      servidores ajenos y se reenvia solo. Va lo que el paciente necesita
      para entender su tratamiento y nada mas. Los diferenciales, las notas
      internas, el examen fisico y el razonamiento clinico NO viajan.

   2. Nada se manda sin que el medico lo lea. La aplicacion arma el borrador,
      lo muestra completo en pantalla y recien despues aparece la superficie
      de enviar. El texto ademas es editable antes de mandarlo.

   3. Lleva las pautas de alarma. Un resumen que dice como va el tratamiento
      pero no dice cuando hay que consultar sin esperar el turno esta a mitad
      de camino.
   ========================================================================= */
'use strict';

/* Traduce el mecanismo del dolor a algo que se pueda leer sin ser medico. */
const MECANISMO_LLANO = {
  nociceptivo:
    'El dolor viene de un tejido que está irritado o dañado —una articulación, ' +
    'un músculo, un hueso— y los nervios lo transmiten con normalidad.',
  neuropatico:
    'El dolor viene del propio nervio, que está lesionado o irritado. Por eso ' +
    'arde, da corrientazos o adormece, y por eso los analgésicos comunes ' +
    'funcionan poco: hacen falta medicamentos que actúan sobre el nervio.',
  nociplastico:
    'El sistema que transmite el dolor quedó demasiado sensible y amplifica ' +
    'señales que en otra persona no dolerían. El dolor es completamente real; ' +
    'lo que cambió es el volumen con el que el cuerpo lo transmite. Por eso el ' +
    'tratamiento se apoya sobre todo en el ejercicio, el sueño y la actividad, ' +
    'y no en los analgésicos.',
  mixto:
    'Hay más de un mecanismo funcionando a la vez, y por eso el tratamiento ' +
    'combina medicamentos que actúan de maneras distintas.'
};

/* Pautas de alarma. Las tres primeras van siempre; el resto se agregan segun
   lo que tenga este paciente. */
function pautasDeAlarma(p, a) {
  const L = [
    'Debilidad en las piernas o los brazos que va en aumento.',
    'Dificultad para orinar, para retener la orina o adormecimiento entre las piernas.',
    'Fiebre junto con el dolor.'
  ];
  const tiene = id => (p.antecedentes.etiquetas || []).includes(id);
  if (tiene('cancer'))
    L.push('Dolor de espalda que aumenta día a día, sobre todo si aparece debilidad en las piernas.');
  if (a.seguridad.mme.total > 0)
    L.push('Somnolencia excesiva, confusión o respiración lenta: son señales de que la ' +
           'dosis del analgésico fuerte es demasiada.');
  if ((p.medicacion || []).some(m => m.farmaco === 'carbamazepina' || m.farmaco === 'oxcarbazepina'))
    L.push('Cualquier erupción en la piel: suspenda el medicamento y consulte el mismo día.');
  if ((p.medicacion || []).some(m => m.farmaco === 'lamotrigina'))
    L.push('Cualquier erupción en la piel: suspenda la lamotrigina y consulte el mismo día.');
  if ((p.medicacion || []).some(m => m.farmaco === 'aine'))
    L.push('Dolor de estómago fuerte, vómitos oscuros o materia fecal negra.');
  if ((p.escalas || {}).phq9 && (p.escalas.phq9.items || [])[8] > 0)
    L.push('Si aparecen pensamientos de hacerse daño, no espere el turno: consulte ese mismo día.');
  L.push('Cualquier síntoma nuevo que lo preocupe. Preguntar de más nunca está de más.');
  return L;
}

/* -------------------------------------------------------------------------
   Arma el borrador del resumen. Devuelve un objeto con las partes por
   separado, para que la ventana pueda mostrarlas y dejarlas editar.
   ------------------------------------------------------------------------- */
function armarResumenPaciente(p) {
  const a = analizar(p);
  const ef = efectividadPaciente(p);
  const basal = primerNRS(p);
  const actual = ultimoNRS(p);
  const evos = (p.evoluciones || []).slice().sort((x, y) => (x.fecha || '').localeCompare(y.fecha || ''));
  const ultima = evos[evos.length - 1];

  /* --- cómo viene --------------------------------------------------- */
  let comoViene;
  if (basal != null && actual != null) {
    const cambio = mejoraPct(basal, actual, false);
    if (cambio >= 50)
      comoViene = 'Su dolor bajó de ' + basal + ' a ' + actual + ' sobre 10. Es una mejoría ' +
        'importante: más de la mitad de lo que dolía al principio.';
    else if (cambio >= 30)
      comoViene = 'Su dolor bajó de ' + basal + ' a ' + actual + ' sobre 10. Es una mejoría ' +
        'real y significativa. En dolor crónico, bajar un tercio es un buen resultado.';
    else if (cambio >= 15)
      comoViene = 'Su dolor bajó de ' + basal + ' a ' + actual + ' sobre 10. Hay una mejoría, ' +
        'todavía menor a la que buscamos. Por eso vamos a seguir ajustando el tratamiento.';
    else if (cambio >= 0)
      comoViene = 'Su dolor está en ' + actual + ' sobre 10, prácticamente igual que al ' +
        'comenzar (' + basal + '). Todavía no encontramos el tratamiento que le sirva, y ' +
        'eso es lo que vamos a seguir buscando.';
    else
      comoViene = 'Su dolor pasó de ' + basal + ' a ' + actual + ' sobre 10. Empeoró, y por ' +
        'eso vamos a revisar el diagnóstico y el plan completo, no solo la medicación.';
  } else {
    comoViene = 'Todavía no tenemos suficientes mediciones como para decir cómo viene la ' +
      'evolución. Eso se va a ver en los próximos controles.';
  }

  /* --- objetivos ------------------------------------------------------ */
  const objetivos = (p.impacto.objetivos || []).map(o =>
    typeof o === 'string' ? {t:o, logrado:false} : o).filter(o => o.t);
  const logrados = objetivos.filter(o => o.logrado);

  /* --- diagnóstico en llano ------------------------------------------- */
  const mecanismo = p.diagnostico.mecanismo || a.fenotipo.predominante;
  const explicacion = MECANISMO_LLANO[mecanismo] || '';

  /* --- medicación ------------------------------------------------------ */
  const meds = (p.medicacion || []).filter(m => m.farmaco || m.nombreLibre).map(m => {
    const f = FARMACOS[m.farmaco];
    return {
      nombre: f ? f.nombre : (m.nombreLibre || '—'),
      pauta: [m.dosis, m.frecuencia].filter(Boolean).join(', '),
      para: f ? paraQueSirve(m.farmaco) : ''
    };
  });

  return {
    p, a, ef, comoViene, objetivos, logrados, explicacion, meds,
    ultima, evos,
    alarmas: pautasDeAlarma(p, a),
    /* estos tres son editables antes de enviar */
    saludo: 'Le dejo por escrito un resumen de cómo viene su tratamiento, para que lo ' +
            'tenga a mano y pueda mostrárselo a quien haga falta.',
    comentario: (ultima && ultima.texto) ? ultima.texto : '',
    cierre: 'Cualquier duda, escriba o llame al consultorio. No hace falta esperar al turno.'
  };
}

/* Para qué sirve cada fármaco, dicho de manera que se entienda. Es la
   pregunta que el paciente hace siempre y que casi nunca queda contestada
   en la receta. */
function paraQueSirve(id) {
  const g = (FARMACOS[id] || {}).grupo;
  const map = {
    pregabalina:'calma el dolor de origen nervioso',
    gabapentina:'calma el dolor de origen nervioso',
    amitriptilina:'calma el dolor de origen nervioso y ayuda a dormir',
    nortriptilina:'calma el dolor de origen nervioso y ayuda a dormir',
    duloxetina:'calma el dolor y ayuda con el ánimo',
    venlafaxina:'calma el dolor y ayuda con el ánimo',
    carbamazepina:'corta las crisis de dolor tipo corrientazo',
    oxcarbazepina:'corta las crisis de dolor tipo corrientazo',
    lamotrigina:'calma el dolor de origen nervioso',
    paracetamol:'analgésico de base',
    aine:'antiinflamatorio y analgésico',
    aine_topico:'antiinflamatorio en gel, para aplicar sobre la articulación',
    dipirona:'analgésico',
    tramadol:'analgésico fuerte, para los momentos peores',
    morfina:'analgésico fuerte',
    oxicodona:'analgésico fuerte',
    metadona:'analgésico fuerte de acción prolongada',
    fentanilo_td:'analgésico fuerte en parche',
    buprenorfina_td:'analgésico fuerte en parche',
    tapentadol:'analgésico fuerte',
    lidocaina_parche:'parche que adormece la zona dolorosa',
    capsaicina_alta:'parche que desensibiliza la zona dolorosa',
    capsaicina_baja:'crema que desensibiliza la zona dolorosa',
    ciclobenzaprina:'relaja la contractura muscular',
    baclofeno:'relaja la contractura muscular',
    dexametasona:'desinflama',
    corticoide_oral:'desinflama',
    vitamina_c:'protege al nervio',
    bifosfonatos:'protege el hueso y calma el dolor óseo'
  };
  return map[id] || (g === 'Opioide' ? 'analgésico fuerte' : 'para el dolor');
}

/* =========================================================================
   LA VENTANA
   ========================================================================= */

function ventanaResumenPaciente(id) {
  abrir({id:'res_' + id, titulo:'Resumen para el paciente',
    sub:'Una página, en lenguaje llano', ancha:true, ctx:{id}, dibujar(c, ctx) {
      const p = ESTADO.pacientes[ctx.id];
      if (!p) return;
      const r = armarResumenPaciente(p);

      if (!p.email) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta medio"><b>Este paciente no tiene correo cargado</b>' +
          '<p>Podés generar el resumen e imprimirlo igual, pero para enviarlo hace falta ' +
          'completar el correo en Filiación.</p></div>');
      }

      c.insertAdjacentHTML('beforeend',
        '<div class="alerta info"><b>Qué viaja y qué no</b>' +
        '<p>Este resumen es <b>conceptual</b>: lleva el diagnóstico explicado, cómo viene la ' +
        'evolución, la medicación y las pautas de alarma. <b>No</b> lleva el examen físico, ' +
        'los diagnósticos diferenciales, las notas internas ni el razonamiento clínico. ' +
        'El correo electrónico no es un canal que controlemos: lo que se manda se queda ' +
        'copiado en servidores ajenos y se puede reenviar solo.</p></div>');

      /* --- lo que se puede tocar antes de enviar --------------------- */
      campo(c, 'Cómo empieza la carta', r, 'saludo', {area:true, filas:2});
      campo(c, 'Comentario suyo sobre este control', r, 'comentario',
        {area:true, filas:4,
         ayuda:'Se copió lo que escribió en el último control. Reescribalo pensando en que ' +
               'lo va a leer el paciente, no un colega.'});
      campo(c, 'Cómo termina', r, 'cierre', {area:true, filas:2});

      /* --- vista previa ---------------------------------------------- */
      const previa = document.createElement('div');
      previa.className = 'bloque';
      previa.style.background = 'var(--ventana)';
      c.appendChild(previa);

      const pintarPrevia = () => {
        previa.innerHTML = '<h3>Vista previa — esto es exactamente lo que va a recibir</h3>' +
          '<div style="border:1px solid var(--linea);border-radius:10px;padding:16px;' +
          'font-size:13.5px;line-height:1.6">' + resumenHTML(r, true) + '</div>';
      };
      pintarPrevia();

      c.appendChild(superficie('Actualizar la vista previa',
        'Después de editar los textos de arriba', pintarPrevia, 'fina suave'));

      c.insertAdjacentHTML('beforeend', '<div style="height:12px"></div>');

      /* --- enviar e imprimir ------------------------------------------ */
      if (p.email && envioConfigurado()) {
        c.appendChild(superficie('Enviar por correo a ' + p.email,
          'Se envía tal como se ve arriba', () => {
            confirmar('Enviar el resumen a ' + nombreCompleto(p),
              'Se va a enviar a ' + p.email + '. Revisá que la dirección sea correcta: ' +
              'un resumen clínico que llega a la casilla equivocada no se puede retirar.',
              () => enviarResumen(p, r), 'Sí, enviar');
          }, 'acento'));
      } else if (p.email && !envioConfigurado()) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta medio"><b>El envío de correo no está configurado</b>' +
          '<p>Podés imprimirlo o guardarlo como PDF y mandarlo por el medio que prefieras. ' +
          'Para activar el envío automático, ver el paso 6 de PUBLICAR.md.</p></div>');
      }

      c.appendChild(superficie('Imprimir o guardar como PDF',
        'Para entregárselo en mano o mandarlo por otro medio', () => {
          imprimirResumen(r);
        }, 'suave'));

      if ((p.resumenesEnviados || []).length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin:20px 0 8px">Resúmenes ya enviados</h3>' +
          p.resumenesEnviados.map(x =>
            dato(fechaCorta(x.fecha), esc(x.para) + (x.ok ? ' ' + marca('enviado', 'verde')
                                                          : ' ' + marca('falló', 'rojo')))).join(''));
      }
    }});
}

function enviarResumen(p, r) {
  const html = resumenHTML(r, false);
  mandar({
    para: p.email,
    asunto: MARCA.nombre + ' — resumen de su tratamiento',
    html,
    tipo: 'resumen-paciente'
  }).then(ok => {
    p.resumenesEnviados = p.resumenesEnviados || [];
    p.resumenesEnviados.push({fecha:ahora(), para:p.email, ok});
    p.modificado = ahora();
    guardar('pacientes', p.id, p);
    avisar(ok ? 'Resumen enviado a ' + p.email
              : 'No se pudo enviar. Probá imprimirlo y mandarlo por otro medio.',
           ok ? 'ok' : 'error');
    refrescar();
  });
}

/* -------------------------------------------------------------------------
   El documento. `enPantalla` cambia solo los colores, para que se lea bien
   dentro de la aplicacion; el que se manda por correo va con estilos
   fijos, porque los clientes de correo no entienden variables de CSS.
   ------------------------------------------------------------------------- */
function resumenHTML(r, enPantalla) {
  const p = r.p;
  const col = enPantalla
    ? {t:'inherit', s:'var(--tinta-3)', a:'var(--acento)', l:'var(--linea)', f:'transparent'}
    : {t:'#141821', s:'#828b9c', a:'#2d6a72', l:'#dde1e9', f:'#f7f8fa'};

  const H = [];
  const est = 'font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;' +
              'max-width:640px;margin:0 auto;color:' + col.t + ';line-height:1.6;font-size:15px';

  H.push('<div style="' + est + '">');

  /* encabezado */
  H.push('<div style="border-bottom:2px solid ' + col.a + ';padding-bottom:10px;margin-bottom:20px">' +
    '<div style="font-size:20px;font-weight:700;letter-spacing:.07em">' + esc(MARCA.nombre) + '</div>' +
    (MARCA.firma ? '<div style="color:' + col.a + ';font-size:13px">' + esc(MARCA.firma) + '</div>' : '') +
    '<div style="color:' + col.s + ';font-size:12px">' + esc(MARCA.bajada) + '</div></div>');

  H.push('<p style="margin:0 0 4px"><b>' + esc(nombreCompleto(p)) + '</b></p>');
  H.push('<p style="margin:0 0 18px;color:' + col.s + ';font-size:13px">Resumen al ' +
    esc(fechaCorta(hoy())) + '</p>');

  H.push('<p>' + esc(r.saludo) + '</p>');

  /* qué tiene */
  if (p.diagnostico.sindrome) {
    H.push(seccion('Qué es lo que tiene', col));
    H.push('<p><b>' + esc(p.diagnostico.sindrome) + '.</b>' +
      (r.explicacion ? ' ' + esc(r.explicacion) : '') + '</p>');
  }

  /* cómo viene */
  H.push(seccion('Cómo viene el tratamiento', col));
  H.push('<p>' + esc(r.comoViene) + '</p>');

  if (r.objetivos.length) {
    H.push('<p style="margin-top:12px"><b>Los objetivos que nos pusimos:</b></p>');
    H.push('<ul style="margin:6px 0 0;padding-left:20px">');
    for (const o of r.objetivos) {
      H.push('<li style="margin-bottom:4px">' + esc(o.t) +
        (o.logrado ? ' <b style="color:#2f9e5f">— logrado</b>'
                   : ' <span style="color:' + col.s + '">— en eso estamos</span>') + '</li>');
    }
    H.push('</ul>');
  }

  if (r.comentario) {
    H.push('<div style="background:' + col.f + ';border-left:3px solid ' + col.a + ';' +
      'padding:12px 14px;border-radius:8px;margin:16px 0">' +
      esc(r.comentario).replace(/\n/g, '<br>') + '</div>');
  }

  /* medicación */
  if (r.meds.length) {
    H.push(seccion('Lo que está tomando ahora', col));
    H.push('<table style="width:100%;border-collapse:collapse;font-size:14px">');
    for (const m of r.meds) {
      H.push('<tr><td style="padding:7px 0;border-bottom:1px solid ' + col.l + ';vertical-align:top">' +
        '<b>' + esc(m.nombre) + '</b>' +
        (m.pauta ? '<br><span style="color:' + col.s + '">' + esc(m.pauta) + '</span>' : '') +
        (m.para ? '<br><span style="color:' + col.s + ';font-size:13px">— ' + esc(m.para) + '</span>' : '') +
        '</td></tr>');
    }
    H.push('</table>');
    H.push('<p style="font-size:13px;color:' + col.s + ';margin-top:10px">' +
      'No cambie ni suspenda nada por su cuenta, aunque se sienta mejor. ' +
      'Varios de estos medicamentos necesitan bajarse de a poco.</p>');
  }

  /* qué sigue */
  H.push(seccion('Qué sigue', col));
  const sigue = [];
  if (p.proximoControl) sigue.push('Próximo control: <b>' + esc(fechaCorta(p.proximoControl)) + '</b>.');
  if ((p.plan.estudios || []).length)
    sigue.push('Estudios pendientes: ' + esc(p.plan.estudios.join(', ')) + '.');
  if ((p.plan.noFarmacologico || []).length)
    sigue.push('Además de la medicación: ' + esc(p.plan.noFarmacologico.join('; ')) + '.');
  if ((p.plan.derivaciones || []).length)
    sigue.push('Interconsultas: ' + esc(p.plan.derivaciones.join(', ')) + '.');
  H.push(sigue.length
    ? '<ul style="margin:0;padding-left:20px">' +
      sigue.map(x => '<li style="margin-bottom:5px">' + x + '</li>').join('') + '</ul>'
    : '<p>Seguimos con el plan acordado.</p>');

  /* alarmas */
  H.push(seccion('Cuándo consultar sin esperar el turno', col));
  H.push('<ul style="margin:0;padding-left:20px">');
  for (const x of r.alarmas) H.push('<li style="margin-bottom:5px">' + esc(x) + '</li>');
  H.push('</ul>');

  H.push('<p style="margin-top:20px">' + esc(r.cierre) + '</p>');

  /* firma y pie */
  H.push('<div style="margin-top:26px;padding-top:14px;border-top:1px solid ' + col.l + '">');
  H.push('<p style="margin:0"><b>' + esc(MARCA.titular) + '</b><br>' +
    '<span style="color:' + col.s + ';font-size:13px">' + esc(MARCA.matricula) + ' · ' +
    esc(MARCA.especialidad) + '</span></p>');
  const contacto = [MARCA.telefono, MARCA.email, MARCA.direccion].filter(Boolean).join(' · ');
  if (contacto) H.push('<p style="margin:6px 0 0;color:' + col.s + ';font-size:13px">' +
    esc(contacto) + '</p>');
  H.push('</div>');

  H.push('<p style="margin-top:18px;color:' + col.s + ';font-size:11.5px;line-height:1.5">' +
    esc(LEGAL_PIE) + '</p>');
  H.push('<p style="color:' + col.s + ';font-size:11.5px;line-height:1.5">' +
    'Este resumen es un complemento de la consulta y no la reemplaza. Su historia clínica ' +
    'completa está en el consultorio y usted puede pedir una copia cuando quiera ' +
    '(Ley 26.529, art. 14).</p>');

  H.push('</div>');
  return H.join('');
}

function seccion(titulo, col) {
  return '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.06em;' +
    'color:' + col.a + ';margin:22px 0 8px;font-weight:700">' + esc(titulo) + '</h3>';
}

function imprimirResumen(r) {
  const v = window.open('', '_blank');
  if (!v) return avisar('El navegador bloqueó la ventana de impresión.', 'error');
  v.document.write('<!DOCTYPE html><html lang="es-AR"><head><meta charset="utf-8">' +
    '<title>Resumen — ' + esc(nombreCompleto(r.p)) + '</title>' +
    '<style>body{margin:1.6cm auto;max-width:19cm}@media print{body{margin:0}}</style>' +
    '</head><body>' + resumenHTML(r, false) + '</body></html>');
  v.document.close();
  setTimeout(() => v.print(), 350);
}

/* =========================================================================
   DOLOR AGUDO Y POSTOPERATORIO
   -------------------------------------------------------------------------
   La otra mitad del trabajo de un anestesiologo dedicado al dolor. Comparte
   la misma base de pacientes que el consultorio de dolor cronico, porque son
   los mismos: el paciente que hoy es un postoperatorio complicado puede ser
   el dolor cronico postquirurgico de dentro de tres meses, y tener las dos
   cosas en la misma historia es lo que permite verlo venir.

   El seguimiento se registra con DOS intensidades y no con una: en reposo y
   en movimiento. Es la diferencia entre un paciente comodo en la cama y un
   paciente que puede toser, levantarse y recuperarse. La analgesia
   postoperatoria se mide con la segunda.
   ========================================================================= */
'use strict';

function ventanaAgudo() {

    const activos = Object.values(ESTADO.pacientes)
      .filter(p => p.ambito === 'agudo' && !p.altaAgudo)

      for (const p of activos) {

function ventanaAgudoPaciente(id) {
  abrir({id:'ag_' + id, titulo:'Dolor agudo', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    if (!p) return;
    p.agudo = p.agudo || {tipo:'general', controles:[]};
    const ag = p.agudo;
    if (!Array.isArray(ag.controles)) ag.controles = [];
    const g = () => { p.modificado = ahora(); guardar('pacientes', p.id, p); };

    const g1 = document.createElement('div'); g1.className = 'dos'; c.appendChild(g1);
    campo(g1, 'Apellido', p, 'apellido', {alCambiar:g});
    campo(g1, 'Nombre', p, 'nombre', {alCambiar:g});
    const g2 = document.createElement('div'); g2.className = 'tres'; c.appendChild(g2);
    campo(g2, 'Documento', p, 'dni', {alCambiar:g});
    campo(g2, 'Cama', ag, 'cama', {alCambiar:g});
    campo(g2, 'Servicio', ag, 'servicio', {alCambiar:g});
    const g3 = document.createElement('div'); g3.className = 'dos'; c.appendChild(g3);
    campo(g3, 'Cirugía o motivo', ag, 'cirugia', {alCambiar:g});
    campo(g3, 'Fecha', ag, 'fecha', {tipo:'date', alCambiar:g});

    const ct = document.createElement('div'); ct.className = 'campo';
    ct.innerHTML = '<label>Esquema aplicable</label>'; c.appendChild(ct);
    opciones(ct, Object.entries(ESQUEMAS_AGUDO).map(([v, e]) => ({t:e.nombre, v})), ag.tipo,
             v => { ag.tipo = v; g(); refrescar(); });

    if (ag.tipo && ESQUEMAS_AGUDO[ag.tipo]) {
      const e = ESQUEMAS_AGUDO[ag.tipo];
      c.insertAdjacentHTML('beforeend', cajaSugerencia('Esquema sugerido',
        '<div style="font-size:13.5px"><b>Base:</b> ' + esc(e.base.join(' · ')) + '</div>' +
        (e.regional.length ? '<div style="font-size:13.5px;margin-top:5px"><b>Regional:</b> ' +
          esc(e.regional.join(' · ')) + '</div>' : '') +
        (e.coadyuvantes.length ? '<div style="font-size:13.5px;margin-top:5px"><b>Coadyuvantes:</b> ' +
          esc(e.coadyuvantes.join(' · ')) + '</div>' : '') +
        '<p class="nota" style="margin-top:8px">' + esc(e.nota) + '</p>'));
    }

    campo(c, 'Técnica analgésica indicada', ag, 'tecnica', {area:true, filas:3, alCambiar:g,
      pista:'Catéter, bloqueo, PCA, esquema pautado con dosis…'});

    /* ---- controles diarios -------------------------------------------- */
    c.insertAdjacentHTML('beforeend',
      '<h3 style="font-size:15px;margin:20px 0 4px">Controles</h3>' +
      '<p class="nota" style="margin-bottom:10px">Se registran las dos intensidades. La que ' +
      'importa para decidir si la analgesia alcanza es la de <b>movimiento</b>: un paciente que ' +
      'está cómodo en la cama pero no puede toser ni levantarse está mal analgesiado.</p>');

    const serie = ag.controles.filter(x => x.nrsMov != null)
      .map(x => ({fecha:x.fecha, nrs:x.nrsMov}));
    if (serie.length) {
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque"><h3>Intensidad en movimiento</h3>' + graficoEvolucion(serie) + '</div>');
    }

    c.appendChild(superficie('+ Registrar control', null, () => {
      const ctrl = {fecha:hoy(), hora:new Date().toTimeString().slice(0, 5),
                    nrsReposo:null, nrsMov:null, sedacion:'', nauseas:false,
                    rescates:0, texto:''};
      abrir({id:'agc_' + p.id, titulo:'Control de dolor agudo', ctx:{}, dibujar(cc) {
        for (const e of [{k:'nrsReposo', t:'Intensidad EN REPOSO'},
                         {k:'nrsMov', t:'Intensidad EN MOVIMIENTO (al toser, sentarse o movilizarse)'}]) {
          const z = document.createElement('div'); z.className = 'campo';
          z.innerHTML = '<label>' + esc(e.t) + '</label>'; cc.appendChild(z);
          escalaNRS(z, ctrl[e.k], v => { ctrl[e.k] = v; refrescar(); });
        }
        const cs = document.createElement('div'); cs.className = 'campo';
        cs.innerHTML = '<label>Sedación (escala de Pasero)</label>'; cc.appendChild(cs);
        opciones(cs, [
          {t:'S — dormido, se despierta fácil', v:'S'},
          {t:'1 — despierto y alerta', v:'1'},
          {t:'2 — algo somnoliento, se despierta fácil', v:'2'},
          {t:'3 — somnoliento, se duerme durante la conversación', v:'3'},
          {t:'4 — somnoliento, no responde', v:'4'}], ctrl.sedacion,
          v => { ctrl.sedacion = v; refrescar(); });
        if (ctrl.sedacion === '3' || ctrl.sedacion === '4') {
          cc.insertAdjacentHTML('beforeend',
            '<div class="alerta urgente"><b>Sedación de riesgo</b>' +
            '<p>Un nivel 3 o 4 de Pasero precede a la depresión respiratoria y obliga a suspender ' +
            'el opioide, estimular al paciente, dar oxígeno y evaluar naloxona. La sedación es un ' +
            'signo más precoz y más confiable que la frecuencia respiratoria.</p></div>');
        }
        const cn = document.createElement('div'); cn.className = 'campo';
        cn.innerHTML = '<label>Náuseas o vómitos</label>'; cc.appendChild(cn);
        opciones(cn, [{t:'Sí', v:true}], ctrl.nauseas ? true : null,
                 v => { ctrl.nauseas = !!v; });
        campo(cc, 'Rescates en las últimas 24 h', ctrl, 'rescates', {tipo:'number'});
        campo(cc, 'Observaciones', ctrl, 'texto', {area:true, filas:3});

        cc.appendChild(superficie('Guardar el control', null, () => {
          ag.controles.push(ctrl); g();
          avisar('Control registrado.', 'ok');
          volverA(PILA.findIndex(v => v.id === 'ag_' + p.id));
        }, 'acento'));
      }});
    }, 'suave'));

    for (let i = ag.controles.length - 1; i >= 0; i--) {
      const x = ag.controles[i];
      const cm = x.nrsMov != null ? colorDolor(x.nrsMov) : null;
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque" style="margin-bottom:7px"><div style="display:flex;gap:9px;align-items:baseline">' +
        '<b style="flex:1">' + esc(fechaCorta(x.fecha)) + ' ' + esc(x.hora || '') + '</b>' +
        '<span class="nota">reposo ' + (x.nrsReposo ?? '—') + '</span>' +
        (cm ? '<span class="marca-txt" style="background:' + cm.color + ';color:' +
          (x.nrsMov >= 3 && x.nrsMov <= 6 ? '#3a2c00' : '#fff') + '">mov. ' + x.nrsMov + '</span>' : '') +
        '</div>' +
        '<div class="nota" style="margin-top:4px">' +
        esc([x.sedacion ? 'Pasero ' + x.sedacion : '', x.nauseas ? 'náuseas' : '',
             x.rescates ? x.rescates + ' rescates' : ''].filter(Boolean).join(' · ')) + '</div>' +
        (x.texto ? '<p style="font-size:13.5px;margin-top:5px">' + esc(x.texto) + '</p>' : '') +
        '</div>');
    }

    c.insertAdjacentHTML('beforeend', '<div style="height:14px"></div>');
    c.appendChild(superficie(p.altaAgudo ? 'Reabrir el seguimiento' : 'Dar de alta del seguimiento',
      p.altaAgudo ? '' : 'Sale de la lista de activos; la historia queda guardada', () => {
        p.altaAgudo = !p.altaAgudo; g(); refrescar();
      }, 'fina'));
    c.appendChild(superficie('Abrir como historia de dolor crónico',
      'Si el dolor persiste más de 3 meses, pasa a ser dolor crónico postquirúrgico', () => {
        p.ambito = 'cronico'; g(); ventanaHistoria(p.id);
      }, 'fina suave'));
  }});
}

function ventanaEstadisticas() {
  abrir({id:'stats', titulo:'Estadísticas del consultorio', ancha:true, dibujar(c) {
    const ps = Object.values(ESTADO.pacientes).filter(p => p.ambito !== 'agudo');
    if (!ps.length) {
      c.innerHTML = vacio('Todavía no hay datos', 'Las estadísticas aparecen cuando haya ' +
        'pacientes con evoluciones registradas.');
      return;
    }

    /* --- efectividad global --------------------------------------------- */
    const efs = ps.map(p => efectividadPaciente(p)).filter(e => e.porcentaje != null);
    const promedio = efs.length ? Math.round(efs.reduce((s, e) => s + e.porcentaje, 0) / efs.length) : null;
    const respondedores = efs.filter(e => e.porcentaje >= 30).length;
    const sustanciales = efs.filter(e => e.porcentaje >= 50).length;

    c.insertAdjacentHTML('beforeend',
      '<div class="bloque" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
      anilloEfectividad(promedio, 80) +
      '<div style="flex:1;min-width:180px"><h3 style="margin-bottom:6px">Efectividad promedio</h3>' +
      '<p class="nota">' + efs.length + ' pacientes con datos suficientes para medir.<br>' +
      '<b>' + respondedores + '</b> alcanzaron el umbral clínicamente relevante (≥30%).<br>' +
      '<b>' + sustanciales + '</b> alcanzaron respuesta sustancial (≥50%).</p></div></div>');

    /* --- reparto por banda ---------------------------------------------- */
    const bandas = {};
    for (const e of efs) bandas[e.banda.clave] = (bandas[e.banda.clave] || 0) + 1;
    let hb = '';
    for (const b of BANDAS_EFECTIVIDAD) {
      const n = bandas[b.clave] || 0;
      const pct = efs.length ? Math.round((n / efs.length) * 100) : 0;
      hb += '<div style="margin-bottom:8px"><div style="display:flex;gap:8px;font-size:13.5px">' +
            '<span style="flex:1">' + esc(b.etiqueta) + '</span><b>' + n + '</b>' +
            '<span class="nota">' + pct + '%</span></div>' +
            '<div class="barra-pct"><i style="width:' + pct + '%;background:' + b.color + '"></i></div></div>';
    }
    c.insertAdjacentHTML('beforeend', bloque('Reparto de resultados', hb));

    /* --- diagnósticos más frecuentes ------------------------------------ */
    const dx = {};
    for (const p of ps) {
      const d = (p.diagnostico && p.diagnostico.sindrome) || 'Sin diagnóstico';
      dx[d] = (dx[d] || 0) + 1;
    }
    const ordenDx = Object.entries(dx).sort((a, b) => b[1] - a[1]).slice(0, 12);
    c.insertAdjacentHTML('beforeend', bloque('Diagnósticos',
      ordenDx.map(([d, n]) => dato(esc(d), '<b>' + n + '</b> <span class="nota">' +
        Math.round((n / ps.length) * 100) + '%</span>')).join('')));

    /* --- mecanismos ------------------------------------------------------ */
    const mec = {};
    for (const p of ps) {
      const m = (p.diagnostico && p.diagnostico.mecanismo) || 'sin definir';
      mec[m] = (mec[m] || 0) + 1;
    }
    c.insertAdjacentHTML('beforeend', bloque('Mecanismo predominante',
      Object.entries(mec).sort((a, b) => b[1] - a[1])
        .map(([m, n]) => dato(esc(m), '<b>' + n + '</b>')).join('')));

    /* --- carga opioide del consultorio ----------------------------------- */
    const mmes = ps.map(p => {
      const ops = (p.medicacion || [])
        .filter(m => FARMACOS[m.farmaco] && FARMACOS[m.farmaco].grupo === 'Opioide')
        .map(m => ({id:m.farmaco, mgDia:mgDiariosDe(m), mcgHora:mcgHoraDe(m)}));
      return {p, mme:calcularMME(ops).total};
    }).filter(x => x.mme > 0).sort((a, b) => b.mme - a.mme);

    c.insertAdjacentHTML('beforeend', bloque('Carga opioide del consultorio',
      dato('Pacientes con opioide', '<b>' + mmes.length + '</b> de ' + ps.length +
        ' <span class="nota">(' + Math.round((mmes.length / ps.length) * 100) + '%)</span>') +
      dato('Con 50 MME/día o más', '<b>' + mmes.filter(x => x.mme >= 50).length + '</b>') +
      dato('Con 90 MME/día o más', '<b>' + mmes.filter(x => x.mme >= 90).length + '</b> ' +
        (mmes.filter(x => x.mme >= 90).length ? marca('revisar indicación', 'rojo') : '')) +
      (mmes.length
        ? '<div style="margin-top:10px">' + mmes.slice(0, 8).map(x =>
            dato(esc(nombreCompleto(x.p)), '<b>' + x.mme + '</b> MME/día ' +
              marca(calcularMME([{id:'morfina', mgDia:x.mme}]).nivel,
                    x.mme >= 90 ? 'rojo' : x.mme >= 50 ? 'ambar' : 'lima'))).join('') + '</div>'
        : '')));

    /* --- escalas y adherencia al registro -------------------------------- */
    const conMapa = ps.filter(p => (p.dolor.mapa || []).length).length;
    const conDN4 = ps.filter(p => p.escalas && p.escalas.dn4).length;
    const conPGIC = ps.filter(p => p.escalas && p.escalas.pgic).length;
    const conControl = ps.filter(p => (p.evoluciones || []).length).length;
    c.insertAdjacentHTML('beforeend', bloque('Calidad del registro',
      dato('Con mapa corporal', conMapa + ' / ' + ps.length) +
      dato('Con DN4', conDN4 + ' / ' + ps.length) +
      dato('Con PGIC (medida de resultado)', conPGIC + ' / ' + ps.length) +
      dato('Con al menos un control', conControl + ' / ' + ps.length) +
      '<p class="nota" style="margin-top:9px">El PGIC es el que más suele faltar y el que más ' +
      'pesa para medir efectividad. Toma quince segundos y cambia por completo la calidad ' +
      'del seguimiento.</p>'));

    /* --- pendientes ------------------------------------------------------- */
    const vencidos = ps.filter(p => p.proximoControl && p.proximoControl < hoy());
    if (vencidos.length) {
      c.insertAdjacentHTML('beforeend',
        '<div class="alerta medio"><b>' + vencidos.length + ' paciente' +
        (vencidos.length === 1 ? '' : 's') + ' con control vencido</b><p>' +
        esc(vencidos.slice(0, 10).map(p => nombreCompleto(p) + ' (' + fechaCorta(p.proximoControl) + ')').join(' · ')) +
        '</p></div>');
    }
  }});
}

function ventanaListaSindromes() {
  abrir({id:'lsx', titulo:'Síndromes de dolor', ancha:true, ctx:{q:''}, dibujar(c, ctx) {

    b.className = 'campo';

    c.appendChild(b);
    const lista = document.createElement('div');
    c.appendChild(lista);
    $('input', b).oninput = e => { ctx.q = e.target.value; pintar(); };
    function pintar() {
      lista.innerHTML = '';
      const q = normalizar(ctx.q);
      const grupos = {};
      for (const s of SINDROMES) {
        if (q && !normalizar(s.nombre + ' ' + s.grupo + ' ' + s.resumen).includes(q)) continue;
        (grupos[s.grupo] = grupos[s.grupo] || []).push(s);
      }
      for (const [g, ss] of Object.entries(grupos)) {
        lista.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin:16px 0 7px">' + esc(g) + '</h3>');
        for (const s of ss) {
          lista.appendChild(superficie(s.nombre, s.icd.cod + ' · ' + s.mecanismo,
                                       () => ventanaSindrome(s.id, null), 'fina'));
        }
      }
      if (!Object.keys(grupos).length) lista.innerHTML = vacio('Sin resultados', 'Probá con otra palabra.');
    }
    pintar();
  }});
}

function ventanaCalculadoraMME() {
  abrir({id:'mme', titulo:'Equivalentes de morfina', ancha:true, ctx:{lista:[]}, dibujar(c, ctx) {
    const zona = document.createElement('div');
    c.appendChild(zona);
    const salida = document.createElement('div');
    c.appendChild(salida);

    const opioides = Object.entries(FARMACOS).filter(([, f]) => f.grupo === 'Opioide');

    function pintar() {
      zona.innerHTML = '';
      ctx.lista.forEach((o, i) => {
        const caja = document.createElement('div');
        caja.className = 'bloque';
        caja.style.marginBottom = '8px';
        const cf = document.createElement('div');
        cf.className = 'campo';
        cf.innerHTML = '<label>Opioide</label>';
        caja.appendChild(cf);
        const sel = document.createElement('select');
        sel.innerHTML = '<option value="">— elegir —</option>' + opioides.map(([k, f]) =>
          '<option value="' + k + '"' + (o.id === k ? ' selected' : '') + '>' + esc(f.nombre) + '</option>').join('') +
          '<option value="metadona"' + (o.id === 'metadona' ? ' selected' : '') + '>Metadona</option>';
        sel.onchange = () => { o.id = sel.value; calcular(); };
        cf.appendChild(sel);
        const esParche = o.id === 'fentanilo_td' || o.id === 'buprenorfina_td';
        campo(caja, esParche ? 'Microgramos por hora del parche' : 'Miligramos por día (total)',
              o, esParche ? 'mcgHora' : 'mgDia', {tipo:'number', alCambiar:calcular});
        caja.appendChild(superficie('Quitar', null, () => {
          ctx.lista.splice(i, 1); pintar(); calcular();
        }, 'fina peligro'));
        zona.appendChild(caja);
      });
      zona.appendChild(superficie('+ Agregar opioide', null, () => {
        ctx.lista.push({id:'', mgDia:0, mcgHora:0}); pintar();
      }, 'suave'));
    }

    function calcular() {
      const r = calcularMME(ctx.lista);
      salida.innerHTML =
        '<div class="bloque" style="border-left:3px solid var(--' + r.color + ')">' +
        '<h3>Total</h3><div style="font-size:32px;font-weight:700;letter-spacing:-.02em">' +
        r.total + ' <span style="font-size:15px;color:var(--tinta-3)">MME/día</span></div>' +
        '<div style="margin:6px 0">' + marca(r.nivel, r.color) + '</div>' +
        (r.aviso ? '<p class="nota">' + esc(r.aviso) + '</p>' : '') +
        (r.detalle.length ? '<div style="margin-top:10px">' + r.detalle.map(d =>
          dato(esc((FARMACOS[d.id] || {}).nombre || d.id), d.mme + ' MME')).join('') + '</div>' : '') +
        '<div class="alerta alto" style="margin-top:12px"><b>Antes de usar esto para rotar</b>' +
        '<p>' + esc(r.nota) + ' Al rotar de un opioide a otro hay que reducir entre 25% y 50% la ' +
        'dosis equianalgésica calculada, por tolerancia cruzada incompleta. Con metadona la ' +
        'reducción es mucho mayor y la conversión no es lineal.</p></div></div>';
    }

    pintar(); calcular();
  }});
}

function imprimirHistoria(id) {
  const p = ESTADO.pacientes[id];
  if (!p) return;
  const a = analizar(p);
  const ef = efectividadPaciente(p);
  const L = [];
  const linea = t => L.push(t);
  const seccion = t => L.push('\n\n═══ ' + t.toUpperCase() + ' ═══');

  linea(MARCA.nombre + ' — ' + MARCA.consultorio);
  if (MARCA.titular !== 'Dr. —') linea(MARCA.titular + ' · ' + MARCA.matricula);
  linea('HISTORIA CLÍNICA DE DOLOR — impresa el ' + fechaCorta(hoy()));

  seccion('Filiación');
  linea('Paciente: ' + nombreCompleto(p));
  linea('Documento: ' + (p.dni || '—') + '   Nacimiento: ' + (p.fechaNac ? fechaCorta(p.fechaNac) +
    ' (' + edadDe(p.fechaNac) + ' años)' : '—'));
  linea('Sexo: ' + (p.sexo === 'F' ? 'femenino' : p.sexo === 'M' ? 'masculino' : '—') +
    '   Cobertura: ' + (p.obraSocial || '—'));
  linea('Ocupación: ' + (p.ocupacion || '—') + '   Derivado por: ' + (p.derivante || '—'));

  seccion('Antecedentes');
  linea('Enfermedades: ' + (p.antecedentes.enfermedades || '—'));
  linea('Cirugías: ' + (p.antecedentes.cirugias || '—'));
  linea('Alergias: ' + (p.antecedentes.alergias || '—'));
  linea('Familiares: ' + (p.antecedentes.familiares || '—'));
  linea('Hábitos: ' + (p.antecedentes.habitos || '—'));
  linea('Otra medicación: ' + (p.antecedentes.medicacionNoDolor || '—'));

  seccion('Historia del dolor');
  linea('Inicio: ' + (p.dolor.inicio ? fechaCorta(p.dolor.inicio) + ' (' +
    (mesesDesde(p.dolor.inicio) || 0) + ' meses de evolución)' : '—'));
  linea('Mecanismo de comienzo: ' + (p.dolor.mecanismo || '—'));
  linea('Descripción: ' + (p.dolor.descripcion || '—'));
  linea('Descriptores: ' + ((p.dolor.descriptores || []).map(v =>
    (DESCRIPTORES.find(x => x.v === v) || {t:v}).t).join(', ') || '—'));
  linea('Intensidad — ahora: ' + (p.dolor.nrsAhora ?? '—') + '/10   promedio: ' +
    (p.dolor.nrsPromedio ?? '—') + '/10   peor: ' + (p.dolor.nrsPeor ?? '—') +
    '/10   mejor: ' + (p.dolor.nrsMejor ?? '—') + '/10');
  linea('Patrón: ' + (p.dolor.patron || '—') + '   Peor momento: ' + (p.dolor.peorMomento || '—'));
  linea('Irradiación: ' + (p.dolor.irradiacion || '—'));
  linea('Lo alivia: ' + (p.dolor.alivia || '—'));
  linea('Lo empeora: ' + (p.dolor.empeora || '—'));

  seccion('Mapa dermatomal del dolor');
  const lm = leerMapa(p.dolor.mapa || []);
  if (lm.total) {
    linea('Distribución ' + lm.distribucion + ', intensidad máxima ' + lm.intensidadMax + '/10' +
      (lm.bilateral ? ', bilateral' : ', unilateral'));
    linea('Zonas: ' + lm.zonas.map(z => nombreZona(z.z) + ' (' + z.i + '/10)').join(' · '));
    linea('Índice de dolor generalizado (WPI): ' + lm.wpi + '/19 en ' + lm.areas.length + ' de 5 áreas');
    const rz = raizDominante(lm);
    if (rz) linea('Territorio predominante: ' + rz.raiz + ' (' + rz.proporcion + '% de las marcas)');
  } else linea('Sin marcas registradas.');

  seccion('Repercusión en la vida diaria');
  linea('Sueño: ' + (p.impacto.sueño || '—'));
  linea('Trabajo y actividades: ' + (p.impacto.trabajo || '—'));
  linea('Ánimo: ' + (p.impacto.animo || '—'));
  linea('Actividades abandonadas: ' + (p.impacto.dejoDeHacer || '—'));
  linea('Objetivos acordados: ' + ((p.impacto.objetivos || []).map(o =>
    (typeof o === 'string' ? o : o.t) + (o.logrado ? ' [LOGRADO]' : '')).join(' · ') || '—'));

  seccion('Tratamientos previos y su resultado');
  if ((p.tratamientosPrevios || []).length) {
    for (const t of p.tratamientosPrevios)
      linea('· ' + (t.que || '—') + ' — ' + (t.cuando || 's/f') + ' — ' + (t.resultado || 's/d') +
        (t.obs ? ' — ' + t.obs : ''));
  } else linea('—');

  seccion('Medicación actual');
  if ((p.medicacion || []).length) {
    for (const m of p.medicacion) {
      const f = FARMACOS[m.farmaco];
      linea('· ' + (f ? f.nombre : m.nombreLibre || '—') + ' ' + (m.dosis || '') + ' ' +
        (m.frecuencia || '') + (m.desde ? ' — desde ' + fechaCorta(m.desde) : ''));
    }
    linea('Carga opioide total: ' + a.seguridad.mme.total + ' MME/día (' + a.seguridad.mme.nivel + ')');
  } else linea('—');

  seccion('Examen físico');
  const signosTxt = [];
  for (const g of EXAMEN_SIGNOS)
    for (const i of g.items)
      if ((p.examen.signos || []).includes(i.v)) signosTxt.push(i.t);
  linea('Signos: ' + (signosTxt.join(' · ') || '—'));
  linea(p.examen.texto || '');
  if (p.examen.observaciones) linea('Observaciones: ' + p.examen.observaciones);

  seccion('Escalas aplicadas');
  const esc_ = Object.entries(p.escalas || {}).filter(([, v]) => v && v.total != null);
  if (esc_.length) {
    for (const [k, v] of esc_) {
      const e = ESCALAS[k];
      const corte = interpretarEscala(k, v.total);
      linea('· ' + (e ? e.sigla : k) + ': ' + v.total + (e && e.porcentual ? '%' : '') +
        (corte ? ' — ' + corte.etiqueta : '') + '  (' + fechaCorta(v.fecha) + ')' +
        (v.parcial ? ' [incompleta]' : ''));
    }
  } else linea('—');

  seccion('Impresión diagnóstica');
  linea('Síndrome: ' + (p.diagnostico.sindrome || '—'));
  linea('Código ICD-11: ' + (p.diagnostico.icd || '—'));
  linea('Mecanismo: ' + (p.diagnostico.mecanismo || '—') +
    (p.diagnostico.grado ? ' — grado ' + p.diagnostico.grado : ''));
  if (p.diagnostico.texto) linea(p.diagnostico.texto);
  linea('');
  linea('Lectura automática de la aplicación: ' + a.fenotipo.texto);
  if (a.diferencial.length)
    linea('Diferencial ponderado: ' + a.diferencial.slice(0, 4).map(d =>
      d.sindrome.nombre + ' ' + d.concordancia + '%').join(' · '));

  if (a.banderas.length) {
    seccion('Banderas rojas');
    for (const b of a.banderas) linea('· ' + b.txt + ' → ' + b.accion);
  }

  seccion('Plan terapéutico');
  linea('Objetivo: ' + (p.plan.objetivo || '—'));
  linea(p.plan.texto || '');
  if ((p.plan.estudios || []).length) linea('Estudios: ' + p.plan.estudios.join(' · '));
  if ((p.plan.noFarmacologico || []).length) linea('No farmacológico: ' + p.plan.noFarmacologico.join(' · '));
  if ((p.plan.derivaciones || []).length) linea('Derivaciones: ' + p.plan.derivaciones.join(' · '));
  if ((p.plan.procedimientos || []).length)
    linea('Procedimientos planificados: ' + p.plan.procedimientos.map(x =>
      (PROCEDIMIENTOS[x] || {nombre:x}).nombre).join(' · '));
  linea('Próximo control: ' + (p.proximoControl ? fechaCorta(p.proximoControl) : '—'));

  seccion('Evolución');
  if ((p.evoluciones || []).length) {
    for (const e of p.evoluciones) {
      linea('');
      linea('— ' + fechaCorta(e.fecha) + (e.nrs != null ? '   NRS ' + e.nrs + '/10' : ''));
      if (e.texto) linea(e.texto);
      if (e.cambios) linea('Cambios: ' + e.cambios);
      if ((e.adversos || []).length)
        linea('Efectos adversos: ' + e.adversos.map(x => x.t + (x.grave ? ' (grave)' : '')).join(' · '));
      if (e.escalas && Object.keys(e.escalas).length)
        linea('Escalas: ' + Object.entries(e.escalas).map(([k, v]) =>
          (ESCALAS[k] || {sigla:k}).sigla + ' ' + (typeof v === 'object' ? v.total : v)).join(' · '));
    }
  } else linea('—');

  seccion('Resultado del plan analgésico');
  if (ef.porcentaje != null) {
    linea('Efectividad global: ' + ef.porcentaje + '% — ' + ef.banda.etiqueta);
    for (const comp of Object.values(ef.componentes))
      linea('· ' + comp.etiqueta + ': ' + (comp.valor > 0 ? '+' : '') + comp.valor + '%  (' + comp.detalle + ')');
    linea(ef.resumen);
  } else linea('Todavía sin datos suficientes para medir.');

  if ((p.consentimientos || []).length) {
    seccion('Consentimientos informados');
    for (const k of p.consentimientos)
      linea('· ' + k.procedimiento + ' — ' + fechaCorta(k.fecha) + (k.firmado ? ' — FIRMADO' : ' — sin firmar'));
  }

  L.push('___________________________');
  L.push('Firma y sello del médico tratante');

  imprimirTexto('Historia clínica de dolor — ' + nombreCompleto(p), L.join('\n'));
}


/* =========================================================================
   DIAGNOSTICO DE CONEXION
   -------------------------------------------------------------------------
   "Se guardo en este dispositivo pero no en la nube" es un sintoma, no un
   diagnostico: puede ser falta de internet, una sesion vencida, unas reglas
   mal publicadas o una cuenta que no figura en el equipo. Las cuatro se ven
   iguales desde afuera y tienen soluciones distintas.

   Esta ventana prueba de verdad: lee y escribe en cada rama y dice cual
   falla y que hacer. Es lo que evita el "no anda" sin mas informacion.
   ========================================================================= */

function ventanaRevision() {
  abrir({id:'revision', titulo:'Diagnóstico de conexión',
    sub:'Prueba real de lectura y escritura', ancha:true, dibujar(c) {

      if (!firebaseConfigurado()) {
        c.innerHTML = vacio('La aplicación está en modo local',
          'No hay nada que diagnosticar: los datos viven solo en este dispositivo. ' +
          'Para sincronizar hay que configurar Firebase (PUBLICAR.md, pasos 2 a 4).');
        return;
      }

      const u = ESTADO.usuario || {};
      const yo = miembroActual();

      c.insertAdjacentHTML('beforeend', bloque('Quién sos para el servidor',
        dato('Sesión', u.uid ? marca('iniciada', 'verde') : marca('sin sesión', 'rojo')) +
        dato('Correo', esc(u.email || '—')) +
        dato('Identificador (uid)', '<span class="mono" style="font-size:11.5px">' +
          esc(u.uid || '—') + '</span>') +
        dato('Figurás en el equipo', yo
          ? marca('sí, como ' + ((ROLES[yo.rol] || {}).nombre || yo.rol), 'verde')
          : marca('NO — esto explica cualquier fallo de guardado', 'rojo')) +
        dato('Canal con el servidor', ESTADO.conectado
          ? marca('abierto', 'verde') : marca('cerrado', 'ambar') +
            '<div class="nota">El canal abierto no garantiza que puedas escribir: ' +
            'eso lo deciden las reglas.</div>') +
        dato('Versión que estás usando', '<span class="mono">' +
          esc(window.ALGOS_BUILD || '—') + '</span>' +
          '<div class="nota">Si no coincide con la última que subiste, el navegador ' +
          'guardó una copia vieja: recargá con Cmd+Shift+R.</div>')));

      /* El boton PRIMERO y la salida DEBAJO. Al reves, el resultado se
         insertaba encima del boton: empujaba el boton hacia abajo y aparecia
         fuera de donde uno esta mirando, con lo cual parecia que no habia
         pasado nada. */
      c.appendChild(superficie('Probar ahora',
        'Escribe y borra un dato de prueba en cada rama', () => correr(), 'acento'));

      const salida = document.createElement('div');
      c.appendChild(salida);

      function correr() {
        console.log('[ASHA] Diagnóstico iniciado', new Date().toISOString());
        salida.innerHTML =
          '<div class="bloque" style="border-left:3px solid var(--acento)">' +
          '<h3>Probando…</h3>' +
          '<p class="nota">Escribiendo y borrando un dato de prueba en cada rama. ' +
          'Tarda unos segundos. Si en 10 segundos no aparece el resultado, ' +
          'es que el servidor no está contestando.</p></div>';
        salida.scrollIntoView({block:'nearest'});
        const marcaTiempo = 'prueba_' + Date.now();

        /* Se prueban las ramas que la aplicacion usa de verdad. El dato de
           prueba se borra enseguida: no queda basura en la base. */
        const ramas = [
          {r:'pacientes',    que:'las historias clínicas'},
          {r:'precargas',    que:'los cuestionarios del portal'},
          {r:'agenda',       que:'la agenda'},
          {r:'equipo',       que:'el equipo'},
          {r:'invitaciones', que:'las invitaciones'},
          {r:'config',       que:'la configuración'}
        ];

        /* Tope de tiempo. Si Firebase no contesta, la promesa no se resuelve
           NUNCA y la pantalla se queda muda: el usuario toca el boton, no pasa
           nada, y no hay forma de saber si fallo o si esta esperando. Con el
           tope, siempre hay respuesta. */
        const conTope = (promesa, seg) => Promise.race([
          promesa,
          new Promise((_, rechazar) =>
            setTimeout(() => rechazar(new Error('sin respuesta en ' + seg + ' segundos')),
                       seg * 1000))
        ]);

        const pruebas = ramas.map(x =>
          conTope(fbDb.ref('dolor/' + x.r).limitToFirst(1).once('value'), 8)
            .then(() => ({...x, lectura:'ok'}))
            .catch(e => ({...x, lectura:'falla', errorL:e.code || e.message}))
            .then(res =>
              conTope(fbDb.ref('dolor/' + x.r + '/' + marcaTiempo).set({prueba:true}), 8)
                .then(() => fbDb.ref('dolor/' + x.r + '/' + marcaTiempo).remove().catch(() => {}))
                .then(() => ({...res, escritura:'ok'}))
                .catch(e => ({...res, escritura:'falla', errorE:e.code || e.message})))
        );

        /* Y la rama publica, que tiene que leerse SIN sesion. */
        pruebas.push(
          conTope(fbDb.ref('dolor/publico/instalado').once('value'), 8)
            .then(s => ({r:'publico/instalado', que:'la marca de instalado',
                         lectura:'ok', escritura:'—', valor:String(s.val())}))
            .catch(e => ({r:'publico/instalado', que:'la marca de instalado',
                          lectura:'falla', errorL:e.code || e.message, escritura:'—'})));

        Promise.all(pruebas).then(res => {
          const fallan = res.filter(x => x.lectura === 'falla' || x.escritura === 'falla');

          let h = '<div class="bloque"><h3>Resultado</h3>';
          for (const x of res) {
            const okL = x.lectura === 'ok', okE = x.escritura !== 'falla';
            h += '<div style="padding:8px 0;border-bottom:1px solid var(--linea)">' +
                 '<b style="font-size:14px">' + esc(x.que) + '</b> ' +
                 marca('leer: ' + (okL ? 'sí' : 'no'), okL ? 'verde' : 'rojo') + ' ' +
                 (x.escritura === '—' ? ''
                    : marca('escribir: ' + (okE ? 'sí' : 'no'), okE ? 'verde' : 'rojo')) +
                 (x.valor !== undefined ? ' <span class="nota">valor: ' + esc(x.valor) + '</span>' : '') +
                 ((x.errorL || x.errorE)
                    ? '<div class="nota mono" style="margin-top:3px">' +
                      esc([x.errorL, x.errorE].filter(Boolean).join(' · ')) + '</div>' : '') +
                 '</div>';
          }
          h += '</div>';
          salida.innerHTML = h;

          /* La interpretacion, que es lo que de verdad hace falta. */
          let conclusion;
          if (!fallan.length) {
            conclusion = '<div class="alerta info"><b>Todo funciona</b>' +
              '<p>Se pudo leer y escribir en todas las ramas. Si igual ves el aviso ' +
              'amarillo, lo más probable es que el navegador tenga guardada una versión ' +
              'vieja de la aplicación: recargá con <b>Cmd+Shift+R</b>.</p></div>';
          } else if (!ESTADO.usuario || !ESTADO.usuario.uid) {
            conclusion = '<div class="alerta alto"><b>No hay sesión iniciada</b>' +
              '<p>Sin sesión no se puede escribir nada. Salí y volvé a entrar.</p></div>';
          } else if (!yo) {
            conclusion = '<div class="alerta alto"><b>Tu cuenta no figura en el equipo</b>' +
              '<p>Tenés sesión, pero las reglas exigen estar en la lista del equipo y tu ' +
              'identificador no está. Nada de lo que escribas se va a guardar en el ' +
              'servidor. Hay que agregar tu cuenta al equipo.</p></div>';
          } else if (fallan.every(x => /permission/i.test((x.errorE || x.errorL || '')))) {
            conclusion = '<div class="alerta alto"><b>El servidor rechaza por permisos</b>' +
              '<p>La sesión está bien y figurás en el equipo, así que el problema está en ' +
              'las <b>reglas</b> de la base: o no se publicaron, o se publicó una versión ' +
              'incompleta. Volvé a pegar el contenido de <span class="mono">' +
              'reglas-firebase.txt</span> completo, desde la primera llave hasta la ' +
              'última, y tocá Publicar.</p>' +
              '<p class="nota">Ramas que fallan: ' +
              esc(fallan.map(x => x.que).join(', ')) + '</p></div>';
          } else if (fallan.every(x => /sin respuesta/i.test((x.errorE || x.errorL || '')))) {
            conclusion = '<div class="alerta alto"><b>El servidor no contesta</b>' +
              '<p>Las pruebas se agotaron sin recibir respuesta. No es un problema de ' +
              'permisos: directamente no hay diálogo con la base.</p>' +
              '<p class="nota">Suele ser la conexión, o que la dirección de la base ' +
              '(<span class="mono">databaseURL</span>) no sea la correcta. ' +
              'Revisá que en Firebase exista la <b>Realtime Database</b> y no solo ' +
              'Firestore.</p></div>';
          } else {
            conclusion = '<div class="alerta medio"><b>Falla intermitente</b>' +
              '<p>Algunas ramas respondieron y otras no, y el error no es de permisos. ' +
              'Suele ser la conexión. Probá de nuevo en un minuto.</p></div>';
          }
          salida.insertAdjacentHTML('beforeend', conclusion);
          salida.scrollIntoView({block:'nearest', behavior:'smooth'});
        })
        .catch(e => {
          /* Si algo revienta fuera de las pruebas, tambien hay que decirlo:
             un boton que no deja rastro es peor que uno que informa un error. */
          console.error('Diagnóstico:', e);
          salida.innerHTML =
            '<div class="alerta alto"><b>El diagnóstico no pudo terminar</b>' +
            '<p class="mono" style="font-size:12px">' + esc(e && e.message ? e.message : String(e)) +
            '</p><p class="nota">Suele ser falta de conexión. Probá de nuevo.</p></div>';
        });
      }
    }});
}

function quitarDemo() {
  let n = 0;
  for (const [id, p] of Object.entries(ESTADO.pacientes)) {
    if (p && p.demo) { borrar('pacientes', id); n++; }
  }
  for (const [t, p] of Object.entries(ESTADO.precargas)) {
    if (p && p.demo) { borrar('precargas', t); n++; }
  }
  avisar('Se quitaron ' + n + ' registros de prueba.', 'ok');
  volverA(0);
  ventanaInicio();
}

function hayDemo() {
  return Object.values(ESTADO.pacientes).some(p => p && p.demo) ||
         Object.values(ESTADO.precargas).some(p => p && p.demo);
}

/* =========================================================================
   PORTAL DEL PACIENTE
   -------------------------------------------------------------------------
   Dos direcciones, dos momentos:

     #turno       la persona que saco turno entra, deja su DNI y su correo, y
                  recibe por mail un ENLACE personal.
     #c=TOKEN     ese enlace. Abre el cuestionario, que se guarda solo paso a
                  paso, y termina en un boton de ENVIAR.

   Por que un enlace y no un codigo de seis digitos: un codigo que genera y
   verifica el mismo navegador no prueba absolutamente nada. El enlace, en
   cambio, solo llega a la casilla que la persona declaro, y eso si es una
   prueba de que ese correo le pertenece.

   El cuestionario reproduce las nueve secciones del formulario en papel y
   agrega tres cosas que valen la pena: la intensidad por punto en el mapa
   corporal, un tamizaje breve de animo, y los objetivos que el paciente
   quiere recuperar, que despues son la vara con la que se mide si el
   tratamiento sirvio.
   ========================================================================= */
'use strict';

const PASOS_PORTAL = [
  {id:'quien',   titulo:'Quién es usted'},
  {id:'antec',   titulo:'Antecedentes personales'},
  {id:'dolor',   titulo:'Historia del dolor'},
  {id:'mapa',    titulo:'Dónde le duele'},
  {id:'previos', titulo:'Tratamientos y medicación'},
  {id:'impacto', titulo:'Cómo le afecta la vida'},
  {id:'dn4',     titulo:'Características del dolor'},
  {id:'otros',   titulo:'Otros síntomas'},
  {id:'enviar',  titulo:'Revisar y enviar'}
];

let PRECARGA = null;      // el cuestionario que se esta completando
let PASO = 0;

/* Encabezado unico del portal. Estaba repetido en cuatro pantallas y en una
   de ellas faltaba la firma; con una sola funcion eso no puede volver a pasar. */
function cabezaPortal(bajada) {
  return '<div class="portal-cabeza"><b>' + esc(MARCA.nombre) + '</b>' +
    (MARCA.firma ? '<span style="color:var(--acento);display:block">' +
      esc(MARCA.firma) + '</span>' : '') +
    (bajada ? '<span>' + esc(bajada) + '</span>' : '') + '</div>';
}

/* -------------------------------------------------------------- entrada  */

function arrancarPortal() {
  document.body.className = 'portal';
  const h = location.hash || '';
  const conToken = h.match(/^#c=([a-f0-9]{20,})/i);
  const cont = document.createElement('div');
  cont.className = 'portal-caja';
  cont.id = 'portal';
  document.body.innerHTML = '';
  document.body.appendChild(cont);
  document.body.insertAdjacentHTML('beforeend', '<div id="avisos"></div>');

  cont.insertAdjacentHTML('beforeend',
    cabezaPortal(MARCA.bajada));

  if (conToken) cargarCuestionario(conToken[1]);
  else pantallaPedirEnlace();
}

/* ---------------------------------------------------- pedir el enlace --- */

function pantallaPedirEnlace() {
  const cont = $('#portal');
  const v = document.createElement('section');
  v.className = 'ventana';
  v.innerHTML = '<header><div><h2>Cuestionario previo a la consulta</h2>' +
    '<div class="sub">Para completar antes de su turno</div></div></header>' +
    '<div class="cuerpo"></div>';
  const c = $('.cuerpo', v);

  c.insertAdjacentHTML('beforeend',
    '<p>Complete este formulario antes de su turno con el especialista en dolor. ' +
    'Cuanta más información aporte, más completa será la evaluación el día de la consulta.</p>' +
    '<p class="nota">Le vamos a enviar un enlace a su correo. Puede completarlo en varias ' +
    'veces: lo que escriba se guarda solo. Tarda entre 10 y 15 minutos.</p>');

  const d = {dni:'', email:'', email2:'', turno:''};
  campo(c, 'Número de documento', d, 'dni',
        {pista:'sin puntos', ayuda:'Solo números, sin puntos ni espacios.'});
  campo(c, 'Correo electrónico', d, 'email', {tipo:'email', pista:'nombre@correo.com'});
  campo(c, 'Repita su correo electrónico', d, 'email2', {tipo:'email',
        ayuda:'Lo pedimos dos veces porque el enlace se envía ahí y no hay forma de recuperarlo si está mal escrito.'});
  campo(c, 'Fecha de su turno (si ya la tiene)', d, 'turno', {tipo:'date'});

  c.appendChild(superficie('Enviarme el enlace', 'Llega a su correo en menos de un minuto', () => {
    const dni = dniLimpio(d.dni);
    if (dni.length < 7) return avisar('Revise el número de documento.', 'error');
    if (!emailValido(d.email)) return avisar('El correo no parece válido.', 'error');
    if (d.email.trim().toLowerCase() !== d.email2.trim().toLowerCase())
      return avisar('Los dos correos no coinciden.', 'error');
    crearPrecarga(dni, d.email.trim().toLowerCase(), d.turno);
  }, 'acento'));

  c.insertAdjacentHTML('beforeend', '<p class="nota" style="margin-top:18px">' + esc(LEGAL_PIE) + '</p>');
  cont.appendChild(v);
}

function crearPrecarga(dni, email, turno) {
  const token = tokenSeguro();
  const p = {
    token, dni, email, turno: turno || '',
    creado: ahora(), modificado: ahora(),
    estado: 'borrador',              // borrador | enviado | tomado
    datos: cuestionarioVacio()
  };
  p.datos.dni = dni;
  p.datos.email = email;

  pantallaPortal('Enviando…', '<p class="nota">Un momento.</p>');

  /* El enlace NO se muestra en pantalla, ni siquiera cuando el envio falla.
     Todo el sentido de mandarlo por correo es que llegue a la casilla que la
     persona declaro: si ademas se lo mostraramos acá, cualquiera podria poner
     el DNI de otro y entrar igual, y el correo dejaria de probar nada.

     Por eso tampoco hay un boton de "empezar ahora": la unica puerta es el
     mail. Si el envio falla, se dice que fallo y se lo deriva al consultorio. */
  guardar('precargas', token, p).then(guardado => {
    if (!guardado && fbDb) {
      pantallaPortal('No pudimos registrar su solicitud',
        '<p>Hubo un problema al guardar sus datos y no podemos enviarle el enlace.</p>' +
        '<p class="nota">Por favor, comuníquese con el consultorio' +
        (MARCA.telefono && MARCA.telefono !== '-' ? ' al <b>' + esc(MARCA.telefono) + '</b>' : '') +
        (MARCA.whatsapp ? ' o por WhatsApp' : '') +
        '. También puede completar el cuestionario en papel el día de la consulta.</p>');
      return;
    }

    const enlace = location.origin + location.pathname + '#c=' + token;
    enviarEnlacePorMail(email, enlace, dni).then(ok => {
      if (ok) {
        pantallaPortal('Le enviamos el enlace',
          '<p>Revise su casilla <b>' + esc(email) + '</b>. Si no lo ve en unos minutos, ' +
          'mire en la carpeta de correo no deseado.</p>' +
          '<p><b>Guarde ese correo.</b> Ese enlace es el único que le permite entrar y ' +
          'volver a entrar para seguir completando el cuestionario en otro momento.</p>' +
          '<p class="nota">Ya puede cerrar esta página.</p>');
      } else {
        pantallaPortal('No pudimos enviarle el correo',
          '<p>Sus datos quedaron registrados, pero el correo no pudo salir en este momento.</p>' +
          '<p class="nota">Por favor, comuníquese con el consultorio' +
          (MARCA.telefono && MARCA.telefono !== '-' ? ' al <b>' + esc(MARCA.telefono) + '</b>' : '') +
          ' para que le reenvíen el enlace, o complete el cuestionario en papel el día ' +
          'de la consulta.</p>');
      }
    });
  });
}

/* Pantalla simple del portal: un titulo y un texto, sin nada mas que tocar.
   Se usa para todos los finales de camino. */
function pantallaPortal(titulo, cuerpoHTML) {
  const cont = $('#portal');
  cont.innerHTML = cabezaPortal();
  const v = document.createElement('section');
  v.className = 'ventana';
  v.innerHTML = '<header><div><h2>' + esc(titulo) + '</h2></div></header>' +
                '<div class="cuerpo">' + cuerpoHTML + '</div>';
  cont.appendChild(v);
  window.scrollTo(0, 0);
}

        '<p>Este enlace no corresponde a ningún cuestionario.</p>' +
        '<p class="nota">Lo más común es que se haya copiado cortado. El enlace es ' +
        'largo y termina con una tira de letras y números después del signo <b>#</b>. ' +
        'Volvé al correo y tocá directamente el botón, en vez de copiar y pegar.</p>' +
        '<p class="nota">Si el problema sigue, comuniquese con el consultorio' +
        (MARCA.telefono && MARCA.telefono !== '-' ? ' al ' + esc(MARCA.telefono) : '') +
        ' para que le reenvíen el enlace.</p>');
      return;
    }
    if (p.estado === 'enviado' || p.estado === 'tomado') { pantallaYaEnviado(p); return; }
    PRECARGA = p;
    if (!PRECARGA.datos) PRECARGA.datos = cuestionarioVacio();
    PASO = 0;
    pintarPaso();
  };

  /* Si no se puede LEER, no es lo mismo que no exista: decir "no encontrado"
     ante un problema de conexion hace que el paciente tire el enlace a la
     basura creyendo que no sirve. Se distinguen los dos casos. */
  const noSePudoLeer = e => {
    console.error('Lectura de la precarga:', e);
    pantallaPortal('No pudimos abrir su cuestionario',
      '<p>El enlace es correcto, pero no pudimos conectarnos para abrirlo.</p>' +
      '<p class="nota"><b>No borre el correo.</b> Vuelva a intentarlo en unos minutos, ' +
      'o desde otra conexión.</p>');
  };

  const local = ESTADO.precargas[token];
  if (local) return seguir(local);

  if (!fbDb) return seguir(null);
  fbDb.ref('dolor/precargas/' + token).once('value')
    .then(s => seguir(s.val()))
    .catch(noSePudoLeer);
}

function guardarPrecarga() {
  if (!PRECARGA) return;
  PRECARGA.modificado = ahora();
  guardar('precargas', PRECARGA.token, PRECARGA);
}

function pintarPaso() {
  const cont = $('#portal');
  cont.innerHTML = cabezaPortal('Cuestionario previo a la consulta');

  cont.insertAdjacentHTML('beforeend', '<div class="pasos">' +
    PASOS_PORTAL.map((p, i) =>
      '<i class="' + (i < PASO ? 'hecho' : i === PASO ? 'actual' : '') + '"></i>').join('') +
    '</div>');

  const paso = PASOS_PORTAL[PASO];
  const v = document.createElement('section');
  v.className = 'ventana';
  v.innerHTML = '<header><div><h2>' + esc(paso.titulo) + '</h2>' +
    '<div class="sub">Paso ' + (PASO + 1) + ' de ' + PASOS_PORTAL.length + '</div>' +
    '</div></header><div class="cuerpo"></div>';
  const c = $('.cuerpo', v);
  const d = PRECARGA.datos;

  ({
    quien:pasoQuien, antec:pasoAntecedentes, dolor:pasoDolor, mapa:pasoMapa,
    previos:pasoPrevios, impacto:pasoImpacto, dn4:pasoDN4, otros:pasoOtros, enviar:pasoEnviar
  })[paso.id](c, d);

  /* Navegación: dos superficies, sin barra de botones. */
  if (paso.id !== 'enviar') {
    const nav = document.createElement('div');
    nav.className = 'fila';
    nav.style.marginTop = '22px';
    if (PASO > 0) nav.appendChild(superficie('◀ Anterior', null, () => { PASO--; pintarPaso(); }));
    nav.appendChild(superficie('Continuar ▶', null, () => {
      guardarPrecarga(); PASO++; pintarPaso(); window.scrollTo(0, 0);
    }, 'acento'));
    c.appendChild(nav);
    c.insertAdjacentHTML('beforeend',
      '<p class="nota" style="margin-top:12px;text-align:center">Lo que escribió se guarda solo. ' +
      'Puede cerrar y volver con el mismo enlace.</p>');
  }

  cont.appendChild(v);
  window.scrollTo(0, 0);
}

/* -------------------------------------------------------------------------
   Lista de filas que el paciente agrega y quita: tratamientos previos y
   medicacion. Se maneja igual en los dos casos.
   ------------------------------------------------------------------------- */
function listaEditable(nodo, lista, columnas, textoAgregar, alCambiar) {
  const cont = document.createElement('div');
  nodo.appendChild(cont);

  function pintar() {
    cont.innerHTML = '';
    lista.forEach((fila, i) => {
      const caja = document.createElement('div');
      caja.className = 'bloque';
      caja.style.marginBottom = '9px';
      const grilla = document.createElement('div');
      grilla.className = 'dos';
      caja.appendChild(grilla);
      for (const col of columnas) {
        if (col.lista) {
          const cc = document.createElement('div'); cc.className = 'campo';
          cc.innerHTML = '<label>' + esc(col.t) + '</label>';
          grilla.appendChild(cc);
          opciones(cc, col.lista, fila[col.k], v => { fila[col.k] = v; alCambiar(); pintar(); });
        } else {
          campo(grilla, col.t, fila, col.k, {pista:col.pista, alCambiar});
        }
      }
      caja.appendChild(superficie('Quitar', null, () => {
        lista.splice(i, 1); alCambiar(); pintar();
      }, 'fina peligro'));
      cont.appendChild(caja);
    });
    cont.appendChild(superficie('+ ' + textoAgregar, null, () => {
      const f = {}; for (const col of columnas) f[col.k] = '';
      lista.push(f); alCambiar(); pintar();
    }, 'suave'));
  }
  pintar();
}

/* ================ app.js ================ */
/* =========================================================================
   ARRANQUE
   -------------------------------------------------------------------------
   Decide en que modo abre la aplicacion:

     #turno   o  #c=TOKEN     -> portal del paciente, sin pedir cuenta
     cualquier otra cosa      -> consultorio, con cuenta

   El portal tiene que poder abrirse SIN sesion: el paciente no tiene cuenta
   ni la va a tener. Por eso se decide antes de mirar la autenticacion.
   ========================================================================= */
'use strict';

function esPortal() {
  const h = location.hash || '';
  return h === '#turno' || /^#c=[a-f0-9]{20,}/i.test(h);
}

function iniciarAplicacion() {
  document.body.className = '';
  /* Se mira #pila y no #app: la pantalla de entrada tambien monta un #app
     propio, asi que preguntar por #app dejaba el armazon de la entrada en su
     lugar y despues no habia donde dibujar las ventanas. */
  if (!$('#pila')) {
    document.body.innerHTML = window.ALGOS_BODY;
  }
  /* El nombre, la firma y la bajada ya vienen escritos en el HTML desde
     build.py, asi que no hace falta volver a ponerlos: hacerlo producia un
     parpadeo. Solo se enganchan aca por si el cuerpo se restauro. */
  if (!$('#marcaNombre').textContent) $('#marcaNombre').textContent = MARCA.nombre;
  $('#volverInicio').onclick = () => volverA(0);
  pintarEstadoConexion();
  pintarUsuario();
  escucharDatos();
  ESTADO.listo = true;
  /* Los borrados diferidos vencidos se ejecutan al abrir, porque el plazo
     pudo cumplirse con la aplicacion cerrada. */
  vigilarBorrados();
  PILA.length = 0;
  ventanaInicio();
}

function arrancar() {
  cargarLocal();
  window.ALGOS_BODY = document.body.innerHTML;
  iniciarFirebase();

  if (esPortal()) { arrancarPortal(); return; }
  if (firebaseConfigurado() && fbAuth) vigilarSesion();
  else pantallaEntrada();

  /* Si el usuario pega un enlace del portal con la aplicación ya abierta,
     se recarga en modo portal en vez de quedarse en una pantalla que no
     corresponde. */
  window.addEventListener('hashchange', () => {
    if (esPortal()) location.reload();
  });
}

/* Registro del service worker: la aplicación tiene que abrir sin internet.
   En un consultorio la conexión se cae, y una historia clínica que no se
   puede abrir cuando el paciente está sentado enfrente no sirve. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

document.addEventListener('DOMContentLoaded', arrancar);

</script>
</body>
</html>
