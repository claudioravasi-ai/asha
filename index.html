/* =========================================================================
   LA CUENTA, ARRIBA A LA DERECHA
   -------------------------------------------------------------------------
   Un cuadradito con las iniciales que abre un panel chico con quien sos, tu
   rol y la salida. Salir tiene que estar SIEMPRE a un toque de distancia y
   a la vista: enterrado en Ajustes, en una computadora compartida, nadie lo
   usa y las sesiones quedan abiertas.
   ========================================================================= */

function pintarUsuario() {
  const n = $('#usuario');
  if (!n) return;

  const m = miembroActual();
  const nombre = m ? (m.nombre || m.email)
    : (ESTADO.usuario && ESTADO.usuario.email) || '';

  if (!nombre) { n.textContent = ''; n.onclick = null; return; }

  /* Iniciales: dos letras del nombre, o dos del correo si no hay nombre. */
  const ini = nombre.includes('@')
    ? nombre.slice(0, 2).toUpperCase()
    : nombre.trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  n.textContent = ini;
  n.title = nombre;
  n.onclick = e => { e.stopPropagation(); abrirPanelCuenta(); };
}

function abrirPanelCuenta() {
  const viejo = $('.panel-cuenta');
  if (viejo) { viejo.remove(); return; }

  const m = miembroActual();
  const email = (ESTADO.usuario && ESTADO.usuario.email) || '';
  const nombre = m ? (m.nombre || email) : email;
  const rol = m ? (ROLES[m.rol] || {}).nombre : (firebaseConfigurado() ? '' : 'Modo local');

  const panel = document.createElement('div');
  panel.className = 'panel-cuenta';
  panel.innerHTML =
    '<div class="quien"><b>' + esc(nombre) + '</b>' +
    (rol ? '<small>' + esc(rol) + '</small>' : '') +
    (email && email !== nombre ? '<small>' + esc(email) + '</small>' : '') +
    '</div>';

  const item = (texto, clase, alTocar) => {
    const d = document.createElement('div');
    d.className = 'item' + (clase ? ' ' + clase : '');
    d.textContent = texto;
    d.onclick = () => { panel.remove(); alTocar(); };
    panel.appendChild(d);
  };

  if (firebaseConfigurado() && esTitular()) item('Equipo', '', ventanaEquipo);
  item('Ajustes', '', ventanaAjustes);
  item('Copia de seguridad', '', exportarRespaldo);

  if (fbAuth && ESTADO.usuario && ESTADO.usuario.uid) {
    item('Salir', 'salir', () => {
      confirmar('Salir de ' + MARCA.nombre,
        'Se cierra la sesión en este dispositivo. Lo que esté guardado en la nube queda ' +
        'intacto y lo volvés a ver al entrar de nuevo.',
        () => {
          fbAuth.signOut()
            .then(() => location.reload())
            .catch(() => avisar('No se pudo cerrar la sesión.', 'error'));
        }, 'Sí, salir');
    });
  } else {
    item('Salir', 'salir', () => {
      confirmar('Salir de ' + MARCA.nombre,
        'Estás en modo local: los datos viven solo en este dispositivo y NO se borran al ' +
        'salir. Se vuelve a la pantalla de entrada.',
        () => location.reload(), 'Sí, salir');
    });
  }

  document.body.appendChild(panel);

  /* Se cierra al tocar en cualquier otro lado. */
  setTimeout(() => {
    const cerrar = e => {
      if (!panel.contains(e.target)) {
        panel.remove();
        document.removeEventListener('click', cerrar);
      }
    };
    document.addEventListener('click', cerrar);
  }, 0);
}

/* =========================================================================
   ENTRADA, BASE DE PACIENTES Y BANDEJA DE PRECARGADOS
   -------------------------------------------------------------------------
   La pantalla de entrada es un mosaico de ventanas grandes. No hay menu
   porque no hace falta: lo que se puede hacer esta a la vista y se toca.
   ========================================================================= */
'use strict';

/* ====================================================== INICIO ========== */

function ventanaInicio() {
  abrir({
    id:'inicio', titulo:MARCA.nombre, sub:MARCA.bajada, ancha:true,
    dibujar(c) {
      const pacientes = Object.values(ESTADO.pacientes);
      const precargas = Object.values(ESTADO.precargas);
      const nuevos = precargas.filter(p => p.estado === 'enviado');
      const activos = pacientes.filter(p => p.proximoControl && p.proximoControl >= hoy());
      const agudos = pacientes.filter(p => p.ambito === 'agudo' && p.altaAgudo !== true);

      /* Lo primero es lo que no puede esperar: banderas rojas sin resolver. */
      const conBandera = pacientes.filter(p => {
        const b = (p.antecedentes && p.antecedentes.banderas) || [];
        return b.some(x => ['esfinteres','deficit_progresivo','silla_montar'].includes(x)) &&
               !p.banderaRevisada;
      });
      const porBorrar = pacientes.filter(x => segundosParaBorrar(x) != null);
      if (porBorrar.length) {
        const av = document.createElement('div');
        av.className = 'alerta urgente';
        av.innerHTML = '<b>' + porBorrar.length + ' historia' +
          (porBorrar.length === 1 ? '' : 's') + ' con borrado programado</b>' +
          '<p>' + porBorrar.map(x => esc(nombreCompleto(x)) + ' — se borra en ' +
            relojBorrado(segundosParaBorrar(x))).join(' · ') +
          '. Entrá a la historia para cancelarlo.</p>';
        c.appendChild(av);
      }

      if (conBandera.length) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta urgente"><b>' + conBandera.length + ' paciente' +
          (conBandera.length === 1 ? '' : 's') + ' con bandera roja sin revisar</b>' +
          '<p>' + esc(conBandera.map(nombreCompleto).join(' · ')) + '</p></div>');
      }

      const m = document.createElement('div');
      m.className = 'mosaico';
      c.appendChild(m);

      teja(m, nuevos.length, 'Precargados',
        nuevos.length ? 'Cuestionarios enviados por pacientes, listos para tomar en consulta'
                      : 'Sin cuestionarios nuevos',
        ventanaPrecargados, nuevos.length ? 'destaca' : '');

      teja(m, pacientes.length, 'Pacientes',
        'Base completa de historias clínicas de dolor', ventanaPacientes);

      teja(m, activos.length, 'En seguimiento',
        'Con control programado a futuro', () => ventanaPacientes('seguimiento'));

      teja(m, agudos.length, 'Dolor agudo',
        'Interconsultas y postoperatorios en curso', ventanaAgudo);

      teja(m, '', 'Estadísticas',
        'Efectividad, diagnósticos y carga opioide del consultorio', ventanaEstadisticas);

      teja(m, '', 'Biblioteca',
        'Síndromes, vademécum, procedimientos y escalas', ventanaBiblioteca);

      c.insertAdjacentHTML('beforeend', '<div style="height:14px"></div>');
      c.appendChild(superficie('+ Paciente nuevo',
        'Abrir una historia clínica de dolor desde cero', () => {
          const p = pacienteNuevo();
          guardar('pacientes', p.id, p);
          ventanaHistoria(p.id);
        }, 'suave'));

      c.appendChild(superficie('Enlace del portal del paciente',
        'La dirección que se le pasa a quien saca turno', () => {
          const url = location.origin + location.pathname + '#turno';
          abrir({id:'enlace', titulo:'Portal del paciente', dibujar(cc) {
            cc.insertAdjacentHTML('beforeend',
              '<p>Esta es la dirección que se le da a la persona cuando saca el turno. ' +
              'Ahí deja su documento y su correo, y le llega el enlace a su cuestionario.</p>' +
              '<div class="bloque"><h3>Dirección del portal</h3>' +
              '<p class="mono" style="word-break:break-all">' + esc(url) + '</p></div>' +
              '<p class="nota">Conviene imprimirla en el ticket del turno o dejar un código QR ' +
              'en el mostrador. Es el paso que más cuesta: la aplicación puede estar impecable, ' +
              'pero si el paciente no se entera de que existe, nadie la usa.</p>');
            cc.appendChild(superficie('Copiar la dirección', null, () => {
              navigator.clipboard.writeText(url)
                .then(() => avisar('Dirección copiada.', 'ok'))
                .catch(() => avisar('No se pudo copiar. Seleccionala a mano.', 'error'));
            }, 'suave'));
          }});
        }, 'fina'));

      c.appendChild(superficie('Ajustes y copia de seguridad', null, ventanaAjustes, 'fina'));

      /* La version, siempre a la vista y al pie. Cuando alguien dice que no le
         aparece algo, lo primero que hay que saber es que version esta usando:
         casi siempre es una vieja que quedo en el cache del navegador. */
      const v = versionLegible();
      c.insertAdjacentHTML('beforeend',
        '<p class="nota" style="text-align:center;margin-top:20px;padding-top:14px;' +
        'border-top:1px solid var(--linea);font-size:11.5px">' +
        esc(MARCA.nombre) + (MARCA.firma ? ' · ' + esc(MARCA.firma) : '') + '<br>' +
        esc(v.texto) + '</p>');
    }
  });
}

function teja(cont, numero, titulo, detalle, alTocar, clase) {
  const t = document.createElement('div');
  t.className = 'teja' + (clase ? ' ' + clase : '');
  t.innerHTML = (numero !== '' ? '<div class="n">' + numero + '</div>' : '<div></div>') +
    '<div><b>' + esc(titulo) + '</b><small>' + esc(detalle) + '</small></div>';
  t.onclick = alTocar;
  cont.appendChild(t);
}

/* ====================================================== PACIENTES ======= */

function ventanaPacientes(filtro) {
  abrir({
    id:'pacientes', titulo:'Pacientes',
    sub:Object.keys(ESTADO.pacientes).length + ' historias clínicas',
    ctx:{busqueda:'', filtro:filtro || ''},
    dibujar(c, ctx) {
      const buscador = document.createElement('div');
      buscador.className = 'campo';
      buscador.innerHTML = '<input type="text" placeholder="Buscar por apellido, documento o diagnóstico" ' +
        'value="' + esc(ctx.busqueda) + '">';
      c.appendChild(buscador);
      const inp = $('input', buscador);
      inp.oninput = () => { ctx.busqueda = inp.value; pintarLista(); };

      const lista = document.createElement('div');
      c.appendChild(lista);

      function pintarLista() {
        let ps = buscarPacientes(ctx.busqueda);
        if (ctx.filtro === 'seguimiento') ps = ps.filter(p => p.proximoControl && p.proximoControl >= hoy());
        lista.innerHTML = '';
        if (!ps.length) {
          lista.innerHTML = vacio(ctx.busqueda ? 'Sin resultados' : 'Todavía no hay pacientes',
            ctx.busqueda ? 'Probá con otro apellido o con el número de documento.'
                         : 'Los pacientes entran desde el portal o se cargan a mano desde la pantalla de inicio.');
          return;
        }
        for (const p of ps) lista.appendChild(filaPaciente(p));
      }
      pintarLista();
    }
  });
}

function filaPaciente(p) {
  const n = document.createElement('div');
  n.className = 'pac';
  const ef = efectividadPaciente(p);
  const dx = (p.diagnostico && p.diagnostico.sindrome) || 'Sin diagnóstico cargado';
  const nrs = ultimoNRS(p);
  const ultima = (p.evoluciones || []).length
    ? p.evoluciones[p.evoluciones.length - 1].fecha : p.creado;

  const faltan = segundosParaBorrar(p);
  n.innerHTML =
    '<div class="ini"' + (faltan != null
      ? ' style="background:rgba(217,43,43,.14);color:var(--rojo)"' : '') + '>' +
    esc(iniciales(p)) + '</div>' +
    '<div class="med"><b>' + esc(nombreCompleto(p)) + '</b>' +
    '<small>' + (faltan != null
      ? '<span style="color:var(--rojo);font-weight:600">Se borra en ' +
        relojBorrado(faltan) + '</span> · '
      : '') +
    esc(dx) + (nrs != null ? ' · NRS ' + nrs : '') +
    ' · ' + esc(desdeHace(ultima)) + '</small></div>' +
    anilloEfectividad(ef.porcentaje, 46);
  n.onclick = () => ventanaHistoria(p.id);
  return n;
}

/* ====================================================== PRECARGADOS ===== */

function ventanaPrecargados() {
  abrir({
    id:'precargados', titulo:'Pacientes precargados',
    sub:'Cuestionarios que los pacientes completaron desde su casa',
    dibujar(c) {
      const todas = Object.values(ESTADO.precargas)
        .sort((a, b) => (b.enviado || b.modificado || '').localeCompare(a.enviado || a.modificado || ''));
      const enviadas = todas.filter(p => p.estado === 'enviado');
      const borradores = todas.filter(p => p.estado === 'borrador');

      if (!todas.length) {
        c.innerHTML = vacio('Todavía no llegó ningún cuestionario',
          'Cuando un paciente entre al portal con su documento y su correo, complete el ' +
          'cuestionario y lo envíe, va a aparecer acá.');
        return;
      }

      if (enviadas.length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin-bottom:9px">Listos para la consulta · ' + enviadas.length + '</h3>');
        for (const p of enviadas) c.appendChild(filaPrecarga(p));

          '<p class="nota" style="margin-bottom:9px">Todavía los está completando el paciente. ' +
          'Se pueden mirar, pero conviene esperar a que los envíe.</p>');
        for (const p of borradores) c.appendChild(filaPrecarga(p));

function filaPrecarga(p) {
  const d = p.datos || {};
  const quien = [d.apellido, d.nombre].filter(Boolean).join(', ') || ('DNI ' + p.dni);
  const alarma = (d.banderas || []).length;
  const n = document.createElement('div');
  n.className = 'pac';
  n.innerHTML =
    '<div class="ini" ' + (alarma ? 'style="background:rgba(217,43,43,.14);color:var(--rojo)"' : '') + '>' +
    (alarma ? '!' : esc((d.apellido || '?')[0].toUpperCase())) + '</div>' +
    '<div class="med"><b>' + esc(quien) + '</b><small>' +
    (p.turno ? 'Turno ' + esc(fechaCorta(p.turno)) + ' · ' : '') +
    (d.nrsPromedio != null ? 'NRS ' + d.nrsPromedio + ' · ' : '') +
    (d.mapa || []).length + ' puntos · ' + esc(desdeHace(p.enviado || p.modificado)) +
    '</small></div>' +
    (alarma ? marca(alarma + ' alarma' + (alarma === 1 ? '' : 's'), 'rojo') : '');
  n.onclick = () => ventanaVerPrecarga(p.token);
  return n;
}

        dato('Desde', d.inicio ? fechaCorta(d.inicio) + ' (' + (mesesDesde(d.inicio) || 0) + ' meses)' : '—') +

        dato('En sus palabras', esc(d.descripcion)) +

        dato('Peor momento', esc(d.peorMomento)) +
        dato('Irradiación', esc(d.irradiacion)) +
        dato('Lo alivia', esc(d.alivia)) +
        dato('Lo empeora', esc(d.empeora))));

      const cm = document.createElement('div');
      cm.className = 'bloque';
      cm.innerHTML = '<h3>Mapa del dolor</h3>';

          (dn4Resp >= 3 ? marca('sugiere componente neuropático', 'violeta')
                        : marca('por debajo del umbral', 'verde')) +
          '<div class="nota">El puntaje definitivo se completa con las tres maniobras del ' +
          'examen físico durante la consulta.</div>')));

      if ((d.tratamientos || []).length) {
        c.insertAdjacentHTML('beforeend', bloque('Tratamientos previos',
          d.tratamientos.map(t => dato(esc(t.que || '—'),
            esc([t.cuando, t.resultado, t.obs].filter(Boolean).join(' · ')))).join('')));
      }
      if ((d.medicacion || []).length) {
        c.insertAdjacentHTML('beforeend', bloque('Medicación que declara',
          d.medicacion.map(m => dato(esc(m.nombre || '—'),
            esc([m.dosis, m.frecuencia, m.desde].filter(Boolean).join(' · ')))).join('')));
      }

      c.insertAdjacentHTML('beforeend', bloque('Impacto en la vida diaria',
        dato('Sueño', esc(d.sueño)) + dato('Trabajo', esc(d.trabajo)) +
        dato('Ánimo', esc(d.animo)) + dato('Dejó de hacer', esc(d.dejoDeHacer)) +
        dato('Qué quiere recuperar', '<b>' + esc(d.objetivos) + '</b>')));

      const phq4 = (d.phq4 || []).reduce((s, v) => s + (v || 0), 0);
      if ((d.phq4 || []).some(v => v != null)) {
        c.insertAdjacentHTML('beforeend', bloque('Tamizaje de ánimo (PHQ-4)',
          dato('Puntaje', '<b>' + phq4 + ' / 12</b> ' +
            (phq4 >= 6 ? marca('positivo: ampliar con PHQ-9 y GAD-7', 'ambar')
                       : marca('negativo', 'verde')))));
      }

      if (d.comentarios) {
        c.insertAdjacentHTML('beforeend', bloque('Lo que quiso decirle',
          '<p>' + esc(d.comentarios) + '</p>'));
      }

      c.appendChild(superficie('Descartar este cuestionario', null, () => {
        confirmar('Descartar el cuestionario',
          'Se va a borrar el cuestionario de ' + ((d.apellido || '') + ' ' + (d.nombre || '')).trim() +
          '. Esta acción no se puede deshacer.',
          () => { borrar('precargas', token); volverA(PILA.length - 2); avisar('Cuestionario descartado.'); },
          'Sí, descartar');
      }, 'fina peligro'));
    }
  });
}

/* -------------------------------------------------------------------------
   Volcar el cuestionario del paciente en una historia clinica.
   Si ya existe un paciente con ese documento, se completa el que hay en vez
   de duplicarlo: nada peor que dos historias de la misma persona.
   ------------------------------------------------------------------------- */
function incorporarPrecarga(token) {
  const pre = ESTADO.precargas[token];
  if (!pre) return;
  const d = pre.datos || {};

  let p = Object.values(ESTADO.pacientes).find(x => dniLimpio(x.dni) === dniLimpio(pre.dni));
  const esNuevo = !p;
  if (esNuevo) p = pacienteNuevo();

  p.origen = 'portal';
  p.apellido = d.apellido || p.apellido;
  p.nombre = d.nombre || p.nombre;
  p.dni = d.dni || pre.dni || p.dni;
  p.fechaNac = d.fechaNac || p.fechaNac;
  p.sexo = d.sexo || p.sexo;
  p.email = d.email || pre.email || p.email;
  p.telefono = d.telefono || p.telefono;
  p.obraSocial = d.obraSocial || p.obraSocial;
  p.ocupacion = d.ocupacion || p.ocupacion;
  p.derivante = d.derivante || p.derivante;

  p.antecedentes = {...p.antecedentes,
    enfermedades:d.enfermedades || '', cirugias:d.cirugias || '',
    alergias:d.alergias || '', familiares:d.familiares || '', habitos:d.habitos || '',
    banderas:[...new Set([...(p.antecedentes.banderas || []), ...(d.banderas || [])])],
    etiquetas:p.antecedentes.etiquetas || []};

  p.dolor = {...p.dolor,
    inicio:d.inicio || '', mecanismo:d.mecanismo || '', descripcion:d.descripcion || '',
    descriptores:d.descriptores || [],
    nrsAhora:d.nrsAhora, nrsPromedio:d.nrsPromedio, nrsPeor:d.nrsPeor, nrsMejor:d.nrsMejor,
    patron:d.patron || '', peorMomento:d.peorMomento || '', irradiacion:d.irradiacion || '',
    alivia:d.alivia || '', empeora:d.empeora || '',
    mapa:d.mapa || [], meses:mesesDesde(d.inicio),
    fechaHistoria:hoy()};

  p.impacto = {sueño:d.sueño || '', trabajo:d.trabajo || '', animo:d.animo || '',
               dejoDeHacer:d.dejoDeHacer || '',
               objetivos:d.objetivos ? [d.objetivos] : []};

  p.tratamientosPrevios = (d.tratamientos || []).map(t => ({
    que:t.que || '', cuando:t.cuando || '', resultado:t.resultado || '', obs:t.obs || ''}));
  p.medicacion = (d.medicacion || []).map(m => ({
    id:uid('med'), farmaco:reconocerFarmaco(m.nombre), nombreLibre:m.nombre || '',
    dosis:m.dosis || '', frecuencia:m.frecuencia || '', desde:m.desde || ''}));

  /* El DN4 entra con las 7 respuestas del paciente; las tres del examen
     quedan en null hasta que el médico las complete en la consulta. */
  p.escalas = p.escalas || {};
  if ((d.dn4 || []).some(x => x != null)) {
    p.escalas.dn4 = {items:[...(d.dn4 || []), null, null, null], fecha:hoy(),
                     total:(d.dn4 || []).reduce((s, v) => s + (v || 0), 0), parcial:true};
  }

  p.modificado = ahora();
  p.precargaToken = token;

  pre.estado = 'tomado';
  pre.tomadoPor = (ESTADO.usuario && ESTADO.usuario.email) || '';
  pre.tomado = ahora();

  guardar('pacientes', p.id, p);
  guardar('precargas', token, pre);

  avisar(esNuevo ? 'Historia clínica creada con los datos del cuestionario.'
                 : 'Los datos se volcaron sobre la historia existente.', 'ok');
  volverA(0);
  ventanaHistoria(p.id);
}

/* Intenta reconocer el nombre que escribio el paciente y engancharlo con el
   vademecum. Si no lo reconoce, devuelve cadena vacia y el nombre libre
   queda igual guardado: es preferible no adivinar mal. */
function reconocerFarmaco(nombre) {
  const n = normalizar(nombre);
  if (!n) return '';
  const alias = {
    pregabalina:'pregabalina', lyrica:'pregabalina',
    gabapentina:'gabapentina', neurontin:'gabapentina',
    amitriptilina:'amitriptilina', nortriptilina:'nortriptilina',
    duloxetina:'duloxetina', venlafaxina:'venlafaxina',
    carbamazepina:'carbamazepina', oxcarbazepina:'oxcarbazepina',
    lamotrigina:'lamotrigina', tramadol:'tramadol', codeina:'codeina',
    morfina:'morfina', oxicodona:'oxicodona', metadona:'metadona',
    fentanilo:'fentanilo_td', buprenorfina:'buprenorfina_td', tapentadol:'tapentadol',
    paracetamol:'paracetamol', acetaminofeno:'paracetamol',
    dipirona:'dipirona', metamizol:'dipirona', novalgina:'dipirona',
    ibuprofeno:'aine', diclofenac:'aine', naproxeno:'aine', meloxicam:'aine',
    celecoxib:'aine', ketorolac:'aine',
    ciclobenzaprina:'ciclobenzaprina', baclofeno:'baclofeno',
    lidocaina:'lidocaina_parche', capsaicina:'capsaicina_baja',
    dexametasona:'dexametasona', meprednisona:'corticoide_oral',
    prednisona:'corticoide_oral', betametasona:'corticoide_oral'
  };
  for (const [clave, id] of Object.entries(alias)) if (n.includes(clave)) return id;
  return '';
}

/* ====================================================== VENTANA PRINCIPAL */

function ventanaHistoria(id) {
  abrir({
    id:'hc_' + id, titulo:'Historia clínica', ancha:true, ctx:{id},
    dibujar(c, ctx) {
      const p = ESTADO.pacientes[ctx.id];
      if (!p) { c.innerHTML = vacio('Paciente no encontrado', 'Puede haber sido borrado desde otro dispositivo.'); return; }

      const a = analizar(p);
      const ef = efectividadPaciente(p);

      /* Si hay un borrado programado, es lo primero que se ve: por encima
         incluso de las banderas rojas, porque es lo unico que se puede
         perder de forma irreversible en los proximos minutos. */
      const faltan = segundosParaBorrar(p);
      if (faltan != null) {
        const aviso = document.createElement('div');
        aviso.className = 'alerta urgente';
        aviso.innerHTML =
          '<b>Esta historia se va a borrar en <span id="relojBorrado">' +
          relojBorrado(faltan) + '</span></b>' +
          '<p>El borrado quedó programado ' + esc(desdeHace(p.borradoProgramado.desde)) +
          (p.borradoProgramado.por ? ' por ' + esc(p.borradoProgramado.por) : '') +
          '. Hasta que el reloj llegue a cero la historia está intacta y se puede recuperar. ' +
          'Después de eso no queda copia, salvo que haya un respaldo exportado.</p>';
        c.appendChild(aviso);
        aviso.appendChild(superficie('Cancelar el borrado',
          'La historia queda como estaba', () => {
            cancelarBorrado(p.id);
            avisar('Borrado cancelado. La historia está a salvo.', 'ok');
            refrescar();
          }, 'acento'));

        /* El reloj corre a la vista mientras la ventana este abierta. */
        const tic = setInterval(() => {
          const nodo = $('#relojBorrado');
          if (!nodo) { clearInterval(tic); return; }
          const q = segundosParaBorrar(ESTADO.pacientes[ctx.id]);
          if (q == null) { clearInterval(tic); refrescar(); return; }
          if (q <= 0) { clearInterval(tic); revisarBorradosPendientes(); volverA(0); return; }
          nodo.textContent = relojBorrado(q);
        }, 1000);
      }

      /* ---- identidad y efectividad ---------------------------------- */
      const cab = document.createElement('div');
      cab.className = 'bloque cab-paciente';
      cab.innerHTML =
        '<div style="flex:1;min-width:0">' +
        '<h2 style="font-size:19px">' + esc(nombreCompleto(p)) + '</h2>' +
        '<div class="nota">' +
        esc([p.dni ? 'DNI ' + p.dni : '', edadDe(p.fechaNac) ? edadDe(p.fechaNac) + ' años' : '',
             p.sexo === 'F' ? 'femenino' : p.sexo === 'M' ? 'masculino' : '',
             p.obraSocial].filter(Boolean).join(' · ')) + '</div>' +
        (p.diagnostico && p.diagnostico.sindrome
          ? '<div style="margin-top:6px">' + marca(p.diagnostico.sindrome, 'acento') +
            (p.diagnostico.icd ? ' <span class="nota">' + esc(p.diagnostico.icd) + '</span>' : '') + '</div>'
          : '<div style="margin-top:6px">' + marca('sin diagnóstico cargado', 'neutro') + '</div>') +
        '</div>' +
        '<div class="cab-anillo">' + anilloEfectividad(ef.porcentaje, 64) +
        '<div class="nota" style="font-size:10.5px;margin-top:2px">efectividad</div></div>';
      c.appendChild(cab);

      if (ef.porcentaje != null) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta" style="border-left-color:' + ef.banda.color + '">' +
          '<b>' + esc(ef.banda.etiqueta) + ' — ' + ef.porcentaje + '%</b>' +
          '<p>' + esc(ef.banda.accion) + '</p>' +
          '<p class="nota">' + esc(ef.resumen) + '</p></div>');
      }

      if (ef.serie.length) {
        c.insertAdjacentHTML('beforeend',
          '<div class="bloque"><h3>Evolución de la intensidad</h3>' +
          graficoEvolucion(ef.serie) + '</div>');
      }

      /* ---- lo que no puede esperar ---------------------------------- */
      if (a.banderas.length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--rojo);margin:16px 0 8px">Banderas rojas</h3>');
        for (const b of a.banderas) {
          c.insertAdjacentHTML('beforeend',
            '<div class="alerta ' + b.nivel + '"><b>' + esc(b.txt) +
            (b.deducida ? ' <span class="nota">— ' + esc(b.deducida) + '</span>' : '') + '</b>' +
            '<p>' + esc(b.accion) + '</p></div>');
        }
      }

      if (a.seguridad.avisos.length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin:16px 0 8px">Control de seguridad farmacológica</h3>');
        for (const s of a.seguridad.avisos) {
          c.insertAdjacentHTML('beforeend',
            '<div class="alerta ' + s.nivel + '"><b>' + esc(s.titulo) + '</b>' +
            '<p>' + esc(s.texto) + '</p>' +
            (s.nota ? '<p class="nota">' + esc(s.nota) + '</p>' : '') + '</div>');
        }
      }

      /* ---- lo que la aplicacion piensa ------------------------------- */
      c.appendChild(cajaAnalisis(p, a));

      /* ---- las secciones --------------------------------------------- */
      c.insertAdjacentHTML('beforeend',
        '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
        'color:var(--tinta-3);margin:20px 0 9px">Historia clínica</h3>');

      const g = document.createElement('div');
      g.className = 'rejilla';
      c.appendChild(g);

      const nEsc = Object.keys(p.escalas || {}).length;
      const nMed = (p.medicacion || []).length;
      const nEvo = (p.evoluciones || []).length;

      g.appendChild(superficie('Filiación y antecedentes',
        resumenCorto(p.antecedentes.enfermedades) || 'Sin antecedentes cargados',
        () => ventanaFiliacion(p.id)));
      g.appendChild(superficie('Historia del dolor y mapa',
        (p.dolor.mapa || []).length + ' puntos marcados' +
        (p.dolor.nrsPromedio != null ? ' · NRS ' + p.dolor.nrsPromedio : ''),
        () => ventanaDolor(p.id)));
      g.appendChild(superficie('Examen físico',
        (p.examen.signos || []).length ? (p.examen.signos || []).length + ' signos consignados'
                                       : 'Sin examen cargado',
        () => ventanaExamen(p.id)));
      g.appendChild(superficie('Escalas',
        nEsc ? nEsc + ' completada' + (nEsc === 1 ? '' : 's') : 'Ninguna completada',
        () => ventanaEscalas(p.id)));
      g.appendChild(superficie('Diagnóstico',
        (p.diagnostico && p.diagnostico.sindrome) || 'Sin definir',
        () => ventanaDiagnostico(p.id)));
      g.appendChild(superficie('Plan terapéutico',
        (p.plan && p.plan.objetivo) ? resumenCorto(p.plan.objetivo) : 'Sin plan cargado',
        () => ventanaPlan(p.id)));
      g.appendChild(superficie('Medicación',
        nMed ? nMed + ' fármaco' + (nMed === 1 ? '' : 's') +
               (a.seguridad.mme.total ? ' · ' + a.seguridad.mme.total + ' MME/día' : '')
             : 'Sin medicación cargada',
        () => ventanaMedicacion(p.id)));
      g.appendChild(superficie('Evoluciones y controles',
        nEvo ? nEvo + ' control' + (nEvo === 1 ? '' : 'es') +
               (p.proximoControl ? ' · próximo ' + fechaCorta(p.proximoControl) : '')
             : 'Sin controles registrados',
        () => ventanaEvoluciones(p.id)));
      g.appendChild(superficie('Consentimientos informados',
        (p.consentimientos || []).length ? (p.consentimientos || []).length + ' emitido(s)'
                                         : 'Ninguno emitido',
        () => ventanaConsentimientos(p.id)));
      g.appendChild(superficie('Resumen para el paciente',
        (p.resumenesEnviados || []).length
          ? 'Último enviado ' + desdeHace(p.resumenesEnviados[p.resumenesEnviados.length-1].fecha)
          : 'Una página en lenguaje llano, para enviarle por correo',
        () => ventanaResumenPaciente(p.id)));
      g.appendChild(superficie('Imprimir la historia',
        'Resumen completo para el papel o el PDF',
        () => imprimirHistoria(p.id)));

      c.insertAdjacentHTML('beforeend', '<div style="height:16px"></div>');
      if (faltan == null) {
        c.appendChild(superficie('Borrar este paciente', null, () => {
          /* Dos preguntas y no una. La primera se responde con la mano; la
             segunda obliga a leer que se borra y a quien. */
          confirmar('¿Está segura de borrar este paciente?',
            'Se trata de la historia clínica completa de ' + nombreCompleto(p) + ': ' +
            (p.evoluciones || []).length + ' control(es), ' +
            Object.keys(p.escalas || {}).length + ' escala(s) y todo el plan terapéutico.',
            () => {
              confirmar('Confirmar el borrado de ' + nombreCompleto(p),
                'La historia NO se borra ahora. Queda programada para borrarse en ' +
                MINUTOS_PARA_BORRAR + ' minutos, con un reloj a la vista y la posibilidad de ' +
                'cancelar en cualquier momento. Pasado ese plazo no se puede recuperar.',
                () => {
                  programarBorrado(p.id);
                  avisar('Borrado programado. Tenés ' + MINUTOS_PARA_BORRAR +
                         ' minutos para arrepentirte.', 'aviso', 8000);
                  refrescar();
                }, 'Programar el borrado');
            }, 'Sí, estoy segura');
        }, 'fina peligro'));
      }
    }
  });
}

function resumenCorto(t, largo) {
  const s = String(t || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const n = largo || 62;
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

/* ====================================================== ANALISIS ======== */

function cajaAnalisis(p, a) {
  const n = document.createElement('div');

  let h = '';

  /* Cuánto se puede confiar en lo que sigue. */
  if (!a.completitud.suficiente) {
    h += '<div class="alerta medio" style="margin-bottom:10px"><b>Faltan datos para analizar bien</b>' +
      '<p>Sin ' + esc(a.completitud.faltan.join(', ')) + ', el análisis de abajo es apenas orientativo.</p></div>';
  }

  /* Fenotipo. */
  const f = a.fenotipo;
  const colorMec = {neuropatico:'violeta', nociplastico:'ambar', nociceptivo:'lima', indeterminado:'neutro'};
  h += '<div style="margin-bottom:12px">' +
       '<div style="font-size:15px;font-weight:600;margin-bottom:6px">' + esc(f.texto) + '</div>';
  const detalles = [];
  if (f.neuropatico.porque.length)  detalles.push({t:'A favor de neuropático', l:f.neuropatico.porque});
  if (f.nociplastico.porque.length) detalles.push({t:'A favor de nociplástico', l:f.nociplastico.porque});
  if (f.nociceptivo.porque.length)  detalles.push({t:'A favor de nociceptivo', l:f.nociceptivo.porque});
  for (const d of detalles) {
    h += '<div class="nota" style="margin-bottom:5px"><b>' + esc(d.t) + ':</b> ' +
         esc(d.l.join(' · ')) + '</div>';
  }
  h += '</div>';

  /* Diferencial. */
  if (a.diferencial.length) {
    h += '<div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;' +
         'color:var(--acento-tinta);margin:14px 0 8px">Diagnóstico diferencial</div>';
    for (const d of a.diferencial) {
      const col = d.concordancia >= 70 ? 'var(--verde)' : d.concordancia >= 50 ? 'var(--ambar)' : 'var(--tinta-3)';
      h += '<div class="dif" data-sid="' + esc(d.sindrome.id) + '" ' +
           'style="cursor:pointer;padding:9px 0;border-bottom:1px solid var(--linea)">' +
           '<div style="display:flex;gap:9px;align-items:baseline">' +
           '<b style="flex:1;font-size:14px">' + esc(d.sindrome.nombre) + '</b>' +
           '<span style="font-weight:700;color:' + col + '">' + d.concordancia + '%</span></div>' +
           '<div class="barra-pct"><i style="width:' + d.concordancia + '%;background:' + col + '"></i></div>' +
           '<div class="nota" style="margin-top:5px">' + esc(d.aFavor.slice(0, 3).join(' · ')) +
           (d.aFavor.length > 3 ? ' · y ' + (d.aFavor.length - 3) + ' más' : '') + '</div></div>';
    }
    h += '<p class="nota" style="margin-top:9px">Tocá cualquiera para ver el detalle completo, ' +
         'lo que juega en contra y el plan sugerido.</p>';
  } else {
    h += '<p class="nota">Con los datos actuales ningún síndrome del catálogo alcanza el umbral ' +
         'mínimo de concordancia. Completar el mapa corporal, los descriptores y el examen físico ' +
         'suele ser lo que destraba esto.</p>';
  }

  n.innerHTML = cajaSugerencia('Lectura automática', h);
  for (const d of $$('.dif', n)) {
    d.onclick = () => ventanaSindrome(d.dataset.sid, p.id);
  }
  return n;
}

/* ====================================================== ESCALAS ========= */

function ventanaEscalas(id) {
  abrir({id:'esc_' + id, titulo:'Escalas e instrumentos', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    p.escalas = p.escalas || {};

    /* Las que valen la pena para ESTE paciente van primero. */
    const a = analizar(p);
    const sugeridas = new Set(['nrs', 'dn4', 'pgic']);
    if (a.fenotipo.predominante === 'neuropatico') sugeridas.add('paindetect');
    if (a.fenotipo.predominante === 'nociplastico') { sugeridas.add('csi'); sugeridas.add('acr2016'); }
    if (a.contexto.regiones.has('lumbar')) { sugeridas.add('odi'); sugeridas.add('startback'); }
    if (a.contexto.regiones.has('cervical')) sugeridas.add('ndi');
    if (a.seguridad.mme.total > 0) sugeridas.add('ort');
    sugeridas.add('bpi'); sugeridas.add('pcs'); sugeridas.add('pseq');

    const orden = Object.keys(ESCALAS).sort((x, y) => {
      const sx = sugeridas.has(x) ? 0 : 1, sy = sugeridas.has(y) ? 0 : 1;
      if (sx !== sy) return sx - sy;
      return ESCALAS[x].sigla.localeCompare(ESCALAS[y].sigla);
    });

    for (const idEsc of orden) {
      const e = ESCALAS[idEsc];
      const hecha = p.escalas[idEsc];
      let detalle;
      if (hecha && hecha.total != null) {
        const corte = interpretarEscala(idEsc, hecha.total);
        detalle = e.nombre + ' — ' + hecha.total + (e.porcentual ? '%' : '') +
                  (corte ? ' · ' + corte.etiqueta : '') + ' · ' + fechaCorta(hecha.fecha);
      } else {
        detalle = e.nombre + ' · ' + e.minutos + ' min · lo completa ' + e.quien;
      }
      const s = superficie(e.sigla + (sugeridas.has(idEsc) ? '  ◇' : ''), detalle,
                           () => ventanaCompletarEscala(p.id, idEsc),
                           hecha && hecha.total != null ? 'suave fina' : 'fina');
      c.appendChild(s);
    }

    c.insertAdjacentHTML('beforeend',
      '<p class="nota" style="margin-top:14px">Las marcadas con ◇ son las que la aplicación ' +
      'considera pertinentes para este paciente según su fenotipo y la topografía del dolor.</p>');
  }});
}

function interpretarEscala(idEsc, total) {
  const e = ESCALAS[idEsc];
  if (!e || !e.cortes) return null;
  for (const c of e.cortes) if (total <= c.hasta) return c;
  return e.cortes[e.cortes.length - 1];
}

function ventanaCompletarEscala(idPac, idEsc) {
  const e = ESCALAS[idEsc];
  abrir({id:'esci_' + idPac + '_' + idEsc, titulo:e.sigla, sub:e.nombre,
    ctx:{idPac, idEsc}, dibujar(c, ctx) {
      const p = ESTADO.pacientes[ctx.idPac];
      const guardadas = p.escalas[ctx.idEsc] || {items:[], total:null};
      const items = e.items || (e.secciones || []).map(s => ({t:s}));
      const respuestas = guardadas.items && guardadas.items.length === items.length
        ? [...guardadas.items] : new Array(items.length).fill(null);

      if (e.enunciado) c.insertAdjacentHTML('beforeend', '<p>' + esc(e.enunciado) + '</p>');
      if (e.regla) c.insertAdjacentHTML('beforeend',
        '<div class="alerta info"><b>Cómo se lee</b><p>' + esc(e.regla) + '</p></div>');

      const zonaTotal = document.createElement('div');

      items.forEach((it, i) => {
        const cc = document.createElement('div');
        cc.className = 'campo';
        cc.innerHTML = '<label>' + esc(it.t) + (it.medico ? '  · lo completa el médico' : '') + '</label>';
        if (it.alerta) cc.insertAdjacentHTML('beforeend',
          '<div class="ayuda" style="color:var(--rojo)">' + esc(it.alerta) + '</div>');
        c.appendChild(cc);
        const ops = it.op || e.opciones ||
          (e.secciones ? [0,1,2,3,4,5].map(v => ({t:String(v), v})) : OP_SINO);
        opciones(cc, ops, respuestas[i], v => {
          respuestas[i] = v;
          recalcular();
        });
      });

      c.appendChild(zonaTotal);

      function recalcular() {
        const contestadas = respuestas.filter(v => v != null).length;
        let total = respuestas.reduce((s, v) => s + (Number(v) || 0), 0);
        if (e.promedio && contestadas) total = Math.round((total / contestadas) * 10) / 10;
        if (e.porcentual) {
          const maximo = items.length * 5;
          total = maximo ? Math.round((respuestas.reduce((s, v) => s + (Number(v) || 0), 0) / maximo) * 100) : 0;
        }
        const corte = interpretarEscala(ctx.idEsc, total);
        zonaTotal.innerHTML =
          '<div class="bloque" style="margin-top:16px"><h3>Resultado</h3>' +
          '<div style="font-size:26px;font-weight:700;letter-spacing:-.02em">' + total +
          (e.porcentual ? '%' : ' <span style="font-size:14px;color:var(--tinta-3)">/ ' +
            (e.rango ? e.rango[1] : '') + '</span>') + '</div>' +
          (corte ? '<div style="margin:6px 0">' + marca(corte.etiqueta, corte.color) + '</div>' : '') +
          (corte && corte.nota ? '<p class="nota">' + esc(corte.nota) + '</p>' : '') +
          '<p class="nota" style="margin-top:8px">' + contestadas + ' de ' + items.length +
          ' ítems respondidos.</p>' +
          (e.fuente ? '<p class="nota" style="margin-top:8px;padding-top:8px;' +
            'border-top:1px solid var(--linea)">' + esc(e.fuente) + '</p>' : '') +
          '</div>';
        zonaTotal.appendChild(superficie('Guardar el resultado', null, () => {
          p.escalas[ctx.idEsc] = {items:respuestas, total, fecha:hoy(),
                                  parcial:contestadas < items.length};
          p.modificado = ahora();
          guardar('pacientes', p.id, p);
          avisar(e.sigla + ' guardada: ' + total + (e.porcentual ? '%' : ''), 'ok');
          cerrarUltima();
        }, 'acento'));
      }
      recalcular();
    }});
}

/* =========================================================================

      c.insertAdjacentHTML('beforeend',
        '<div class="fila" style="margin-bottom:12px">' +
        marca(s.icd.cod + ' · ' + s.icd.txt, 'acento') + ' ' +
        marca('mecanismo ' + s.mecanismo, s.mecanismo === 'neuropatico' ? 'violeta' :
              s.mecanismo === 'nociplastico' ? 'ambar' : 'lima') + '</div>' +
        '<p>' + esc(s.resumen) + '</p>');

      if (s.criterios) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta info"><b>Criterios diagnósticos</b><p>' + esc(s.criterios) + '</p></div>');

      if (coincidencia) {
        c.insertAdjacentHTML('beforeend', cajaSugerencia(
          'Concordancia con este paciente: ' + coincidencia.concordancia + '%',
          '<div class="barra-pct" style="margin-bottom:11px"><i style="width:' +
          coincidencia.concordancia + '%;background:var(--acento)"></i></div>' +
          '<div style="font-size:12px;font-weight:700;color:var(--verde);margin-bottom:4px">A FAVOR</div>' +
          '<ul style="margin:0 0 12px;padding-left:18px;font-size:13.5px">' +
          coincidencia.aFavor.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
          (coincidencia.enContra.length
            ? '<div style="font-size:12px;font-weight:700;color:var(--tinta-3);margin-bottom:4px">' +
              'DATOS DE PESO QUE NO SE CUMPLEN</div>' +
              '<ul style="margin:0;padding-left:18px;font-size:13.5px;color:var(--tinta-2)">' +
              coincidencia.enContra.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>'
            : '')));
      }

      /* --- estudios --------------------------------------------------- */
      c.insertAdjacentHTML('beforeend', bloque('Plan de estudios',
        s.estudios.map(e =>
          '<div style="padding:8px 0;border-bottom:1px solid var(--linea)">' +
          '<b style="font-size:14px">' + esc(e.t) + '</b>' +
          '<div class="nota">Cuándo: ' + esc(e.cuando) + '</div>' +
          (e.nota ? '<div class="nota" style="margin-top:4px">' + esc(e.nota) + '</div>' : '') +
          '</div>').join('')));

      /* --- tratamiento ------------------------------------------------- */
      const plan = p ? sugerirPlan(s.id, p, a.contexto) : null;
      const t = s.tratamiento || {};

      let h = '<p style="font-weight:600;margin-bottom:10px">' + esc(t.objetivo || '') + '</p>';

      if ((t.noFarmacologico || []).length) {
        h += '<div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--tinta-3);' +
             'margin:12px 0 6px">NO FARMACOLÓGICO</div><ul style="margin:0;padding-left:18px;font-size:13.5px">' +
             t.noFarmacologico.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      }

      for (const linea of [{k:'primeraLinea', t:'PRIMERA LÍNEA'},
                           {k:'segundaLinea', t:'SEGUNDA LÍNEA'},
                           {k:'tercera', t:'TERCERA LÍNEA'}]) {
        const items = plan ? plan[linea.k] : (t[linea.k] || []).map(x =>
          ({...x, nombre:(FARMACOS[x.farmaco] || {}).nombre || x.farmaco,
            inicio:(FARMACOS[x.farmaco] || {}).inicio, reparos:[]}));
        if (!items || !items.length) continue;
        h += '<div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--tinta-3);' +
             'margin:14px 0 6px">' + linea.t + '</div>';
        for (const f of items) {
          h += '<div style="padding:8px 0;border-bottom:1px solid var(--linea)">' +
               '<b style="font-size:14px">' + esc(f.nombre) + '</b>' +
               (f.inicio ? '<div class="nota">Inicio: ' + esc(f.inicio) + '</div>' : '') +
               (f.titulacion ? '<div class="nota">Titulación: ' + esc(f.titulacion) + '</div>' : '') +
               (f.nota ? '<div class="nota" style="margin-top:3px">' + esc(f.nota) + '</div>' : '') +
               (f.reparos && f.reparos.length
                 ? '<div class="nota" style="color:var(--naranja);margin-top:4px">⚠ ' +
                   esc(f.reparos.join(' · ')) + '</div>' : '') +
               '</div>';
        }
      }

      if ((t.evitar || []).length) {
        h += '<div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--rojo);' +
             'margin:14px 0 6px">EVITAR</div><ul style="margin:0;padding-left:18px;font-size:13.5px">' +
             t.evitar.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      }
      if (s.irruptivo) {
        h += '<div class="alerta medio" style="margin-top:12px"><b>Dolor irruptivo</b><p>' +
             esc(s.irruptivo) + '</p></div>';
      }

      c.insertAdjacentHTML('beforeend', cajaSugerencia('Tratamiento sugerido', h,
        !!(plan && plan.primeraLinea.length)));

      /* --- procedimientos ---------------------------------------------- */
      if ((s.procedimientos || []).length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin:18px 0 8px">Procedimientos que corresponden</h3>');
        for (const idp of s.procedimientos) {
          const pr = PROCEDIMIENTOS[idp];
          if (!pr) continue;
          c.appendChild(superficie(pr.nombre, pr.exitoEsperado || pr.proposito,
                                   () => ventanaProcedimiento(idp, ctx.idPac), 'fina'));
        }
      }

      /* --- controles y referencias -------------------------------------- */
      if (s.controles) {
        c.insertAdjacentHTML('beforeend', bloque('Controles',
          dato('Frecuencia', esc(s.controles.frecuencia)) +
          dato('Escalas', (s.controles.escalas || []).map(x =>
            marca((ESCALAS[x] || {sigla:x}).sigla, 'neutro')).join(' ')) +
          dato('Qué mirar', esc(s.controles.que))));
      }
      if ((s.banderas || []).length) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta alto"><b>Banderas rojas propias de este cuadro</b><ul style="margin:6px 0 0;' +
          'padding-left:18px;font-size:13px">' + s.banderas.map(b => '<li>' + esc(b) + '</li>').join('') +
          '</ul></div>');
      }
      c.insertAdjacentHTML('beforeend',
        '<p class="nota" style="margin-top:14px;padding-top:10px;border-top:1px solid var(--linea)">' +
        '<b>Referencias:</b> ' + esc((s.referencias || []).join(' · ')) + '</p>');

      /* --- aceptar ------------------------------------------------------ */
      if (p) {
        c.insertAdjacentHTML('beforeend', '<div style="height:12px"></div>');
        c.appendChild(superficie('Adoptar como diagnóstico de este paciente',
          'Copia el síndrome, el código y el mecanismo a la historia clínica', () => {
            p.diagnostico = {...p.diagnostico,
              sindrome:s.nombre, sindromeId:s.id, mecanismo:s.mecanismo,
              icd:s.icd.cod + ' — ' + s.icd.txt,
              grado:a.fenotipo.predominante === 'neuropatico' ? a.fenotipo.neuropatico.grado
                  : a.fenotipo.predominante === 'nociplastico' ? a.fenotipo.nociplastico.grado : '',
              aceptadoDeMotor:true, fecha:hoy()};
            p.modificado = ahora();
            guardar('pacientes', p.id, p);
            avisar('Diagnóstico adoptado. Revisalo y completalo en la ventana de diagnóstico.', 'ok');
            volverA(PILA.findIndex(v => v.id === 'hc_' + p.id));
          }, 'acento'));
      }
    }});
}

/* ====================================================== PROCEDIMIENTO === */

function ventanaProcedimiento(idProc, idPac) {
  const pr = PROCEDIMIENTOS[idProc];
  if (!pr) return;
  abrir({id:'proc_' + idProc, titulo:pr.nombre, sub:pr.grupo + ' · ' + pr.proposito,
    ancha:true, ctx:{idProc, idPac}, dibujar(c, ctx) {
      const p = ctx.idPac ? ESTADO.pacientes[ctx.idPac] : null;

      c.insertAdjacentHTML('beforeend', bloque('Indicaciones',
        '<ul style="margin:0;padding-left:18px;font-size:13.5px">' +
        (pr.indicaciones || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'));

      c.insertAdjacentHTML('beforeend', bloque('Cómo se hace',
        dato('Guía', esc(pr.guia)) + dato('Técnica', esc(pr.tecnica)) +
        dato('Evidencia', esc(pr.evidencia)) +
        dato('Resultado esperable', esc(pr.exitoEsperado)) +
        dato('Duración del efecto', esc(pr.duracion))));

      c.insertAdjacentHTML('beforeend',
        '<div class="alerta alto"><b>Contraindicaciones</b><p>' +
        esc((pr.contraindicaciones || []).join(' · ')) + '</p></div>' +
        '<div class="alerta medio"><b>Complicaciones</b><p>' +
        esc((pr.complicaciones || []).join(' · ')) + '</p></div>');

      /* Anticoagulación: lo primero que hay que resolver antes de pinchar. */
      const riesgo = pr.riesgoSangrado || 'bajo';
      const anticoagulado = p && (p.antecedentes.etiquetas || []).includes('anticoagulado');
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque"><h3>Anticoagulación · procedimiento de riesgo ' + esc(riesgo) + '</h3>' +
        (anticoagulado
          ? '<div class="alerta alto" style="margin-bottom:10px"><b>Este paciente figura como ' +
            'anticoagulado o antiagregado</b><p>Resolver la suspensión antes de programar.</p></div>'
          : '') +
        Object.values(ANTICOAGULACION).map(a =>
          dato(esc(a.nombre), esc(a[riesgo] || a.bajo))).join('') +
        '<p class="nota" style="margin-top:10px">' + esc(NOTA_ANTICOAGULACION) + '</p></div>');

      c.insertAdjacentHTML('beforeend', bloque('Qué debe decir el consentimiento',
        '<ul style="margin:0;padding-left:18px;font-size:13.5px">' +
        (pr.consentimiento || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'));

      if (pr.registro) {
        c.insertAdjacentHTML('beforeend',
          '<div class="alerta info"><b>Qué registrar después</b><p>' + esc(pr.registro) + '</p></div>');
      }

      if (p) {
        c.appendChild(superficie('Emitir el consentimiento informado',
          'Genera el texto listo para imprimir y firmar', () => {
            emitirConsentimiento(p.id, idProc);
          }, 'acento'));
        c.appendChild(superficie('Agregar al plan de este paciente', null, () => {
          p.plan.procedimientos = p.plan.procedimientos || [];
          if (!p.plan.procedimientos.includes(idProc)) p.plan.procedimientos.push(idProc);
          p.modificado = ahora();
          guardar('pacientes', p.id, p);
          avisar('Procedimiento agregado al plan.', 'ok');
        }, 'suave'));
      }
    }});
}

/* ====================================================== DIAGNOSTICO ===== */

function ventanaDiagnostico(id) {
  abrir({id:'dx_' + id, titulo:'Diagnóstico', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    const a = analizar(p);
    const g = () => { p.modificado = ahora(); guardar('pacientes', p.id, p); };

    c.appendChild(cajaAnalisis(p, a));

    c.insertAdjacentHTML('beforeend',
      '<h3 style="font-size:15px;margin:20px 0 10px">Diagnóstico del médico tratante</h3>');

    /* El sindrome se escribe con autocompletado y el codigo se completa solo.
       Buscar un codigo CIE-11 a mano en otra pestaña es la clase de friccion
       que hace que el campo termine vacio en todas las historias. */
    campoDiagnostico(c, p, g);

    const gg = document.createElement('div'); gg.className = 'dos'; c.appendChild(gg);
    campo(gg, 'Código ICD-11', p.diagnostico, 'icd', {alCambiar:() => {
      /* Si se escribe el codigo a mano, se completa la denominacion. */
      const t = textoICD((p.diagnostico.icd || '').split('—')[0].trim());
      if (t && !/—/.test(p.diagnostico.icd)) {
        p.diagnostico.icd = (p.diagnostico.icd || '').trim().toUpperCase() + ' — ' + t;
      }
      g(); refrescar();
    }, ayuda:'Se completa solo al elegir el diagnóstico. También podés escribir el código y ' +
             'la denominación se agrega sola.'});
    campo(gg, 'Grado de certeza', p.diagnostico, 'grado', {alCambiar:g,
      lista:['posible','probable','definido','sospechado por tamizaje']});

    const cm = document.createElement('div'); cm.className = 'campo';
    cm.innerHTML = '<label>Mecanismo predominante</label>'; c.appendChild(cm);
    opciones(cm, [{t:'Nociceptivo',v:'nociceptivo'},{t:'Neuropático',v:'neuropatico'},
                  {t:'Nociplástico',v:'nociplastico'},{t:'Mixto',v:'mixto'}],
             p.diagnostico.mecanismo, v => { p.diagnostico.mecanismo = v; g(); refrescar(); });

    campo(c, 'Fundamento y diagnósticos diferenciales considerados', p.diagnostico, 'texto',
      {area:true, filas:5, alCambiar:g});

    if (p.diagnostico.sindromeId) {
      c.insertAdjacentHTML('beforeend', '<div style="height:10px"></div>');
      c.appendChild(superficie('Ver la ficha completa del síndrome', null,
        () => ventanaSindrome(p.diagnostico.sindromeId, p.id), 'suave'));
    }
  }});
}

/* ====================================================== PLAN ============ */

function ventanaPlan(id) {
  abrir({id:'plan_' + id, titulo:'Plan terapéutico', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    const a = analizar(p);
    const g = () => { p.modificado = ahora(); guardar('pacientes', p.id, p); };
    p.plan = p.plan || {};

    const sugerido = p.diagnostico.sindromeId ? sugerirPlan(p.diagnostico.sindromeId, p, a.contexto) : null;

    if (sugerido) {
      let h = '<p style="font-weight:600;margin-bottom:10px">' + esc(sugerido.objetivo) + '</p>';
      const lineas = [{k:'primeraLinea', t:'Primera línea'}, {k:'segundaLinea', t:'Segunda línea'},
                      {k:'tercera', t:'Tercera línea'}];
      for (const l of lineas) {
        if (!sugerido[l.k].length) continue;
        h += '<div style="font-size:12px;font-weight:700;color:var(--tinta-3);margin:10px 0 5px;' +
             'letter-spacing:.05em;text-transform:uppercase">' + l.t + '</div>';
        h += sugerido[l.k].map(f =>
          '<div style="font-size:13.5px;padding:4px 0">• <b>' + esc(f.nombre) + '</b>' +
          (f.inicio ? ' — ' + esc(f.inicio) : '') +
          (f.reparos.length ? '<div class="nota" style="color:var(--naranja)">⚠ ' +
            esc(f.reparos.join(' · ')) + '</div>' : '') + '</div>').join('');
      }
      if (sugerido.evitar.length) {
        h += '<div style="font-size:12px;font-weight:700;color:var(--rojo);margin:12px 0 5px;' +
             'letter-spacing:.05em;text-transform:uppercase">Evitar</div>' +
             '<div style="font-size:13.5px">' + esc(sugerido.evitar.join(' · ')) + '</div>';
      }
      c.insertAdjacentHTML('beforeend', cajaSugerencia('Plan sugerido para ' +
        p.diagnostico.sindrome, h));

      c.appendChild(superficie('Volcar el plan sugerido a los campos de abajo',
        'Después lo editás como quieras: se copia, no se aplica', () => {
          p.plan.objetivo = p.plan.objetivo || sugerido.objetivo;
          p.plan.noFarmacologico = [...new Set([...(p.plan.noFarmacologico || []),
                                                ...sugerido.noFarmacologico])];
          p.plan.estudios = [...new Set([...(p.plan.estudios || []),
                                         ...sugerido.estudios.map(e => e.t)])];
          const texto = sugerido.primeraLinea.map(f => f.nombre + ' — ' + (f.inicio || '')).join('\n');
          p.plan.texto = (p.plan.texto ? p.plan.texto + '\n\n' : '') + texto;
          g(); refrescar();
          avisar('Plan volcado. Revisalo antes de indicárselo al paciente.', 'ok');
        }, 'suave'));
    } else {
      c.insertAdjacentHTML('beforeend',
        '<p class="nota">Para que la aplicación sugiera un plan, primero hay que adoptar un ' +
        'diagnóstico del diferencial.</p>');
    }

    c.insertAdjacentHTML('beforeend',
      '<h3 style="font-size:15px;margin:20px 0 10px">Plan indicado</h3>');

    campo(c, 'Objetivo del tratamiento', p.plan, 'objetivo', {area:true, filas:2, alCambiar:g,
      ayuda:'Concreto y funcional. "Bajar el dolor" no es un objetivo; "caminar seis cuadras sin parar" sí.'});
    campo(c, 'Indicaciones', p.plan, 'texto', {area:true, filas:8, alCambiar:g,
      pista:'Fármacos, dosis, titulación, medidas no farmacológicas, pautas de alarma…'});

    listaTexto(c, 'Estudios solicitados', p.plan, 'estudios', g);
    listaTexto(c, 'Medidas no farmacológicas', p.plan, 'noFarmacologico', g);
    listaTexto(c, 'Derivaciones', p.plan, 'derivaciones', g);

    if ((p.plan.procedimientos || []).length) {
      c.insertAdjacentHTML('beforeend',
        '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
        'color:var(--tinta-3);margin:18px 0 8px">Procedimientos planificados</h3>');
      for (const idp of p.plan.procedimientos) {
        const pr = PROCEDIMIENTOS[idp];
        if (!pr) continue;
        c.appendChild(superficie(pr.nombre, 'Ver ficha, anticoagulación y consentimiento',
                                 () => ventanaProcedimiento(idp, p.id), 'fina'));
      }
    }

    campo(c, 'Próximo control', p, 'proximoControl', {tipo:'date', alCambiar:g,
      ayuda:sugerido && sugerido.controles.frecuencia
        ? 'Sugerido para este cuadro: ' + sugerido.controles.frecuencia : ''});
  }});
}

/* Lista simple de lineas de texto: estudios, derivaciones, medidas. */
function listaTexto(nodo, rotulo, obj, clave, alCambiar) {
  if (!Array.isArray(obj[clave])) obj[clave] = [];
  const cont = document.createElement('div');
  cont.className = 'campo';
  cont.innerHTML = '<label>' + esc(rotulo) + '</label>';
  nodo.appendChild(cont);
  const zona = document.createElement('div');
  cont.appendChild(zona);
  function pintar() {
    zona.innerHTML = '';
    obj[clave].forEach((t, i) => {
      const f = document.createElement('div');
      f.style.cssText = 'display:flex;gap:7px;align-items:center;margin-bottom:6px';
      f.innerHTML = '<input type="text" value="' + esc(t) + '" style="flex:1">';
      const inp = $('input', f);
      inp.onchange = () => { obj[clave][i] = inp.value; alCambiar(); };
      const x = document.createElement('div');
      x.className = 'op';
      x.textContent = '✕';
      x.onclick = () => { obj[clave].splice(i, 1); alCambiar(); pintar(); };
      f.appendChild(x);
      zona.appendChild(f);
    });
    zona.appendChild(superficie('+ Agregar', null, () => {
      obj[clave].push(''); alCambiar(); pintar();
    }, 'fina suave'));
  }
  pintar();
}

/* ====================================================== MEDICACION ====== */

function ventanaMedicacion(id) {
  abrir({id:'med_' + id, titulo:'Medicación', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    const a = analizar(p);
    const g = () => { p.modificado = ahora(); guardar('pacientes', p.id, p); };
    if (!Array.isArray(p.medicacion)) p.medicacion = [];

    const mme = a.seguridad.mme;
    c.insertAdjacentHTML('beforeend',
      '<div class="bloque" style="border-left:3px solid var(--' + mme.color + ')">' +
      '<h3>Carga opioide</h3>' +
      '<div style="font-size:26px;font-weight:700;letter-spacing:-.02em">' + mme.total +
      ' <span style="font-size:14px;color:var(--tinta-3)">MME/día</span></div>' +
      '<div style="margin:5px 0">' + marca(mme.nivel, mme.color) + '</div>' +
      (mme.aviso ? '<p class="nota">' + esc(mme.aviso) + '</p>' : '') +
      '<p class="nota" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--linea)">' +
      esc(mme.nota) + '</p></div>');

    for (const s of a.seguridad.avisos) {
      c.insertAdjacentHTML('beforeend',
        '<div class="alerta ' + s.nivel + '"><b>' + esc(s.titulo) + '</b><p>' + esc(s.texto) + '</p></div>');
    }

    const zona = document.createElement('div');
    c.appendChild(zona);
    pintar();

    function pintar() {
      zona.innerHTML = '';
      p.medicacion.forEach((m, i) => {
        const f = FARMACOS[m.farmaco];
        const caja = document.createElement('div');
        caja.className = 'bloque';
        caja.style.marginBottom = '9px';

        const cf = document.createElement('div');
        cf.className = 'campo';
        cf.innerHTML = '<label>Fármaco</label>';
        caja.appendChild(cf);
        const sel = document.createElement('select');
        sel.innerHTML = '<option value="">— fuera del vademécum —</option>' +
          Object.keys(FARMACOS).sort((x, y) => FARMACOS[x].nombre.localeCompare(FARMACOS[y].nombre))
            .map(k => '<option value="' + k + '"' + (m.farmaco === k ? ' selected' : '') + '>' +
                 esc(FARMACOS[k].nombre) + '</option>').join('');
        sel.onchange = () => { m.farmaco = sel.value; g(); refrescar(); };
        cf.appendChild(sel);

        if (!m.farmaco) campo(caja, 'Nombre', m, 'nombreLibre', {alCambiar:g});

        const gg = document.createElement('div'); gg.className = 'tres'; caja.appendChild(gg);
        campo(gg, 'Dosis', m, 'dosis', {alCambiar:() => { g(); refrescar(); }, pista:'75 mg'});
        campo(gg, 'Frecuencia', m, 'frecuencia', {alCambiar:() => { g(); refrescar(); }, pista:'cada 12 hs'});
        campo(gg, 'Desde', m, 'desde', {tipo:'date', alCambiar:g});

        if (f) {
          const ef = efectividadTratamiento(p, {farmaco:m.farmaco, inicio:m.desde, nrsInicio:m.nrsInicio});
          caja.insertAdjacentHTML('beforeend',
            '<div style="display:flex;gap:12px;align-items:center;margin-top:8px;' +
            'padding-top:10px;border-top:1px solid var(--linea)">' +
            anilloEfectividad(ef.porcentaje, 48) +
            '<div style="flex:1"><div style="font-size:13px;font-weight:600">' +
            (ef.banda ? esc(ef.banda.etiqueta) : 'Sin mediciones en la ventana de este fármaco') + '</div>' +
            (ef.dias != null ? '<div class="nota">' + ef.dias + ' días de tratamiento · ' +
              ef.mediciones + ' medición(es)</div>' : '') +
            (ef.advertencia ? '<div class="nota" style="color:var(--ambar)">' + esc(ef.advertencia) + '</div>' : '') +
            '</div></div>');
          caja.appendChild(superficie('Ver la ficha de ' + f.nombre, null,
            () => ventanaFarmaco(m.farmaco, p.id), 'fina suave'));
        }

        caja.appendChild(superficie('Quitar de la lista', null, () => {
          p.medicacion.splice(i, 1); g(); refrescar();
        }, 'fina peligro'));
        zona.appendChild(caja);
      });

      zona.appendChild(superficie('+ Agregar medicación', null, () => {
        p.medicacion.push({id:uid('med'), farmaco:'', nombreLibre:'', dosis:'', frecuencia:'',
                           desde:hoy(), nrsInicio:ultimoNRS(p)});
        g(); refrescar();
      }, 'suave'));
    }
  }});
}

function ventanaFarmaco(idFarmaco, idPac) {
  const f = FARMACOS[idFarmaco];

function ventanaEvoluciones(id) {
  abrir({id:'evo_' + id, titulo:'Evoluciones y controles', ancha:true, ctx:{id}, dibujar(c, ctx) {
    const p = ESTADO.pacientes[ctx.id];
    if (!Array.isArray(p.evoluciones)) p.evoluciones = [];

    c.appendChild(superficie('+ Registrar un control de hoy',
      'Intensidad, escalas, cambios de tratamiento y efectos adversos',
      () => ventanaNuevaEvolucion(p.id), 'acento'));
    c.appendChild(superficie('Enviarle el resumen al paciente',
      'Una página con cómo viene, qué toma y cuándo consultar',
      () => ventanaResumenPaciente(p.id), 'suave'));

    const ef = efectividadPaciente(p);
    if (ef.serie.length) {
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque"><h3>Evolución</h3>' + graficoEvolucion(ef.serie) +
        (Object.keys(ef.componentes).length
          ? '<div style="margin-top:12px">' + Object.values(ef.componentes).map(comp =>
              dato(esc(comp.etiqueta) + (comp.peso ? ' (' + Math.round(comp.peso * 100) + '%)' : ''),
                   '<b>' + (comp.valor > 0 ? '+' : '') + comp.valor + '%</b> ' +
                   '<span class="nota">' + esc(comp.detalle) + '</span>')).join('') + '</div>'
          : '') + '</div>');
    }

    if (!p.evoluciones.length) {
      c.insertAdjacentHTML('beforeend', vacio('Sin controles registrados',
        'Cada control deja asentada la intensidad, los cambios de medicación y las escalas, ' +
        'que es lo que exige la norma y lo que permite medir si el tratamiento sirve.'));
      return;
    }

    for (let i = p.evoluciones.length - 1; i >= 0; i--) {
      const e = p.evoluciones[i];
      const col = e.nrs != null ? colorDolor(e.nrs) : null;
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque"><div style="display:flex;gap:10px;align-items:baseline">' +
        '<b style="flex:1">' + esc(fechaLarga(e.fecha)) + '</b>' +
        (e.nrs != null ? '<span class="marca-txt" style="background:' + col.color +
          ';color:' + (e.nrs >= 3 && e.nrs <= 6 ? '#3a2c00' : '#fff') + '">NRS ' + e.nrs + '</span>' : '') +
        '</div>' +
        (e.texto ? '<p style="margin-top:8px;font-size:13.5px;white-space:pre-wrap">' + esc(e.texto) + '</p>' : '') +
        (e.cambios ? '<p class="nota" style="margin-top:6px"><b>Cambios:</b> ' + esc(e.cambios) + '</p>' : '') +
        ((e.adversos || []).length
          ? '<p class="nota" style="margin-top:6px;color:var(--naranja)"><b>Efectos adversos:</b> ' +
            esc(e.adversos.map(x => x.t + (x.grave ? ' (grave)' : '')).join(' · ')) + '</p>' : '') +
        (e.escalas && Object.keys(e.escalas).length
          ? '<div style="margin-top:7px">' + Object.entries(e.escalas).map(([k, v]) =>
              marca((ESCALAS[k] || {sigla:k}).sigla + ' ' + (typeof v === 'object' ? v.total : v), 'neutro')
            ).join(' ') + '</div>' : '') +
        '</div>');
    }
  }});
}

function ventanaNuevaEvolucion(id) {
  abrir({id:'nevo_' + id, titulo:'Control', sub:fechaLarga(hoy()), ancha:true, ctx:{id},
    dibujar(c, ctx) {
      const p = ESTADO.pacientes[ctx.id];
      const e = {fecha:hoy(), nrs:ultimoNRS(p), texto:'', cambios:'', escalas:{}, adversos:[]};

      const cn = document.createElement('div'); cn.className = 'campo';
      cn.innerHTML = '<label>Intensidad promedio desde el último control</label>';
      c.appendChild(cn);
      escalaNRS(cn, e.nrs, v => { e.nrs = v; pintarComparacion(); });

      const comp = document.createElement('div');
      c.appendChild(comp);
      function pintarComparacion() {
        const basal = primerNRS(p);
        if (basal == null || e.nrs == null) { comp.innerHTML = ''; return; }
        const pct = mejoraPct(basal, e.nrs, false);
        const b = bandaEfectividad(pct);
        comp.innerHTML = '<div class="alerta" style="border-left-color:' + b.color + '">' +
          '<b>' + pct + '% respecto del basal (' + basal + ' → ' + e.nrs + ') — ' + esc(b.etiqueta) + '</b>' +
          '<p>' + esc(b.accion) + '</p></div>';
      }
      pintarComparacion();

      campo(c, 'Evolución', e, 'texto', {area:true, filas:6,
        pista:'Cómo llegó, qué mejoró, qué no, adherencia, situación funcional…'});
      campo(c, 'Cambios en el tratamiento', e, 'cambios', {area:true, filas:3,
        pista:'Qué se sube, qué se baja, qué se suspende y por qué'});

      /* Escalas rápidas de control. */
      c.insertAdjacentHTML('beforeend',
        '<h3 style="font-size:14px;margin:18px 0 8px">Escalas de este control</h3>' +
        '<p class="nota" style="margin-bottom:10px">El PGIC es el que más pesa en el cálculo de ' +
        'efectividad y tarda quince segundos.</p>');
      const zonaEsc = document.createElement('div');
      c.appendChild(zonaEsc);
      for (const idEsc of ['pgic', 'bpi', 'odi', 'ndi', 'csi', 'phq9']) {
        const esc_ = ESCALAS[idEsc];
        const cc = document.createElement('div');
        cc.className = 'campo';
        cc.innerHTML = '<label>' + esc(esc_.sigla) + ' — ' + esc(esc_.nombre) + '</label>';
        zonaEsc.appendChild(cc);
        if (idEsc === 'pgic') {
          opciones(cc, ESCALAS.pgic.items[0].op, e.escalas.pgic,
                   v => { e.escalas.pgic = v; });
        } else {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.placeholder = 'puntaje total (opcional)';
          inp.onchange = () => {
            if (inp.value === '') delete e.escalas[idEsc];
            else e.escalas[idEsc] = Number(inp.value);
          };
          cc.appendChild(inp);
        }
      }

      /* Efectos adversos. */
      c.insertAdjacentHTML('beforeend',
        '<h3 style="font-size:14px;margin:18px 0 8px">Efectos adversos</h3>');
      const zonaAdv = document.createElement('div');
      c.appendChild(zonaAdv);
      pintarAdversos();
      function pintarAdversos() {
        zonaAdv.innerHTML = '';
        e.adversos.forEach((ad, i) => {
          const f = document.createElement('div');
          f.style.cssText = 'display:flex;gap:7px;align-items:center;margin-bottom:6px';
          f.innerHTML = '<input type="text" value="' + esc(ad.t) + '" style="flex:1" ' +
            'placeholder="ej. somnolencia, náuseas, edema">';
          $('input', f).onchange = ev => { ad.t = ev.target.value; };
          const grave = document.createElement('div');
          grave.className = 'op' + (ad.grave ? ' on' : '');
          grave.textContent = 'Grave';
          grave.onclick = () => { ad.grave = !ad.grave; pintarAdversos(); };
          f.appendChild(grave);
          const x = document.createElement('div');
          x.className = 'op';
          x.textContent = '✕';
          x.onclick = () => { e.adversos.splice(i, 1); pintarAdversos(); };
          f.appendChild(x);
          zonaAdv.appendChild(f);
        });
        zonaAdv.appendChild(superficie('+ Agregar efecto adverso', null, () => {
          e.adversos.push({t:'', grave:false}); pintarAdversos();
        }, 'fina suave'));
      }

      campo(c, 'Próximo control', p, 'proximoControl', {tipo:'date'});

      c.insertAdjacentHTML('beforeend', '<div style="height:14px"></div>');
      c.appendChild(superficie('Guardar el control', null, () => {
        p.evoluciones = p.evoluciones || [];
        p.evoluciones.push(e);
        if (e.escalas) {
          /* Las escalas del control también actualizan el valor vigente. */
          for (const [k, v] of Object.entries(e.escalas)) {
            if (v == null) continue;
            p.escalas = p.escalas || {};
            p.escalas[k] = {items:(p.escalas[k] || {}).items || [],
                            total:typeof v === 'object' ? v.total : v, fecha:e.fecha};
          }
        }
        p.modificado = ahora();
        guardar('pacientes', p.id, p);
        avisar('Control registrado.', 'ok');
        volverA(PILA.findIndex(v => v.id === 'hc_' + p.id));
      }, 'acento'));
    }});
}

function ventanaConsentimientos(id) {

        'el pronóstico y las posibles complicaciones, y que deje explícito que hay garantía de ' +
        '<b>medios</b> y no de <b>resultados</b>. Los textos que genera la aplicación incluyen ' +
        'esas cuatro cosas.</p>');

      c.insertAdjacentHTML('beforeend',
        '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
        'color:var(--tinta-3);margin:14px 0 8px">Emitir uno nuevo</h3>');
      const grupos = {};
      for (const [k, pr] of Object.entries(PROCEDIMIENTOS)) {
        (grupos[pr.grupo] = grupos[pr.grupo] || []).push({k, pr});
      }
      for (const [gr, lista] of Object.entries(grupos)) {
        c.insertAdjacentHTML('beforeend', '<div class="nota" style="margin:10px 0 5px"><b>' +
          esc(gr) + '</b></div>');
        for (const {k, pr} of lista) {
          c.appendChild(superficie(pr.nombre, null, () => emitirConsentimiento(p.id, k), 'fina'));
        }
      }

      if (p.consentimientos.length) {
        c.insertAdjacentHTML('beforeend',
          '<h3 style="font-size:13px;text-transform:uppercase;letter-spacing:.05em;' +
          'color:var(--tinta-3);margin:20px 0 8px">Emitidos</h3>');

          c.appendChild(superficie(k.procedimiento, fechaCorta(k.fecha) +

            () => emitirConsentimiento(p.id, k.idProc, i), 'fina suave'));
        });
      }
    }});
}

function emitirConsentimiento(idPac, idProc, indice) {
  const p = ESTADO.pacientes[idPac];
  const pr = PROCEDIMIENTOS[idProc];
  if (!p || !pr) return;

  abrir({id:'kons_' + idPac + '_' + idProc, titulo:'Consentimiento informado',
    sub:pr.nombre, ancha:true, ctx:{idPac, idProc, indice}, dibujar(c, ctx) {
      const texto = textoConsentimiento(p, pr);
      c.insertAdjacentHTML('beforeend',
        '<div class="bloque" style="background:var(--ventana);white-space:pre-wrap;' +
        'font-size:13.5px;line-height:1.65" id="textoConsentimiento">' + esc(texto) + '</div>');

      c.appendChild(superficie('Imprimir para firmar', null, () => {
        imprimirTexto('Consentimiento informado — ' + pr.nombre, texto);
      }, 'acento'));

      const yaEsta = (p.consentimientos || []).findIndex(k => k.idProc === idProc);
      c.appendChild(superficie(
        yaEsta >= 0 && p.consentimientos[yaEsta].firmado
          ? 'Marcar como NO firmado' : 'Marcar como firmado por el paciente',
        'Queda asentado en la historia con la fecha', () => {
          p.consentimientos = p.consentimientos || [];
          if (yaEsta >= 0) {
            p.consentimientos[yaEsta].firmado = !p.consentimientos[yaEsta].firmado;
            p.consentimientos[yaEsta].fecha = hoy();
          } else {
            p.consentimientos.push({idProc, procedimiento:pr.nombre, fecha:hoy(),
                                    firmado:true, texto});
          }
          p.modificado = ahora();
          guardar('pacientes', p.id, p);
          avisar('Consentimiento asentado.', 'ok');
          refrescar();
        }, 'suave'));
    }});
}

function imprimirTexto(titulo, texto) {
  const v = window.open('', '_blank');
  if (!v) return avisar('El navegador bloqueó la ventana de impresión.', 'error');
  v.document.write('<!DOCTYPE html><html lang="es-AR"><head><meta charset="utf-8">' +
    '<title>' + esc(titulo) + '</title><style>' +
    'body{font-family:Georgia,"Times New Roman",serif;max-width:19cm;margin:1.5cm auto;' +
    'line-height:1.6;font-size:11.5pt;color:#111;white-space:pre-wrap}' +
    '@media print{body{margin:0}}</style></head><body>' + esc(texto) + '</body></html>');
  v.document.close();
  setTimeout(() => v.print(), 350);
}


/* =========================================================================
   CAMPO DE DIAGNOSTICO CON AUTOCOMPLETADO
   -------------------------------------------------------------------------
   Mientras se escribe, muestra debajo los sindromes del catalogo y los
   codigos de la CIE-11 que coinciden. Al elegir uno:

     · si es un SINDROME del catalogo, completa el nombre, el codigo, la
       denominacion y el mecanismo, y deja enganchado el plan terapeutico;
     · si es un CODIGO suelto, completa el codigo y la denominacion y deja
       el nombre tal como lo escribio el medico.

   El campo NUNCA bloquea la escritura libre: si el diagnostico no esta en
   ninguna de las dos listas, se escribe igual y no pasa nada.
   ========================================================================= */
function campoDiagnostico(nodo, p, alGuardar) {
  const caja = document.createElement('div');
  caja.className = 'campo';
  caja.style.position = 'relative';
  caja.innerHTML = '<label>Síndrome</label>' +
    '<input type="text" autocomplete="off" placeholder="Escribí y elegí de la lista" ' +
    'value="' + esc(p.diagnostico.sindrome || '') + '">' +
    '<div class="ayuda">Empezá a escribir: la aplicación busca en los ' + SINDROMES.length +
    ' síndromes del catálogo y en el capítulo MG30 de la CIE-11, y completa el código sola.</div>';
  nodo.appendChild(caja);

  const inp = $('input', caja);
  const lista = document.createElement('div');
  lista.className = 'sugerencias';
  caja.appendChild(lista);

  const cerrar = () => { lista.innerHTML = ''; lista.style.display = 'none'; };
  cerrar();

  function pintar() {
    const res = buscarDiagnostico(inp.value, 8);
    if (!res.length) return cerrar();
    lista.style.display = 'block';
    lista.innerHTML = res.map((r, i) =>
      '<div class="sug" data-i="' + i + '">' +
      '<b>' + esc(r.nombre) + '</b>' +
      '<small>' + esc(r.cod) + ' · ' + esc(r.txt) +
      (r.tipo === 'sindrome' ? ' · ' + esc(mecanismoLegible(r.mecanismo)) : '') +
      (r.tipo === 'sindrome' ? '' : ' · solo código') + '</small></div>').join('');

    for (const nodoSug of $$('.sug', lista)) {
      nodoSug.onmousedown = e => {          // mousedown y no click: el blur del
        e.preventDefault();                 // input llega antes que el click
        elegir(res[Number(nodoSug.dataset.i)]);
      };
    }
  }

  function elegir(r) {
    p.diagnostico.icd = r.cod + ' — ' + r.txt;
    if (r.tipo === 'sindrome') {
      p.diagnostico.sindrome = r.nombre;
      p.diagnostico.sindromeId = r.sindrome.id;
      p.diagnostico.mecanismo = r.sindrome.mecanismo;
      if (!p.diagnostico.fecha) p.diagnostico.fecha = hoy();
      avisar('Diagnóstico y código completados. El plan sugerido ya está disponible.', 'ok');
    } else {
      /* Un codigo suelto no define un sindrome: se conserva lo escrito. */
      if (inp.value.trim()) p.diagnostico.sindrome = inp.value.trim();
      p.diagnostico.sindromeId = '';
    }
    inp.value = p.diagnostico.sindrome;
    cerrar();
    alGuardar();
    refrescar();
  }

  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  inp.addEventListener('blur', () => setTimeout(cerrar, 120));
  inp.addEventListener('change', () => {
    /* Escritura libre: se guarda tal cual, sin exigir que este en la lista. */
    p.diagnostico.sindrome = inp.value;
    alGuardar();
  });
  inp.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

  return inp;
}
