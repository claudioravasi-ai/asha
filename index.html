/* ==== styles.css ==== */
/* =========================================================================
   ALGOS — lenguaje visual
   -------------------------------------------------------------------------
   La aplicacion no tiene barra de menu, ni botonera, ni pestañas. Tiene un
   LIENZO sobre el que se abren VENTANAS, y cada ventana se abre tocando una
   SUPERFICIE de la anterior.

   Las ventanas se apilan hacia la derecha. Las que quedan atras se
   contraen en un LOMO vertical sobre el borde izquierdo, como los libros de
   un estante: siguen ahi, se ve de que son, y se vuelve a ellas tocandolas.
   Eso reemplaza al menu y al boton de volver a la vez.

   Regla de composicion: si algo se puede tocar, tiene fondo propio y se
   levanta al pasar por encima. Si no se puede tocar, es texto plano. No hay
   estados intermedios ni adornos que simulen ser tocables.
   ========================================================================= */

:root{
  --fondo:#eef0f4;
  --lienzo:#e4e7ee;
  --ventana:#ffffff;
  --tinta:#141821;
  --tinta-2:#4a5364;
  --tinta-3:#828b9c;
  --linea:#dde1e9;
  --acento:#2d6a72;
  --acento-claro:#e3f0f1;
  --acento-tinta:#1d4a50;

  --verde:#2f9e5f;  --lima:#8cc63f;  --ambar:#f2b705;
  --naranja:#f2711c; --rojo:#d92b2b; --violeta:#7c5cc4;

  --r:14px;
  --sombra:0 1px 2px rgba(20,24,33,.05), 0 4px 16px rgba(20,24,33,.06);
  --sombra-alta:0 2px 6px rgba(20,24,33,.08), 0 16px 44px rgba(20,24,33,.14);
  --fuente:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark){
  :root{
    --fondo:#0f1218; --lienzo:#161a22; --ventana:#1b202a;
    --tinta:#e9ecf3; --tinta-2:#a5aec0; --tinta-3:#6f7a8e;
    --linea:#2a313d;
    --acento:#5aa8b0; --acento-claro:#1d3b3f; --acento-tinta:#a9d6da;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
    --sombra-alta:0 2px 8px rgba(0,0,0,.5), 0 20px 50px rgba(0,0,0,.5);
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:var(--fuente); color:var(--tinta);
  background:var(--fondo); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0 0 .7em}
p:last-child{margin-bottom:0}
input,select,textarea,button{font:inherit; color:inherit}

/* ====================================================== ESTRUCTURA ===== */

#app{display:flex; flex-direction:column; height:100vh; height:100dvh}

.barra{
  display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:var(--ventana);
  border-bottom:1px solid var(--linea); flex:0 0 auto; z-index:40;
}
.marca{display:flex; align-items:baseline; gap:9px; cursor:pointer; user-select:none}
.marca b{font-size:17px; letter-spacing:.06em; font-weight:700}
.marca span{font-size:11.5px; color:var(--tinta-3); letter-spacing:.02em}
.marca #marcaFirma{color:var(--acento); font-weight:500}
@media(max-width:760px){ .marca #marcaBajada{display:none} }
.barra .espacio{flex:1}

.conexion{width:9px; height:9px; border-radius:50%; background:var(--tinta-3); flex:0 0 auto}

/* la cuenta, arriba a la derecha */
.usuario{
  flex:0 0 auto; width:32px; height:32px; border-radius:10px; cursor:pointer;
  background:var(--acento-claro); color:var(--acento-tinta);
  display:flex; align-items:center; justify-content:center;
  font-size:12.5px; font-weight:700; user-select:none;
  transition:transform .13s ease;
}
.usuario:hover{transform:translateY(-1px)}
.usuario:empty{display:none}

.panel-cuenta{
  position:fixed; top:52px; right:14px; z-index:60; width:240px;
  background:var(--ventana); border:1px solid var(--linea); border-radius:var(--r);
  box-shadow:var(--sombra-alta); overflow:hidden;
  animation:baja .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes baja{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.panel-cuenta .quien{padding:13px 15px; border-bottom:1px solid var(--linea)}
.panel-cuenta .quien b{display:block; font-size:14px}
.panel-cuenta .quien small{display:block; color:var(--tinta-3); font-size:12px; margin-top:2px;
  word-break:break-all}
.panel-cuenta .item{
  padding:11px 15px; cursor:pointer; font-size:13.5px;
  border-bottom:1px solid var(--linea);
}
.panel-cuenta .item:last-child{border-bottom:0}
.panel-cuenta .item:hover{background:var(--lienzo)}
.panel-cuenta .item.salir{color:var(--rojo); font-weight:600}
.conexion.ok{background:var(--verde)}
.conexion.sin{background:var(--ambar)}

/* -------- el lienzo y la pila de ventanas -------------------------------- */

.lienzo{
  flex:1; display:flex; align-items:stretch; gap:10px;
  padding:12px; overflow-x:auto; overflow-y:hidden;
  background:var(--lienzo); scroll-behavior:smooth;
  /* Centrado, para que en un monitor ancho la pila no quede pegada a la
     izquierda con una franja gris al costado. El "safe" es imprescindible:
     sin el, cuando el contenido no entra, el centrado corta el principio y
     ya no se puede llegar a el ni con scroll. */
  justify-content:safe center;
}

.lomo{
  flex:0 0 46px;
  background:var(--ventana); border:1px solid var(--linea);
  border-radius:var(--r); cursor:pointer; position:relative;
  display:flex; align-items:center; justify-content:center;
  transition:flex-basis .18s ease, background .18s ease;
  box-shadow:var(--sombra);
}
.lomo:hover{background:var(--acento-claro); flex-basis:54px}
.lomo b{
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:12.5px; font-weight:600; color:var(--tinta-2);
  white-space:nowrap; overflow:hidden; max-height:80%;
  letter-spacing:.02em;
}
.lomo:hover b{color:var(--acento-tinta)}

.ventana{
  /* flex-basis en 0 y no en 620: con una base grande, la ventana y los lomos
     se disputan el espacio proporcionalmente y siempre sobran unos pixeles
     que producen una barra horizontal por nada. Con base 0, la ventana toma
     exactamente lo que queda despues de los lomos: no puede desbordar.
     El max-width sigue poniendo el limite de lectura en pantallas anchas. */
  flex:1 1 0; min-width:0; max-width:900px;
  background:var(--ventana); border:1px solid var(--linea);
  border-radius:var(--r); box-shadow:var(--sombra-alta);
  display:flex; flex-direction:column; overflow:hidden;
  animation:entra .22s cubic-bezier(.2,.8,.3,1);
}
.ventana.ancha{max-width:1280px}
@keyframes entra{from{opacity:0; transform:translateX(18px) scale(.99)} to{opacity:1; transform:none}}

.ventana > header{
  padding:15px 20px 13px; border-bottom:1px solid var(--linea);
  display:flex; align-items:flex-start; gap:12px; flex:0 0 auto;
}
.ventana > header h2{font-size:17px; line-height:1.25}
.ventana > header .sub{font-size:12.5px; color:var(--tinta-3); margin-top:2px}
.ventana > header .espacio{flex:1}

.cerrar{
  flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:0;
  background:transparent; color:var(--tinta-3); cursor:pointer; font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.cerrar:hover{background:var(--lienzo); color:var(--tinta)}

.cuerpo{padding:16px 20px 22px; overflow-y:auto; flex:1; overscroll-behavior:contain}

/* ====================================================== SUPERFICIES ==== */
/* Reemplazan a los botones. Son bloques que se tocan.                     */

.superficie{
  display:block; width:100%; text-align:left; cursor:pointer;
  background:var(--ventana); border:1px solid var(--linea);
  border-radius:11px; padding:13px 15px; margin-bottom:8px;
  transition:transform .13s ease, box-shadow .13s ease, border-color .13s ease;
}
.superficie:hover{transform:translateY(-1px); box-shadow:var(--sombra); border-color:var(--acento)}
.superficie:active{transform:translateY(0)}
.superficie b{display:block; font-size:14.5px; font-weight:600}
.superficie small{display:block; color:var(--tinta-3); font-size:12.5px; margin-top:2px; line-height:1.45}
.superficie.acento{background:var(--acento); border-color:var(--acento); color:#fff}
.superficie.acento small{color:rgba(255,255,255,.82)}
.superficie.suave{background:var(--acento-claro); border-color:transparent; color:var(--acento-tinta)}
.superficie.peligro{border-color:var(--rojo); color:var(--rojo)}
.superficie.fina{padding:10px 13px; margin-bottom:6px}

.rejilla{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:9px}
.rejilla .superficie{margin:0; height:100%}
.fila{display:flex; gap:8px; flex-wrap:wrap}
.fila .superficie{margin:0; width:auto; flex:1 1 150px}

/* mosaico de entrada: las ventanas grandes de la pantalla inicial */
.mosaico{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px}
.teja{
  cursor:pointer; background:var(--ventana); border:1px solid var(--linea);
  border-radius:var(--r); padding:20px 18px; min-height:132px;
  display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .15s ease, box-shadow .15s ease;
}
.teja:hover{transform:translateY(-2px); box-shadow:var(--sombra-alta)}
.teja .n{font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1}
.teja b{font-size:15px; display:block}
.teja small{color:var(--tinta-3); font-size:12.5px; display:block; margin-top:3px; line-height:1.4}
.teja.destaca{background:var(--acento); border-color:var(--acento); color:#fff}
.teja.destaca small{color:rgba(255,255,255,.8)}

/* ====================================================== FORMULARIOS ==== */

.campo{margin-bottom:13px}
.campo > label{
  display:block; font-size:12px; font-weight:600; color:var(--tinta-2);
  margin-bottom:5px; letter-spacing:.01em;
}
.campo .ayuda{font-size:11.5px; color:var(--tinta-3); margin-top:4px; line-height:1.45}
/* Se listan por exclusion y no por inclusion: enumerar los tipos uno por uno
   deja afuera al que se agregue despues, y fue justo lo que paso con el campo
   de contraseña, que quedaba angosto. */
input:not([type=checkbox]):not([type=radio]):not([type=file]),
select,textarea{
  width:100%; padding:10px 12px; border:1px solid var(--linea); border-radius:9px;
  background:var(--fondo); color:var(--tinta); outline:none; transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--acento); background:var(--ventana)}
input[type=date]{min-height:42px}
textarea{resize:vertical; min-height:74px; line-height:1.5}
.dos{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.tres{display:grid; grid-template-columns:repeat(3,1fr); gap:11px}
@media(max-width:560px){.dos,.tres{grid-template-columns:1fr}}

/* opciones que se marcan tocandolas: sin casillas ni radios dibujados */
.opciones{display:flex; flex-wrap:wrap; gap:6px}
.op{
  padding:7px 13px; border:1px solid var(--linea); border-radius:999px;
  background:var(--ventana); cursor:pointer; font-size:13px; user-select:none;
  transition:all .13s ease;
}
.op:hover{border-color:var(--acento)}
.op.on{background:var(--acento); border-color:var(--acento); color:#fff; font-weight:500}
.op.si.on{background:var(--verde); border-color:var(--verde)}
.op.no.on{background:var(--tinta-3); border-color:var(--tinta-3)}

/* escala numerica 0 a 10 */
.nrs{display:flex; gap:4px; flex-wrap:wrap}
.nrs .n{
  flex:1 1 30px; min-width:30px; height:40px; border-radius:9px;
  border:1px solid var(--linea); background:var(--ventana);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-weight:600; font-size:14px; transition:all .12s;
}
.nrs .n:hover{transform:translateY(-2px)}
.nrs .n.on{color:#fff; border-color:transparent; box-shadow:var(--sombra)}
.nrs-pie{display:flex; justify-content:space-between; font-size:11px; color:var(--tinta-3); margin-top:5px}

/* ====================================================== PIEZAS ========= */

.bloque{
  border:1px solid var(--linea); border-radius:12px;
  padding:14px 16px; margin-bottom:12px; background:var(--fondo);
}
.bloque > h3{font-size:13px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--tinta-3); margin-bottom:9px; font-weight:600}

.dato{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--linea); font-size:13.5px}
.dato:last-child{border-bottom:0}
.dato dt{flex:0 0 40%; color:var(--tinta-3); margin:0}
.dato dd{flex:1; margin:0}

.marca-txt{
  display:inline-block; padding:2px 9px; border-radius:999px;
  font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
}
.m-verde{background:rgba(47,158,95,.14); color:var(--verde)}
.m-lima{background:rgba(140,198,63,.18); color:#5f8c25}
.m-ambar{background:rgba(242,183,5,.18); color:#a87f00}
.m-naranja{background:rgba(242,113,28,.16); color:var(--naranja)}
.m-rojo{background:rgba(217,43,43,.14); color:var(--rojo)}
.m-violeta{background:rgba(124,92,196,.15); color:var(--violeta)}
.m-neutro{background:var(--lienzo); color:var(--tinta-2)}
.m-acento{background:var(--acento-claro); color:var(--acento-tinta)}

/* encabezado del paciente: en el monitor, nombre y anillo lado a lado; en el
   telefono, apilados, porque a 375 px el anillo le come el diagnostico */
.cab-paciente{display:flex; align-items:center; gap:16px}
.cab-anillo{text-align:center; flex:0 0 auto}
@media(max-width:520px){
  .cab-paciente{flex-direction:column; align-items:flex-start; gap:10px}
  .cab-anillo{display:flex; align-items:center; gap:9px; text-align:left}
  .cab-anillo .nota{margin-top:0 !important}
}

/* sugerencias del campo de diagnostico */
.sugerencias{
  position:absolute; left:0; right:0; top:100%; z-index:30;
  background:var(--ventana); border:1px solid var(--acento); border-radius:11px;
  box-shadow:var(--sombra-alta); overflow:hidden; margin-top:-14px; max-height:290px;
  overflow-y:auto;
}
.sug{padding:9px 13px; cursor:pointer; border-bottom:1px solid var(--linea)}
.sug:last-child{border-bottom:0}
.sug:hover{background:var(--acento-claro)}
.sug b{display:block; font-size:13.5px; font-weight:600}
.sug small{display:block; font-size:11.5px; color:var(--tinta-3); margin-top:1px}

/* alertas: banderas rojas y controles de seguridad */
.alerta{
  border-left:3px solid var(--tinta-3); border-radius:9px;
  background:var(--fondo); padding:11px 14px; margin-bottom:9px;
}
/* Solo el TITULO de la alerta va en bloque. Sin el ">" la regla alcanzaba a
   cualquier negrita dentro del texto y partia las frases en varias lineas. */
.alerta > b{display:block; font-size:13.5px; margin-bottom:3px}
.alerta p{font-size:13px; color:var(--tinta-2); line-height:1.5}
.alerta p b{font-weight:600}
.alerta.urgente{border-left-color:var(--rojo); background:rgba(217,43,43,.06)}
.alerta.urgente b{color:var(--rojo)}
.alerta.alto{border-left-color:var(--naranja); background:rgba(242,113,28,.06)}
.alerta.medio{border-left-color:var(--ambar); background:rgba(242,183,5,.07)}
.alerta.info{border-left-color:var(--acento)}

/* la marca que lleva todo lo que propone la aplicacion */
.sugerido{
  border:1px dashed var(--acento); border-radius:12px;
  padding:13px 15px; margin-bottom:11px; background:var(--acento-claro);
}
.sugerido > .cabeza{
  display:flex; align-items:center; gap:7px; margin-bottom:9px;
  font-size:11px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--acento-tinta);
}
.sugerido .pie-aviso{
  font-size:11.5px; color:var(--tinta-3); margin-top:10px;
  padding-top:9px; border-top:1px solid rgba(0,0,0,.07); line-height:1.45;
}

/* barra de concordancia del diferencial */
.barra-pct{height:5px; border-radius:3px; background:var(--linea); overflow:hidden; margin-top:7px}
.barra-pct i{display:block; height:100%; border-radius:3px}

/* lista de pacientes */
.pac{
  display:flex; align-items:center; gap:13px; padding:11px 13px;
  border:1px solid var(--linea); border-radius:11px; margin-bottom:7px;
  cursor:pointer; background:var(--ventana); transition:all .13s;
}
.pac:hover{border-color:var(--acento); transform:translateY(-1px); box-shadow:var(--sombra)}
.pac .ini{
  flex:0 0 40px; height:40px; border-radius:11px; background:var(--acento-claro);
  color:var(--acento-tinta); display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px;
}
.pac .med{flex:1; min-width:0}
.pac .med b{display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pac .med small{display:block; color:var(--tinta-3); font-size:12px; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.pac .anillo{flex:0 0 auto}

/* ====================================================== MAPA CORPORAL == */

.mapa{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.mapa-vista{flex:1 1 220px; max-width:290px; text-align:center}
.mapa-vista > span{display:block; font-size:11.5px; color:var(--tinta-3); margin-bottom:5px;
  text-transform:uppercase; letter-spacing:.05em; font-weight:600}
.silueta{
  width:100%; height:auto; touch-action:manipulation; cursor:crosshair;
  background:var(--fondo); border:1px solid var(--linea); border-radius:12px;
  display:block;
}
.silueta .cuerpo-parte{fill:var(--lienzo); stroke:var(--tinta-3); stroke-width:1.1; opacity:.85}
@media (prefers-color-scheme: dark){ .silueta .cuerpo-parte{fill:#242a35; opacity:1} }
.silueta .cuerpo-rasgo{fill:none; stroke:var(--tinta-3); stroke-width:1.1; opacity:.7;
  stroke-linejoin:round}
.silueta .punto{cursor:pointer}
.silueta .punto:hover circle{stroke-width:2.4}

.leyenda-dolor{display:flex; gap:5px; justify-content:center; margin-top:9px; flex-wrap:wrap}
.leyenda-dolor span{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--tinta-3)}
.leyenda-dolor i{width:11px; height:11px; border-radius:50%; display:inline-block}

/* el selector de intensidad que aparece al marcar un punto */
.selector-dolor{
  position:fixed; inset:0; background:rgba(10,13,19,.5); z-index:80;
  display:flex; align-items:flex-end; justify-content:center; padding:16px;
  backdrop-filter:blur(3px);
}
.selector-dolor > div{
  background:var(--ventana); border-radius:var(--r); padding:20px;
  width:100%; max-width:440px; box-shadow:var(--sombra-alta);
  animation:sube .2s cubic-bezier(.2,.8,.3,1);
}
@keyframes sube{from{transform:translateY(24px); opacity:0} to{transform:none; opacity:1}}
@media(min-width:640px){.selector-dolor{align-items:center}}

/* ====================================================== VARIOS ========= */

.grafico{width:100%; height:auto; color:var(--tinta-2)}
.grafico-vacio{padding:22px; text-align:center; color:var(--tinta-3); font-size:13px;
  border:1px dashed var(--linea); border-radius:11px}

.vacio{padding:34px 20px; text-align:center; color:var(--tinta-3)}
.vacio b{display:block; color:var(--tinta-2); margin-bottom:5px; font-size:14.5px}
.vacio p{font-size:13px; max-width:340px; margin:0 auto}

.nota{font-size:12px; color:var(--tinta-3); line-height:1.5}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px}

#avisos{position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  z-index:100; display:flex; flex-direction:column; gap:7px; align-items:center;
  pointer-events:none; width:calc(100% - 32px); max-width:460px}
.aviso{
  background:var(--tinta); color:var(--fondo); padding:11px 17px; border-radius:11px;
  font-size:13.5px; box-shadow:var(--sombra-alta); opacity:0; transform:translateY(10px);
  transition:all .28s cubic-bezier(.2,.8,.3,1); max-width:100%;

.aviso.entra{opacity:1; transform:none}
.aviso-ok{background:var(--verde); color:#fff}
.aviso-error{background:var(--rojo); color:#fff}
.aviso-aviso{background:var(--ambar); color:#3a2c00}

/* ====================================================== PORTAL ========= */
/* El cuestionario que completa el paciente desde su casa. Mismo lenguaje,
   pero centrado y con tipografia mas grande: lo van a llenar en el telefono
   y muchas veces con dolor.                                               */

body.portal{overflow:auto; background:var(--lienzo)}
.portal-caja{max-width:640px; margin:0 auto; padding:20px 16px 70px}
.portal-caja .ventana{max-width:none; box-shadow:var(--sombra); margin-bottom:14px;
  animation:none; flex:none}
.portal-caja .cuerpo{overflow:visible; font-size:15.5px}
.portal-caja input,.portal-caja select,.portal-caja textarea{padding:12px 13px; font-size:16px}
.portal-caja .op{padding:9px 15px; font-size:14px}
.portal-caja .nrs .n{height:46px; font-size:15px}

.pasos{display:flex; gap:5px; margin:14px 0 18px}
.pasos i{flex:1; height:4px; border-radius:2px; background:var(--linea)}
.pasos i.hecho{background:var(--verde)}
.pasos i.actual{background:var(--acento)}

.portal-cabeza{text-align:center; padding:22px 0 6px}
.portal-cabeza b{font-size:22px; letter-spacing:.08em; display:block}
.portal-cabeza span{font-size:13px; color:var(--tinta-3)}

/* ====================================================== TELEFONO ======= */

@media(max-width:900px){
  .lienzo{padding:8px; gap:6px}
  .lomo{flex-basis:38px}
}

@media(max-width:760px){
  .ventana{min-width:0; flex:1 1 0; max-width:none}
  .cab-paciente{gap:10px}
  .lomo{flex-basis:38px}
  .lomo:hover{flex-basis:38px}
  .cuerpo{padding:14px 15px 26px}
  .ventana > header{padding:13px 15px 11px}
  .barra{padding:9px 14px}
  .dato dt{flex-basis:44%}
  /* Los once numeros de la escala tienen que entrar en UNA fila aunque el
     telefono sea angosto: partida en dos, deja de leerse como una escala. */
  .nrs{gap:3px}
  .nrs .n{flex:1 1 0; min-width:0; font-size:13px}
  .portal-caja .nrs .n{height:44px}
}
@media(max-width:400px){
  .nrs{gap:2px}
  .nrs .n{font-size:12px; border-radius:7px}
}

@media print{
  body{background:#fff; overflow:visible}
  .barra,.lomo,.cerrar,#avisos,.superficie{display:none !important}
  .lienzo{display:block; padding:0; background:#fff; overflow:visible}
  .ventana{max-width:none; box-shadow:none; border:0; break-inside:avoid}
  .cuerpo{overflow:visible; padding:0}
}

/* ================ data-mapa.js ================ */
/* =========================================================================
   MAPA CORPORAL DEL DOLOR  —  el "mapa dermatomal de Bonica" de la norma
   -------------------------------------------------------------------------
   Las Normas de Dolor argentinas (FAAAAR / anestesia.org.ar) exigen que la
   historia clinica de dolor incluya un mapa dermatomal. Este modulo lo
   provee y ademas lo vuelve util: cada punto que el paciente marca sobre la
   silueta cae en una ZONA, y cada zona sabe

     - a que region del indice de dolor generalizado (WPI) pertenece,
       con lo cual los criterios ACR 2016 de fibromialgia se calculan solos;
     - que raices nerviosas la inervan, con lo cual se puede evaluar si la
       distribucion del dolor es neuroanatomicamente plausible, que es el
       primer escalon del sistema de gradacion NeuPSIG de dolor neuropatico.

   El paciente marca con el dedo o el mouse y le pone intensidad 0-10 a cada
   punto. El color va del verde al rojo como un semaforo, asi el medico ve la
   topografia y la severidad de un vistazo, sin leer un solo numero.

   COORDENADAS: las siluetas usan un lienzo de 200 x 520 unidades. Los puntos
   se guardan en esas unidades, no en pixeles, para que el dibujo sea el
   mismo en un telefono y en el monitor del consultorio.

/* -------------------------------------------------------------------------
   SEMAFORO DE INTENSIDAD
   Cinco tramos, del verde al rojo. Se eligieron tramos de a dos puntos
   porque la escala numerica no discrimina mas fino que eso: la diferencia
   entre un 6 y un 7 no es reproducible, la que hay entre un 4 y un 8 si.
   ------------------------------------------------------------------------- */
const COLOR_DOLOR = [
  {hasta:2,  color:'#2f9e5f', borde:'#1e6b3f', nombre:'Leve'},
  {hasta:4,  color:'#8cc63f', borde:'#5f8c25', nombre:'Leve a moderado'},
  {hasta:6,  color:'#f2b705', borde:'#a87f00', nombre:'Moderado'},
  {hasta:8,  color:'#f2711c', borde:'#a84a0b', nombre:'Intenso'},
  {hasta:10, color:'#d92b2b', borde:'#8f1616', nombre:'Muy intenso'}
];

function colorDolor(intensidad) {
  const i = Math.max(0, Math.min(10, Number(intensidad) || 0));
  for (const tramo of COLOR_DOLOR) if (i <= tramo.hasta) return tramo;
  return COLOR_DOLOR[COLOR_DOLOR.length - 1];
}

/* -------------------------------------------------------------------------
   A que zona pertenece un punto. Si cae fuera de todas (el borde de la
   silueta, el hueco entre el brazo y el torso), se toma la zona de la misma
   vista cuyo centro este mas cerca: es preferible asignarlo a la region
   vecina que descartar una marca que el paciente hizo a proposito.
   ------------------------------------------------------------------------- */
function zonaDe(x, y, vista) {
  const v = vista === 'd' ? 'd' : 'f';
  for (const z of ZONAS_CUERPO) {
    if (z.v !== v) continue;
    const [bx, by, bw, bh] = z.box;
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) return z;
  }
  let mejor = null, mejorD = Infinity;
  for (const z of ZONAS_CUERPO) {
    if (z.v !== v) continue;
    const [bx, by, bw, bh] = z.box;
    const cx = bx + bw / 2, cy = by + bh / 2;
    const d = (x - cx) * (x - cx) + (y - cy) * (y - cy);
    if (d < mejorD) { mejorD = d; mejor = z; }
  }
  return mejor;
}

/* Nombre legible de una zona, con el lado incluido: "Muslo derecho". */
function nombreZona(z) {
  if (!z) return '—';
  return z.lado ? z.nombre + ' ' + z.lado : z.nombre;
}

/* -------------------------------------------------------------------------
   LECTURA CLINICA DEL MAPA
   Convierte la nube de puntos en los numeros que el motor necesita. Es la
   pieza que hace que marcar la silueta no sea un dibujito sino un dato.
   ------------------------------------------------------------------------- */
function leerMapa(puntos) {
  const p = Array.isArray(puntos) ? puntos.filter(q => q && q.i > 0) : [];
  const r = {
    total: p.length,
    zonas: [],              // zonas afectadas, con intensidad maxima
    wpi: 0,                 // indice de dolor generalizado, 0 a 19
    wpiRegiones: [],
    areas: [],              // cuantas de las 5 areas corporales
    raices: {},             // raiz nerviosa -> cantidad de puntos
    intensidadMax: 0,
    intensidadMedia: 0,
    bilateral: false,
    distribucion: 'sin marcas'
  };
  if (!p.length) return r;

  const porZona = new Map();
  const wpiSet = new Set();
  const areaSet = new Set();
  let suma = 0;

  for (const punto of p) {
    const z = zonaDe(punto.x, punto.y, punto.v);
    if (!z) continue;
    suma += punto.i;
    r.intensidadMax = Math.max(r.intensidadMax, punto.i);
    const prev = porZona.get(z.id);
    if (!prev || punto.i > prev.i) porZona.set(z.id, {z, i:punto.i, n:(prev ? prev.n : 0) + 1});
    else porZona.set(z.id, {z, i:prev.i, n:prev.n + 1});
    if (z.wpi) {
      wpiSet.add(z.wpi);
      const reg = WPI_REGIONES.find(w => w.id === z.wpi);
      if (reg) areaSet.add(reg.area);
    }
    for (const raiz of (z.raices || [])) r.raices[raiz] = (r.raices[raiz] || 0) + 1;
  }

  r.zonas = [...porZona.values()].sort((a, b) => b.i - a.i);
  r.wpi = wpiSet.size;
  r.wpiRegiones = [...wpiSet];
  r.areas = [...areaSet];
  r.intensidadMedia = Math.round((suma / p.length) * 10) / 10;

  const izq = r.zonas.some(x => /izquierd/.test(x.z.lado));
  const der = r.zonas.some(x => /derech/.test(x.z.lado));
  r.bilateral = izq && der;

  /* Distribucion: es el dato que separa un dolor discreto de uno regional y
     de uno generalizado, y ese es exactamente el primer criterio del sistema
     de gradacion de dolor nociplastico de Kosek (2021). */
  if (r.wpi >= 7 && r.areas.length >= 4)      r.distribucion = 'generalizada';
  else if (r.wpi >= 4)                        r.distribucion = 'multifocal';
  else if (r.zonas.length >= 2)               r.distribucion = 'regional';
  else                                        r.distribucion = 'localizada';

  return r;
}

/* -------------------------------------------------------------------------
   ¿La distribucion sigue un territorio nervioso?
   Devuelve la raiz mas representada y que proporcion de los puntos cubre.
   Una concentracion alta en una sola raiz, sobre todo si es unilateral, es
   lo que en la gradacion NeuPSIG se llama "distribucion neuroanatomicamente
   plausible" y habilita el escalon de dolor neuropatico POSIBLE.
   ------------------------------------------------------------------------- */
function raizDominante(lectura) {
  const entradas = Object.entries(lectura.raices || {});
  if (!entradas.length) return null;
  entradas.sort((a, b) => b[1] - a[1]);
  const totalPuntos = entradas.reduce((s, e) => s + e[1], 0);
  return {
    raiz: entradas[0][0],
    puntos: entradas[0][1],
    proporcion: Math.round((entradas[0][1] / totalPuntos) * 100),
    top: entradas.slice(0, 3).map(e => e[0])
  };
}

   se muestra ordenado, como un diagnostico diferencial.

   Esto NO es un diagnosticador. Es lo que en la practica hace un residente

   marcadas y son editables.

   La clasificacion de dolor cronico que la IASP desarrollo junto a la OMS y

   codigos propios en una clasificacion internacional, y la distincion que la
   ordena es entre dolor PRIMARIO (el dolor es la enfermedad) y dolor
   SECUNDARIO (el dolor es sintoma de otra cosa).

   Cada entrada trae ademas PALABRAS: los terminos con los que un medico
   escribe ese diagnostico en la practica. Eso es lo que permite que el
   codigo se complete solo mientras se escribe, sin tener que buscarlo en
   otro lado.

   SOBRE LOS CODIGOS
   Los de nivel MG30.0 a MG30.6 y los subcodigos de MG30.0 estan verificados
   contra la clasificacion de la OMS. Los subcodigos de las demas ramas
   siguen la literatura de la IASP y son los de uso corriente, pero antes de
   usarlos en documentacion oficial conviene confirmarlos en la herramienta
   de codificacion de la OMS: https://icd.who.int/ct11
   ========================================================================= */

/* -------------------------------------------------------------------------
   Busca a la vez en el catalogo de sindromes y en la clasificacion. Devuelve
   sugerencias ordenadas: primero los sindromes, que ademas del codigo traen
   el mecanismo y todo el plan, y despues los codigos sueltos para cuando el
   diagnostico no esta en el catalogo.
   ------------------------------------------------------------------------- */
function buscarDiagnostico(texto, cuantos) {
  const q = normalizar(texto).trim();
  if (q.length < 2) return [];
  const partes = q.split(/\s+/).filter(x => x.length >= 2);
  const salida = [];

  /* Sindromes del catalogo: si el medico elige uno, se completa TODO. */
  for (const s of SINDROMES) {
    const heno = normalizar(s.icd.cod + ' ' + s.nombre + ' ' + s.grupo + ' ' +
                            s.icd.txt + ' ' + s.resumen);
    if (!partes.every(t => heno.includes(t))) continue;
    /* Que la coincidencia empiece el nombre pesa mas que aparecer en el medio. */
    const peso = normalizar(s.nombre).startsWith(q) ? 0 : normalizar(s.nombre).includes(q) ? 1 : 2;
    salida.push({tipo:'sindrome', peso, sindrome:s,
      nombre:s.nombre, cod:s.icd.cod, txt:s.icd.txt,
      mecanismo:s.mecanismo, grupo:s.grupo});
  }

  /* Codigos sueltos de la clasificacion. */
  for (const e of ICD11_DOLOR) {
    /* El codigo entra en la busqueda: el medico que ya sabe cual es lo escribe
       directo y es mas rapido que buscarlo por el nombre. */
    const heno = normalizar(e.cod + ' ' + e.txt + ' ' + e.grupo + ' ' +
                            (e.palabras || '') + ' ' + (e.nota || ''));
    if (!partes.every(t => heno.includes(t))) continue;
    if (salida.some(x => x.cod === e.cod && x.tipo === 'sindrome')) continue;
    salida.push({tipo:'codigo', peso:normalizar(e.txt).startsWith(q) ? 3 : 4,
      nombre:e.txt, cod:e.cod, txt:e.txt, grupo:e.grupo, nota:e.nota});
  }

  salida.sort((a, b) => a.peso - b.peso || a.nombre.localeCompare(b.nombre));
  return salida.slice(0, cuantos || 8);
}

/* Dado un codigo, su denominacion. Sirve para completar el texto cuando el
   codigo se escribio a mano. */
function textoICD(cod) {
  const c = String(cod || '').trim().toUpperCase();
  const e = ICD11_DOLOR.find(x => x.cod.toUpperCase() === c);
  return e ? e.txt : '';
}

/* Los mecanismos se guardan sin tilde porque son claves internas; cuando se
   muestran, llevan tilde como cualquier palabra escrita en castellano. */
const MECANISMO_LEGIBLE = {
  nociceptivo:'nociceptivo', neuropatico:'neuropático',
  nociplastico:'nociplástico', mixto:'mixto'
};
function mecanismoLegible(m) { return MECANISMO_LEGIBLE[m] || m || ''; }

/* =========================================================================
   MILIGRAMOS EQUIVALENTES DE MORFINA (MME)
   -------------------------------------------------------------------------
   Factores de conversion de la guia del CDC 2022. El MME diario total es
   la unidad con la que se mide la carga opioide de un paciente y la que
   define los umbrales de precaucion.

   ADVERTENCIA que la aplicacion repite cada vez que muestra un MME: estos
   factores sirven para MEDIR la exposicion total, no para ROTAR de un
   opioide a otro. Al rotar hay que reducir entre 25% y 50% por tolerancia
   cruzada incompleta, y con la metadona el ajuste es mucho mayor y no lineal.
   ========================================================================= */
const MME_FACTOR = {
  codeina:0.15, tramadol:0.2, tapentadol:0.4, morfina:1, hidrocodona:1,
  oxicodona:1.5, oximorfona:3, hidromorfona:5,
  fentanilo_td:2.4,        // por mcg/h
  buprenorfina_td:12.6     // por mcg/h
};

/* La metadona no tiene un factor unico: crece con la dosis. */
const MME_METADONA = [
  {hasta:20,  factor:4},
  {hasta:40,  factor:8},
  {hasta:60,  factor:10},
  {hasta:Infinity, factor:12}
];

function mmeDeMetadona(mgDia) {
  for (const t of MME_METADONA) if (mgDia <= t.hasta) return mgDia * t.factor;
  return mgDia * 12;
}

/* Calcula el MME diario total de una lista de opioides.
   Cada item: {id, mgDia} para los orales, o {id, mcgHora} para los parches. */
function calcularMME(opioides) {
  let total = 0;
  const detalle = [];
  for (const o of (opioides || [])) {
    let mme = 0;
    if (o.id === 'metadona') {
      mme = mmeDeMetadona(Number(o.mgDia) || 0);
    } else if (o.id === 'fentanilo_td' || o.id === 'buprenorfina_td') {
      mme = (Number(o.mcgHora) || 0) * MME_FACTOR[o.id];
    } else if (MME_FACTOR[o.id] != null) {
      mme = (Number(o.mgDia) || 0) * MME_FACTOR[o.id];
    }
    total += mme;
    if (mme > 0) detalle.push({id:o.id, mme:Math.round(mme)});
  }
  total = Math.round(total);

  let nivel, color, aviso;
  if (total === 0)       { nivel='Sin opioides';  color='verde';  aviso=''; }
  else if (total < 50)   { nivel='Dosis baja';    color='lima';
    aviso='Rango habitual. Revalorar beneficio funcional en cada control.'; }
  else if (total < 90)   { nivel='Precaución';    color='ambar';
    aviso='≥50 MME/día: justificar la indicación por escrito, ofrecer naloxona domiciliaria y ' +
          'evaluar riesgo de sobredosis. Evitar benzodiacepinas concomitantes.'; }
  else                   { nivel='Dosis alta';    color='rojo';
    aviso='≥90 MME/día: el riesgo de sobredosis se multiplica. Revisar la indicación, considerar ' +
          'descenso gradual, naloxona domiciliaria e interconsulta. Descender siempre de a 10% cada ' +
          '2-4 semanas en tratamientos largos, nunca de golpe.'; }

  return {total, nivel, color, aviso, detalle,
    nota:'Los MME miden exposición total. NO usar estos factores para rotar de un opioide a otro ' +
         'sin reducir 25-50% por tolerancia cruzada incompleta.'};
}

/* =========================================================================
   NUCLEO — estado, almacenamiento, sincronizacion y utilidades
   -------------------------------------------------------------------------
   La aplicacion guarda TODO en el navegador primero y despues lo espeja en
   Firebase. Ese orden importa: si se cae internet en medio de una consulta,
   el medico sigue escribiendo y la historia no se pierde. Cuando vuelve la
   conexion, se sincroniza sola.

   ARBOL EN FIREBASE
     /dolor/pacientes/{id}      historias clinicas   — requiere estar logueado
     /dolor/precargas/{token}   cuestionarios que el paciente completa desde
                                su casa — escritura abierta, lectura solo
                                para el medico logueado
     /dolor/agenda/{id}         turnos
     /dolor/config              configuracion del consultorio

   Las reglas de seguridad correspondientes estan en reglas-firebase.txt y
   HAY QUE PEGARLAS EN LA CONSOLA: sin eso, o no funciona nada, o funciona
   todo para cualquiera.
   ========================================================================= */
'use strict';

/* ---------------------------------------------------------------- utiles */

const $  = (sel, raiz) => (raiz || document).querySelector(sel);
const $$ = (sel, raiz) => [...(raiz || document).querySelectorAll(sel)];

/* Escapa texto para meterlo en HTML. Se usa en TODO lo que viene del
   paciente: un apellido con un signo de menor que no puede romper la app. */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function uid(prefijo) {
  return (prefijo || 'id') + '_' + Date.now().toString(36) + '_' +
         Math.random().toString(36).slice(2, 8);
}

/* Token del enlace que se le manda al paciente por mail. Se usa
   crypto.getRandomValues y no Math.random: es un secreto, no un identificador. */
function tokenSeguro() {
  const a = new Uint8Array(24);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return [...a].map(b => b.toString(16).padStart(2, '0')).join('');
}

const hoy = () => new Date().toISOString().slice(0, 10);
const ahora = () => new Date().toISOString();

function fechaCorta(iso) {
  if (!iso) return '—';
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function fechaLarga(iso) {
  if (!iso) return '—';
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

/* "hace 3 meses", "hace 2 años" — para leer de un vistazo cuánto hace que
   no se ve a un paciente. */
function desdeHace(iso) {
  if (!iso) return '';
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (dias < 0)   return 'en ' + Math.abs(dias) + ' días';
  if (dias === 0) return 'hoy';
  if (dias === 1) return 'ayer';
  if (dias < 30)  return 'hace ' + dias + ' días';
  const meses = Math.floor(dias / 30);
  if (meses < 24) return 'hace ' + meses + (meses === 1 ? ' mes' : ' meses');
  return 'hace ' + Math.floor(meses / 12) + ' años';
}

/* Edad a partir de la fecha de nacimiento. */
function edadDe(fechaNac) {
  if (!fechaNac) return null;
  const n = new Date(fechaNac + 'T12:00:00');
  if (isNaN(n)) return null;
  const h = new Date();
  let e = h.getFullYear() - n.getFullYear();
  const m = h.getMonth() - n.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < n.getDate())) e--;
  return e >= 0 && e < 130 ? e : null;
}

/* Normaliza texto para buscar: saca tildes y pasa a minúsculas, para que
   "Muñoz" se encuentre escribiendo "munoz". */
function normalizar(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function dniLimpio(s) {
  return String(s || '').replace(/\D/g, '');
}

function emailValido(s) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim());
}

/* -------------------------------------------------------------------------
   La version se arma sola al construir, con el formato AAAA.MM.DD.HHMM. Sirve
   para saber de un vistazo si el dispositivo que se tiene delante esta viendo
   la ultima version o quedo con una vieja en cache, que es la primera
   pregunta cuando alguien dice "a mi no me aparece eso".
   ------------------------------------------------------------------------- */
function versionLegible() {
  const v = String(window.ALGOS_BUILD || '');
  const m = v.match(/^(\d{4})\.(\d{2})\.(\d{2})\.(\d{2})(\d{2})$/);
  if (!m) return {version:v || '—', fecha:'', texto:v || 'sin versión'};
  const [, a, mes, d, h, min] = m;
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio',
                 'agosto','septiembre','octubre','noviembre','diciembre'];
  const fecha = Number(d) + ' de ' + meses[Number(mes) - 1] + ' de ' + a +
                ', ' + h + ':' + min;
  return {version:v, fecha, texto:'Versión ' + v + ' · actualizada el ' + fecha};
}

/* ---------------------------------------------------------------- estado */

const ESTADO = {
  pacientes: {},      // id -> paciente con toda su historia
  precargas: {},      // token -> cuestionario que el paciente completa en su casa
  agenda: {},         // id -> turno
  equipo: {},         // uid -> quien puede entrar y con que rol
  invitaciones: {},   // codigo -> invitacion pendiente
  config: {},
  usuario: null,      // {uid, email, rol}
  conectado: false,
  listo: false
};

const CLAVE_LOCAL = 'algos_datos_v1';

/* -------------------------------------------------------- almacenamiento */

function guardarLocal() {
  try {
    localStorage.setItem(CLAVE_LOCAL, JSON.stringify({
      pacientes: ESTADO.pacientes,
      precargas: ESTADO.precargas,
      agenda: ESTADO.agenda,
      equipo: ESTADO.equipo,
      invitaciones: ESTADO.invitaciones,
      config: ESTADO.config,
      guardadoEn: ahora()
    }));
    return true;
  } catch (e) {
    /* El almacenamiento local tiene un tope de unos 5 MB. Cuando se llena,
       hay que avisarlo y no fallar en silencio: el médico creería que guardó. */
    console.error('No se pudo guardar localmente:', e);
    avisar('No se pudo guardar en este dispositivo. Puede que el almacenamiento ' +
           'esté lleno. Exportá una copia de seguridad ahora.', 'error');
    return false;
  }
}

function cargarLocal() {
  try {
    const crudo = localStorage.getItem(CLAVE_LOCAL);
    if (!crudo) return false;
    const d = JSON.parse(crudo);
    ESTADO.pacientes = d.pacientes || {};
    ESTADO.precargas = d.precargas || {};
    ESTADO.agenda    = d.agenda    || {};
    ESTADO.config    = d.config    || {};
    return true;
  } catch (e) {
    console.error('Los datos guardados no se pudieron leer:', e);
    return false;
  }
}

/* ------------------------------------------------------------- Firebase  */

let fbApp = null, fbDb = null, fbAuth = null;

function firebaseConfigurado() {
  return typeof FIREBASE_EMBEBIDA === 'object' &&
         FIREBASE_EMBEBIDA && FIREBASE_EMBEBIDA.databaseURL;
}

function iniciarFirebase() {
  if (!firebaseConfigurado() || typeof firebase === 'undefined') {
    console.warn('Firebase no configurado: la aplicación trabaja solo en este dispositivo.');
    return false;
  }
  try {
    fbApp  = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_EMBEBIDA);
    fbDb   = firebase.database();
    fbAuth = firebase.auth();

    fbDb.ref('.info/connected').on('value', s => {
      ESTADO.conectado = !!s.val();
      pintarEstadoConexion();
    });
    return true;
  } catch (e) {
    console.error('Firebase no arrancó:', e);
    return false;
  }
}

/* Escucha las tres ramas y mantiene el estado al día en todos los
   dispositivos abiertos a la vez. */
function escucharDatos() {
  if (!fbDb) return;
  const ramas = ['pacientes', 'precargas', 'agenda', 'equipo', 'invitaciones', 'config'];
  for (const rama of ramas) {
    fbDb.ref('dolor/' + rama).on('value', snap => {
      const v = snap.val();
      if (v) ESTADO[rama] = v;
      else if (rama !== 'config') ESTADO[rama] = {};
      guardarLocal();
      if (ESTADO.listo) refrescarVentanaActiva();
    }, err => console.error('Lectura de ' + rama + ':', err));
  }
}

/* Guarda un nodo en Firebase y en local. Devuelve una promesa para poder
   avisar al usuario si falló, en vez de dar por hecho que salió bien. */
function guardar(rama, id, dato) {
  ESTADO[rama][id] = dato;
  guardarLocal();
  if (!fbDb) return Promise.resolve(false);
  return fbDb.ref('dolor/' + rama + '/' + id).set(dato)
    .then(() => true)
    .catch(e => {
      console.error('No se pudo sincronizar:', e);

      /* El mensaje anterior decia siempre "se reintentara al recuperar la
         conexion", y eso solo es cierto cuando el problema ES la conexion.
         Si el servidor rechazo la escritura por permisos, no se va a
         reintentar nunca: prometerlo hace que el medico siga trabajando
         tranquilo mientras nada se guarda. Son dos situaciones distintas y
         tienen dos salidas distintas. */
      const permisos = e && (e.code === 'PERMISSION_DENIED' ||
                             /permission/i.test(e.message || ''));
      if (permisos) {
        avisar('No se pudo guardar en el servidor. Es probable que tu sesión ' +
               'haya vencido: salí y volvé a entrar.', 'error', 12000);
      } else {
        avisar('Sin conexión. Se guardó en esta computadora y se va a subir ' +
               'solo cuando vuelva internet.', 'aviso');
      }
      return false;
    });
}

function borrar(rama, id) {
  delete ESTADO[rama][id];
  guardarLocal();
  if (!fbDb) return Promise.resolve(false);
  return fbDb.ref('dolor/' + rama + '/' + id).remove().then(() => true).catch(() => false);
}

/* --------------------------------------------------------------- avisos  */

const MAX_AVISOS = 3;

function avisar(texto, tipo, ms) {
  const cont = $('#avisos') || document.body;

  /* Si el mismo aviso ya esta en pantalla, no se duplica: se le renueva el
     tiempo. Cuando se corta internet en medio de una consulta, cada guardado
     dispara el mismo mensaje y sin esto la pantalla queda tapada por veinte
     copias de la misma frase. */
  const iguales = $$('.aviso', cont).filter(n => n.dataset.txt === texto);
  if (iguales.length) {
    const n = iguales[iguales.length - 1];
    clearTimeout(Number(n.dataset.reloj));
    n.dataset.reloj = programarSalida(n, tipo, ms);
    return;
  }

  /* Y nunca mas de tres a la vez: el mas viejo se va. */
  const vivos = $$('.aviso', cont);
  for (let i = 0; i <= vivos.length - MAX_AVISOS; i++) vivos[i].remove();

  const d = document.createElement('div');
  d.dataset.txt = texto;
  d.className = 'aviso aviso-' + (tipo || 'info');
  d.innerHTML = esc(texto);
  cont.appendChild(d);
  requestAnimationFrame(() => d.classList.add('entra'));
  d.dataset.reloj = programarSalida(d, tipo, ms);
}

function programarSalida(nodo, tipo, ms) {
  const vida = ms || (tipo === 'error' ? 9000 : 4500);
  return setTimeout(() => {
    nodo.classList.remove('entra');
    setTimeout(() => nodo.remove(), 400);
  }, vida);
}

function pintarEstadoConexion() {
  const n = $('#conexion');
  if (!n) return;
  n.className = 'conexion ' + (ESTADO.conectado ? 'ok' : 'sin');
  n.title = ESTADO.conectado
    ? 'Sincronizado: lo que escribís se guarda también en el servidor'
    : 'Sin internet. Lo que escribís se guarda en esta computadora y se sube solo ' +
      'cuando vuelva la conexión.';
}

/* --------------------------------------------------- busqueda y ordenes  */

function buscarPacientes(texto) {
  const q = normalizar(texto).trim();
  const todos = Object.values(ESTADO.pacientes);
  if (!q) return todos.sort(porApellido);
  const dni = dniLimpio(texto);
  return todos.filter(p =>
    normalizar(p.apellido + ' ' + p.nombre).includes(q) ||
    (dni && dniLimpio(p.dni).includes(dni)) ||
    normalizar(p.diagnostico && p.diagnostico.sindrome).includes(q)
  ).sort(porApellido);
}

const porApellido = (a, b) =>
  normalizar(a.apellido + a.nombre).localeCompare(normalizar(b.apellido + b.nombre));

function nombreCompleto(p) {
  if (!p) return '—';
  const n = [p.apellido, p.nombre].filter(Boolean).join(', ');
  return n || 'Sin nombre';
}

function iniciales(p) {
  const a = (p.apellido || '?')[0] || '?';
  const n = (p.nombre || '')[0] || '';
  return (a + n).toUpperCase();
}

/* Ultimo valor conocido de una escala. */
function ultimaEscala(p, idEscala) {
  const e = p.escalas && p.escalas[idEscala];
  return e && e.total != null ? e.total : null;
}

/* Ultimo NRS registrado: primero mira la evolucion mas reciente, y si no
   hay evoluciones, el de la historia inicial. */
function ultimoNRS(p) {
  const evos = (p.evoluciones || []).filter(e => e.nrs != null);
  if (evos.length) return evos[evos.length - 1].nrs;
  return p.dolor && p.dolor.nrsPromedio != null ? p.dolor.nrsPromedio : null;
}

function primerNRS(p) {
  if (p.dolor && p.dolor.nrsPromedio != null) return p.dolor.nrsPromedio;
  const evos = (p.evoluciones || []).filter(e => e.nrs != null);
  return evos.length ? evos[0].nrs : null;
}

/* =========================================================================
   BORRADO DIFERIDO
   -------------------------------------------------------------------------
   Borrar una historia clinica no puede ser una accion instantanea. Aca no se
   borra al confirmar: se PROGRAMA el borrado para dentro de diez minutos y
   durante todo ese tiempo la historia sigue entera y visible, con un reloj
   en cuenta regresiva y una superficie para arrepentirse.

   Diez minutos alcanzan para darse cuenta del error (que suele ser haber
   entrado al paciente equivocado) y son lo bastante cortos como para que
   nadie tenga que acordarse de volver a terminar el trabajo.

   La marca viaja en el propio registro, asi que si el borrado se programa
   en la computadora del consultorio y despues se abre la aplicacion en el
   celular, el celular ve el mismo reloj y puede cancelarlo. Y cualquiera de
   los dos dispositivos ejecuta el borrado cuando el plazo vence, aunque el
   que lo programo ya haya cerrado la aplicacion.
   ========================================================================= */

const MINUTOS_PARA_BORRAR = 10;

function programarBorrado(id) {
  const p = ESTADO.pacientes[id];
  if (!p) return;
  p.borradoProgramado = {
    desde: ahora(),
    ejecutaEn: new Date(Date.now() + MINUTOS_PARA_BORRAR * 60000).toISOString(),
    por: (ESTADO.usuario && ESTADO.usuario.email) || ''
  };
  p.modificado = ahora();
  guardar('pacientes', id, p);
}

function cancelarBorrado(id) {
  const p = ESTADO.pacientes[id];
  if (!p || !p.borradoProgramado) return;
  delete p.borradoProgramado;
  p.modificado = ahora();
  guardar('pacientes', id, p);
}

/* Segundos que faltan, o null si ese paciente no tiene borrado programado. */
function segundosParaBorrar(p) {
  if (!p || !p.borradoProgramado || !p.borradoProgramado.ejecutaEn) return null;
  const faltan = Math.round(
    (new Date(p.borradoProgramado.ejecutaEn).getTime() - Date.now()) / 1000);
  return faltan;
}

function relojBorrado(segundos) {
  const s = Math.max(0, segundos);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* Ejecuta los borrados vencidos. Se llama al arrancar y cada medio minuto:
   al arrancar, porque el plazo pudo vencer con la aplicacion cerrada. */
function revisarBorradosPendientes() {
  let borrados = 0;
  for (const [id, p] of Object.entries(ESTADO.pacientes)) {
    const faltan = segundosParaBorrar(p);
    if (faltan != null && faltan <= 0) {
      const quien = nombreCompleto(p);
      borrar('pacientes', id);
      borrados++;
      if (ESTADO.listo) avisar('Se borró la historia de ' + quien + '.', 'aviso');
    }
  }
  if (borrados && ESTADO.listo) refrescarVentanaActiva();
  return borrados;
}

let relojBorrados = null;
function vigilarBorrados() {
  if (relojBorrados) clearInterval(relojBorrados);
  revisarBorradosPendientes();
  relojBorrados = setInterval(revisarBorradosPendientes, 30000);
}

/* ------------------------------------------------------ copia de respaldo */

function exportarRespaldo() {
  const datos = {
    aplicacion:MARCA.nombre, version:1, exportado:ahora(),
    pacientes:ESTADO.pacientes, precargas:ESTADO.precargas,
    agenda:ESTADO.agenda, config:ESTADO.config
  };
  const blob = new Blob([JSON.stringify(datos, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  /* El nombre del archivo sigue a la marca: si manaña la app se llama de otra
     manera, los respaldos viejos y los nuevos no quedan con nombres distintos
     por una constante escrita a mano. */
  a.download = normalizar(MARCA.nombre).replace(/[^a-z0-9]+/g, '-') +
               '-respaldo-' + hoy() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  avisar('Copia de seguridad descargada.', 'ok');
}

function importarRespaldo(archivo) {
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const d = JSON.parse(lector.result);
      if (!d.pacientes) throw new Error('El archivo no tiene pacientes.');
      const cuantos = Object.keys(d.pacientes).length;
      if (!confirm('Se van a incorporar ' + cuantos + ' pacientes.\n\n' +
                   'Los que ya existan con el mismo identificador se van a SOBRESCRIBIR ' +
                   'con la versión del archivo.\n\n¿Continuar?')) return;
      Object.assign(ESTADO.pacientes, d.pacientes);
      Object.assign(ESTADO.precargas, d.precargas || {});
      Object.assign(ESTADO.agenda, d.agenda || {});
      guardarLocal();
      if (fbDb) {
        fbDb.ref('dolor/pacientes').update(d.pacientes);
        if (d.precargas) fbDb.ref('dolor/precargas').update(d.precargas);
      }
      avisar('Se incorporaron ' + cuantos + ' pacientes.', 'ok');
      refrescarVentanaActiva();
    } catch (e) {
      avisar('No se pudo leer el archivo: ' + e.message, 'error');
    }
  };
  lector.readAsText(archivo);
}

/* ================ motor.js ================ */
/* =========================================================================
   MOTOR CLINICO
   -------------------------------------------------------------------------
   Cuatro cosas hace este modulo, y ninguna de ellas es diagnosticar:

   1. FENOTIPO MECANISTICO — clasifica el dolor en nociceptivo, neuropatico,
      nociplastico o mixto, aplicando la gradacion NeuPSIG (posible /
      probable / definido) y los criterios de Kosek 2021 para nociplastico.
      Esta es la decision que mas cambia el tratamiento: un AINE no sirve en
      dolor neuropatico y un opioide empeora el nociplastico.

   2. DIFERENCIAL PONDERADO — recorre el catalogo de sindromes y devuelve los
      que concuerdan, ordenados por porcentaje, mostrando QUE dato sostiene
      cada uno. El medico ve el razonamiento, no solo la conclusion.

   3. BANDERAS ROJAS — dispara las alertas que no pueden esperar.

   4. CONTROL DE SEGURIDAD FARMACOLOGICA — revisa la medicacion cargada
      contra la funcion renal, la edad, las interacciones y la carga opioide
      total. Es la parte mas util en el dia a dia y la que menos se hace.

   Todo lo que sale de aca esta marcado como SUGERENCIA y es editable.
   ========================================================================= */
'use strict';

/* =========================================================================
   1. CONTEXTO — traduce la ficha del paciente a algo que las reglas puedan leer
   ========================================================================= */

/* Palabras que delatan un antecedente en el texto libre. El médico además
   marca las etiquetas a mano; esto es la red de contención para cuando no
   las marcó y lo escribió en la descripción. */
const PISTAS_ANTECEDENTES = {
  diabetes:        /diabet|dbt|insulina|metformina|glicada/i,
  cancer:          /c[aá]ncer|carcinoma|tumor|neoplasia|met[aá]stasis|linfoma|mieloma|oncol/i,
  quimioterapia:   /quimio|oxaliplatino|cisplatino|paclitaxel|docetaxel|vincristina|bortezomib/i,
  herpes:          /herpes|z[oó]ster|culebrilla/i,
  cirugia:         /cirug[ií]a|operad|operaci[oó]n|post ?quir[uú]rgic|intervenid/i,
  cirugia_columna: /(cirug[ií]a|operad|artrodesis|fusi[oó]n|discectom|laminectom).{0,25}(columna|lumbar|cervical|disco|hernia)/i,
  cirugia_torax:   /toracotom|esternotom|lobectom|neumonectom|cirug[ií]a de t[oó]rax/i,
  cirugia_mama:    /mastectom|cuadrantectom|cirug[ií]a de mama|tumorectom[ií]a mamaria/i,
  amputacion:      /amputa|mu[nñ][oó]n|pr[oó]tesis de miembro/i,
  trauma:          /trauma|accidente|golpe|ca[ií]da|fractura|choque/i,
  fractura:        /fractura/i,
  latigazo:        /latigazo|whiplash|colisi[oó]n|accidente de tr[aá]nsito/i,
  artritis:        /artritis reumatoide|ar\b|espondilo|psori[aá]sic|lupus/i,
  osteoporosis:    /osteoporosis|osteopenia/i,
  hipotiroidismo:  /hipotiroid|tiroides|levotiroxina|t4/i,
  depresion:       /depresi[oó]n|antidepresivo|sertralina|fluoxetina|escitalopram|paroxetina/i,
  fibromialgia:    /fibromialgia/i,
  acv:             /acv|acc?idente cerebrovascular|stroke|isquemia cerebral|hemiplej/i,
  lesion_medular:  /lesi[oó]n medular|parapl[eé]jic|tetrapl[eé]jic|secci[oó]n medular/i,
  esclerosis:      /esclerosis m[uú]ltiple|\bEM\b/,   // sin la /i: "em" suelto en
                   // minusculas aparece dentro de demasiadas palabras
  obesidad:        /obesidad|sobrepeso|imc [3-9]\d/i,
  embarazo:        /embaraz|gestaci[oó]n|post ?parto|pu[eé]rper/i,
  inmovilizacion:  /yeso|f[eé]rula|inmoviliz|cabestrillo/i,
  /* Ojo con las siglas cortas: "irc" sin limites de palabra vive dentro de
     "circuito" y disparaba una alerta de insuficiencia renal en un paciente
     con la funcion renal normal. Va con \b y en mayusculas. */
  renal:           /insuficiencia renal|di[aá]lisis|nefropat[ií]a|filtrado glomerular/i,
  renalSigla:      /\bIRC\b/,
  hepatica:        /cirrosis|hepatopat|hepatitis|insuficiencia hep[aá]tica/i,
  cardiopatia:     /infarto|iam|coronari|insuficiencia card[ií]aca|arritmia|fibrilaci[oó]n/i,
  epilepsia:       /epilepsia|convulsi[oó]n|convulsiv/i,
  glaucoma:        /glaucoma/i,
  prostatismo:     /pr[oó]stata|prostatism|hbp|hiperplasia prost/i,
  anticoagulado:   /anticoagul|warfarina|acenocumarol|rivaroxab|apixab|dabigatr|clopidogrel|aspirina|heparina/i
};

function construirContexto(p) {
  const d  = p.dolor || {};
  const an = p.antecedentes || {};
  const lectura = leerMapa(d.mapa || []);
  const raiz = raizDominante(lectura);

  /* Regiones: del identificador de zona se saca la clave simple.
     'f_muslo_der' pasa a 'muslo'. */
  const regiones = new Set();
  for (const z of lectura.zonas) {
    const clave = z.z.id.replace(/^[fd]_/, '')
                        .replace(/_(izq|der|izquierd[ao]|derech[ao])$/, '');
    regiones.add(clave);
  }

  /* Antecedentes: etiquetas marcadas a mano + lo que se detecta en el texto. */
  const textoAnte = [an.enfermedades, an.cirugias, an.familiares, an.habitos,
                     an.medicacionNoDolor, d.mecanismo, d.descripcion, p.notas].join(' ');
  const ante = new Set(an.etiquetas || []);
  for (const [clave, re] of Object.entries(PISTAS_ANTECEDENTES)) {
    /* Algunas claves son variantes de escritura de lo mismo (la sigla y el
       nombre completo). Se normalizan al mismo antecedente. */
    if (re.test(textoAnte)) ante.add(clave.replace(/Sigla$/, ''));
  }

  const escalaTotal = id => {
    const e = p.escalas && p.escalas[id];
    return e && e.total != null ? e.total : null;
  };

  const irradiacion = String(d.irradiacion || '');
  /* "Hasta el glúteo, no pasa la rodilla" decia que el dolor irradiaba a la
     rodilla, que es exactamente lo contrario de lo que escribio el medico.
     Antes de buscar las palabras hay que sacar las frases negadas. */
  const irradiaPierna = /pierna|pantorrilla|pie|rodilla|gemelo|talon|tal[oó]n|dedos del pie/i
                          .test(sinNegaciones(irradiacion)) ||
                        regiones.has('pierna') || regiones.has('pantorrilla') ||
                        regiones.has('pantorrilla_izq') || regiones.has('pie');

  return {
    /* del mapa corporal */
    regiones, zonas:lectura.zonas, dist:lectura.distribucion, wpi:lectura.wpi,
    areas:lectura.areas.length, bilateral:lectura.bilateral, raiz,
    intensidadMapa:lectura.intensidadMax,

    /* de la historia del dolor */
    desc: new Set(d.descriptores || []),
    meses: d.meses != null ? Number(d.meses) : mesesDesde(d.inicio),
    nrsPromedio: d.nrsPromedio,
    nrsAhora: d.nrsAhora,
    patron: d.patron || '',
    peorMomento: d.peorMomento || '',
    alivia: d.alivia || '',
    empeora: d.empeora || '',
    irradiacion, irradiaPierna,

    /* del paciente */
    edad: edadDe(p.fechaNac) || 0,
    sexo: p.sexo || '',
    ante,

    /* de las escalas */
    dn4: escalaTotal('dn4'),
    csi: escalaTotal('csi'),
    pcs: escalaTotal('pcs'),
    pseq: escalaTotal('pseq'),
    phq9: escalaTotal('phq9'),
    sss: escalaTotal('acr2016'),
    bpi: escalaTotal('bpi'),

    /* del examen */
    signos: new Set((p.examen && p.examen.signos) || []),
    deficitNeuro: ((p.examen && p.examen.signos) || [])
                    .some(s => ['debilidad','rot_disminuido','hipoestesia'].includes(s)),

    /* varios */
    banderas: new Set(an.banderas || []),
    tratamientosFallidos: ((p.tratamientosPrevios || [])
      .filter(t => /igual|empeor|sin cambio|no sirvi|nada/i.test(t.resultado || '')).length),
    textoLibre: [d.descripcion, d.mecanismo, p.notas, textoAnte].join(' ')
  };
}

/* Saca del texto los tramos que estan negados, para que buscar una palabra
   dentro de "no baja de la rodilla" no cuente como que si baja. Corta en la
   negacion y sigue hasta la proxima coma o punto, que es donde en castellano
   termina el alcance de un "no" o un "sin". */
function sinNegaciones(texto) {
  return String(texto || '')
    .replace(/\b(no|sin|nunca|jam[aá]s|tampoco)\b[^,.;]*/gi, ' ');
}

function mesesDesde(iso) {
  if (!iso) return null;
  const d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return null;
  return Math.max(0, Math.round((Date.now() - d.getTime()) / (30.44 * 86400000)));
}

/* =========================================================================
   2. FENOTIPO MECANISTICO
   ========================================================================= */

function fenotipar(c) {
  const r = {
    neuropatico:  {puntos:0, grado:'no', porque:[]},
    nociplastico: {puntos:0, grado:'no', porque:[]},
    nociceptivo:  {puntos:0, porque:[]},
    predominante: 'indeterminado',
    mixto: false,
    texto: ''
  };

  /* ---------------- NEUROPATICO: gradación NeuPSIG ---------------------
     Tres escalones. Cada uno exige el anterior. El paso de POSIBLE a
     PROBABLE es el que hace la diferencia clínica y depende del examen
     físico: sin examinar la sensibilidad, no se puede subir de escalón. */
  const n = r.neuropatico;

  const antecedenteLesion = ['diabetes','herpes','cirugia','trauma','amputacion','quimioterapia',
                             'acv','lesion_medular','esclerosis','cirugia_columna']
                            .some(a => c.ante.has(a));
  const distribucionPlausible = !!(c.raiz && c.raiz.proporcion >= 35) ||
                                (c.dist !== 'generalizada' && c.zonas.length > 0 && !c.bilateral);

  if (c.dn4 >= 4) { n.puntos += 3; n.porque.push('DN4 ' + c.dn4 + '/10, por encima del umbral de 4'); }
  if (distribucionPlausible) {
    n.puntos += 2;
    n.porque.push(c.raiz
      ? 'Distribución concentrada en territorio de ' + c.raiz.raiz + ' (' + c.raiz.proporcion + '% de las marcas)'
      : 'Distribución neuroanatómicamente plausible');
  }
  if (antecedenteLesion) { n.puntos += 2; n.porque.push('Antecedente de lesión o enfermedad del sistema somatosensorial'); }
  if (['quemante','electrico','hormigueo'].some(x => c.desc.has(x))) {
    n.puntos += 2; n.porque.push('Descriptores característicos: quemazón, descargas eléctricas u hormigueo');
  }

  const signosSensitivos = c.signos.has('hipoestesia') || c.signos.has('alodinia') ||
                           c.signos.has('hiperalgesia') || c.signos.has('hipoalgesia');
  const pruebaObjetiva   = c.signos.has('emg_confirmatorio') || c.signos.has('imagen_confirmatoria');

  if (distribucionPlausible && antecedenteLesion) {
    n.grado = 'posible';
    if (signosSensitivos) {
      n.grado = 'probable';
      n.porque.push('Signos sensitivos objetivados en el territorio del dolor');
      if (pruebaObjetiva) {
        n.grado = 'definido';
        n.porque.push('Lesión del sistema somatosensorial documentada por estudio complementario');
      }
    }
  } else if (c.dn4 >= 4) {
    n.grado = 'sospechado por tamizaje';
    n.porque.push('El DN4 es una herramienta de tamizaje: orienta, no gradúa. Para llegar a ' +
                  '"probable" hace falta el examen sensitivo del territorio');
  }

  /* ---------------- NOCIPLASTICO: criterios de Kosek 2021 -------------- */
  const np = r.nociplastico;
  const regionalOMas = ['regional','multifocal','generalizada'].includes(c.dist);
  const cronico = c.meses >= 3;
  const hipersensibilidad = c.signos.has('alodinia') || c.signos.has('hiperalgesia') ||
                            c.signos.has('hipersensibilidad_estimulos') || c.csi >= 40;
  const comorbilidades = (c.csi >= 40 ? 1 : 0) +
                         (c.phq9 >= 10 ? 1 : 0) +
                         (c.signos.has('sueño_no_reparador') ? 1 : 0) +
                         (c.signos.has('fatiga') ? 1 : 0) +
                         (c.signos.has('sintomas_cognitivos') ? 1 : 0);

  if (regionalOMas && cronico) {
    np.puntos += 2;
    np.porque.push('Dolor ' + c.dist + ' de más de 3 meses, no discreto');
    np.grado = 'posible';
    if (hipersensibilidad) {
      np.puntos += 3;
      np.porque.push('Hipersensibilidad evocada en la región dolorosa' + (c.csi >= 40 ? ', con CSI ' + c.csi + '/100' : ''));
      if (comorbilidades >= 1) {
        np.grado = 'probable';
        np.puntos += 2;
        np.porque.push('Comorbilidades acompañantes: ' + comorbilidades + ' de las que definen el cuadro ' +
                       '(sueño, fatiga, síntomas cognitivos, ánimo, hipersensibilidad a estímulos)');
      }
    }
  }
  if (c.dist === 'generalizada') { np.puntos += 3; np.porque.push('Dolor generalizado en ' + c.areas + ' de 5 áreas corporales (WPI ' + c.wpi + '/19)'); }

  /* ---------------- NOCICEPTIVO --------------------------------------- */
  const noc = r.nociceptivo;
  if (c.dn4 != null && c.dn4 < 4) { noc.puntos += 2; noc.porque.push('DN4 ' + c.dn4 + '/10, por debajo del umbral neuropático'); }
  if (['sordo','opresivo','rigidez','punzante','pulsatil'].some(x => c.desc.has(x))) {
    noc.puntos += 2; noc.porque.push('Descriptores de dolor somático: sordo, opresivo, rigidez o punzante');
  }
  if (/movimi|esfuerz|activid|camin|carga|peso|agach|levantar/i.test(c.empeora || '')) {
    noc.puntos += 2; noc.porque.push('Ritmo mecánico: empeora con la actividad');
  }
  if (/repos|acost|sentar|quiet|dormir/i.test(c.alivia || '')) {
    noc.puntos += 1; noc.porque.push('Alivia con el reposo');
  }
  if (c.dist === 'localizada') { noc.puntos += 2; noc.porque.push('Dolor localizado y proporcional'); }
  if (!c.signos.has('alodinia') && !c.signos.has('hipoestesia')) { noc.puntos += 1; noc.porque.push('Sin alteraciones sensitivas al examen'); }

  /* ---------------- quién manda ---------------------------------------- */
  const orden = [
    {k:'neuropatico',  v:n.puntos},
    {k:'nociplastico', v:np.puntos},
    {k:'nociceptivo',  v:noc.puntos}
  ].sort((a, b) => b.v - a.v);

  if (orden[0].v === 0) {
    r.predominante = 'indeterminado';
    r.texto = 'Los datos cargados no alcanzan para orientar el mecanismo. Completar el mapa ' +
              'corporal, los descriptores del dolor y el DN4 cambia sustancialmente este resultado.';
    return r;
  }

  r.predominante = orden[0].k;
  /* Se considera mixto cuando el segundo mecanismo llega al 60% del primero:
     por debajo de eso, señalar dos mecanismos confunde más que ayuda. */
  r.mixto = orden[1].v > 0 && orden[1].v >= orden[0].v * 0.6;
  r.segundo = r.mixto ? orden[1].k : null;

  const nombre = {neuropatico:'neuropático', nociplastico:'nociplástico', nociceptivo:'nociceptivo'};
  r.texto = r.mixto
    ? 'Dolor MIXTO, con componente ' + nombre[orden[0].k] + ' y ' + nombre[orden[1].k] + '.'
    : 'Dolor predominantemente ' + nombre[orden[0].k] + '.';
  if (r.predominante === 'neuropatico' && n.grado !== 'no') {
    r.texto += ' Gradación NeuPSIG: neuropático ' + n.grado.toUpperCase() + '.';
  }
  if (r.predominante === 'nociplastico' && np.grado !== 'no') {
    r.texto += ' Criterios de Kosek: nociplástico ' + np.grado.toUpperCase() + '.';
  }
  return r;
}

/* =========================================================================
   3. DIFERENCIAL PONDERADO
   ========================================================================= */

function evaluarSindromes(c, cuantos) {
  const salida = [];

  for (const s of SINDROMES) {
    /* Criterios de exclusión: si alguno se cumple, el síndrome no compite. */
    if ((s.excluye || []).some(e => seguro(e.f, c))) continue;

    /* Compuerta topográfica. Muchos síndromes tienen una localización sin la
       cual el diagnóstico es imposible: una neuralgia occipital que no duele
       en el occipucio no es una neuralgia occipital, por más que el dolor sea
       eléctrico, unilateral y con DN4 alto. Sin esto, esos cuadros se cuelan
       arriba del diferencial sumando puntos por todo lo que NO es topografía.

       Solo se aplica cuando el mapa corporal tiene marcas: si el paciente
       todavía no lo completó, descartar por topografía sería descartar por
       falta de datos, y eso deja al médico sin diferencial ninguno. */
    if (c.regiones.size && s.topografia && !seguro(s.topografia.f, c)) continue;

    let obtenido = 0, posible = 0;
    const aFavor = [], enContra = [];
    for (const regla of s.reglas) {
      posible += regla.p;
      if (seguro(regla.f, c)) { obtenido += regla.p; aFavor.push(regla.t); }
      else if (regla.p >= 4)  { enContra.push(regla.t); }
    }
    if (!posible) continue;
    const pct = Math.round((obtenido / posible) * 100);
    /* Por debajo del 30% no es un diferencial, es ruido. */
    if (pct < 30) continue;

    salida.push({
      sindrome:s, concordancia:pct, aFavor, enContra,
      puntos:obtenido, maximo:posible,
      /* Un síndrome que concuerda pero cuyo mecanismo no coincide con el
         fenotipo merece una marca: suele ser el que hay que mirar dos veces. */
      color: pct >= 70 ? 'alto' : pct >= 50 ? 'medio' : 'bajo'
    });
  }

  salida.sort((a, b) => b.concordancia - a.concordancia);
  return salida.slice(0, cuantos || 6);
}

/* Una regla mal escrita no puede tumbar la consulta entera. */
function seguro(f, c) {
  try { return !!f(c); } catch (e) { return false; }
}

/* =========================================================================
   4. BANDERAS ROJAS
   ========================================================================= */

const BANDERAS = [
  {id:'esfinteres', txt:'Cambios en el control de orina o materia fecal',

   nivel:'urgente', accion:'Compresión medular o radicular en progresión. Imagen urgente. ' +
   'En paciente oncológico, iniciar dexametasona sin esperar el estudio.'},
  {id:'cancer', txt:'Antecedente personal de cáncer',

  {id:'dolor_nocturno', txt:'Dolor que lo despierta de noche y no mejora con el reposo',

  {id:'trauma', txt:'Traumatismo significativo reciente',
   nivel:'medio', accion:'Descartar fractura. En el paciente osteoporótico o corticoideo, ' +

  {id:'corticoides', txt:'Uso prolongado de corticoides o inmunosupresión',
   nivel:'medio', accion:'Riesgo de fractura vertebral por compresión y de infección espinal.'},
  {id:'edad_extrema', txt:'Primer episodio antes de los 20 o después de los 50 años',
