   nivel:'medio', accion:'Patrón inflamatorio. En menor de 45 años, derivar a reumatología ' +
   'por sospecha de espondiloartritis axial.'},
  {id:'ideacion', txt:'Ideación de muerte o autolesión',
   nivel:'urgente', accion:'Evaluar riesgo suicida HOY y no diferir. El dolor crónico multiplica ' +
   'ese riesgo y el ítem 9 del PHQ-9 es el que lo detecta.'}
];

function revisarBanderas(p, c) {
  const marcadas = new Set((p.antecedentes && p.antecedentes.banderas) || []);
  const encontradas = [];

  for (const b of BANDERAS) if (marcadas.has(b.id)) encontradas.push(b);

  /* Algunas se deducen solas de otros datos: son las que se pasan por alto. */
  if (c.ante.has('cancer') && !marcadas.has('cancer')) {
    encontradas.push({...BANDERAS.find(b => b.id === 'cancer'),
      deducida:'Detectado en los antecedentes cargados'});
  }
  if (c.edad >= 50 && c.meses != null && c.meses <= 3 && !marcadas.has('edad_extrema')) {
    encontradas.push({...BANDERAS.find(b => b.id === 'edad_extrema'),
      deducida:'Primer episodio a los ' + c.edad + ' años'});
  }
  const phq = p.escalas && p.escalas.phq9;
  if (phq && phq.items && phq.items[8] > 0) {
    encontradas.push({...BANDERAS.find(b => b.id === 'ideacion'),
      deducida:'Ítem 9 del PHQ-9 con respuesta positiva'});
  }
  if (c.deficitNeuro && !marcadas.has('deficit_progresivo')) {
    encontradas.push({id:'deficit_examen', txt:'Déficit neurológico en el examen físico',
      nivel:'medio', deducida:'Signos cargados en el examen',
      accion:'Documentar el déficit, su territorio y su evolución. Si progresa, pasa a ser urgente.'});
  }

  const orden = {urgente:0, alto:1, medio:2};
  encontradas.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return encontradas;
}

/* =========================================================================
   5. CONTROL DE SEGURIDAD FARMACOLOGICA
   -------------------------------------------------------------------------
   Revisa la medicacion cargada. Es lo que en la practica evita la mayoria
   de los problemas evitables.
   ========================================================================= */

function revisarSeguridad(p, c) {
  const avisos = [];
  const meds = (p.medicacion || []).filter(m => m && m.farmaco);
  const tiene = id => meds.some(m => m.farmaco === id);
  const nombre = id => (FARMACOS[id] && FARMACOS[id].nombre) || id;

  const renalGrave = c.ante.has('renal') || (p.antecedentes && p.antecedentes.filtrado &&
                     Number(p.antecedentes.filtrado) < 30);
  const renalMod   = p.antecedentes && p.antecedentes.filtrado &&
                     Number(p.antecedentes.filtrado) >= 30 && Number(p.antecedentes.filtrado) < 60;
  const mayor      = c.edad >= 65;

  /* --- carga opioide total ------------------------------------------- */
  const opioides = meds.filter(m => FARMACOS[m.farmaco] && FARMACOS[m.farmaco].grupo === 'Opioide')
    .map(m => ({id:m.farmaco, mgDia:mgDiariosDe(m), mcgHora:mcgHoraDe(m)}));
  const mme = calcularMME(opioides);
  if (mme.total > 0) {
    avisos.push({
      nivel: mme.color === 'rojo' ? 'alto' : mme.color === 'ambar' ? 'medio' : 'info',
      titulo:'Carga opioide: ' + mme.total + ' MME/día — ' + mme.nivel,
      texto: mme.aviso || 'Registrado para seguimiento.',
      nota: mme.nota
    });
  }

  /* --- combinaciones peligrosas -------------------------------------- */
  const serotoninergicos = ['tramadol','duloxetina','venlafaxina','amitriptilina','nortriptilina',
                            'tapentadol','ciclobenzaprina'].filter(tiene);
  if (serotoninergicos.length >= 2) {
    /* La combinacion de un dual con un triciclico es de uso corriente en dolor
       y su riesgo es modesto. La que de verdad importa es la que incluye
       tramadol o tapentadol: esa es la que se pasa por alto y la que manda
       gente a la guardia. Marcar las dos igual seria enseñar a ignorar la alerta. */
    const conOpioide = serotoninergicos.some(x => ['tramadol','tapentadol'].includes(x));
    avisos.push({nivel:conOpioide ? 'alto' : 'medio', titulo:'Riesgo de síndrome serotoninérgico',
      texto:'Están cargados a la vez: ' + serotoninergicos.map(nombre).join(', ') + '. ' +
            'La combinación de tramadol con un dual o un tricíclico es la más frecuente en dolor y ' +
            'la que más se pasa por alto. Vigilar agitación, temblor, clonus, hipertermia y sudoración; ' +
            'instruir al paciente sobre qué consultar.'});
  }

  const benzo = /clonazepam|alprazolam|diazepam|lorazepam|bromazepam|zolpidem/i;
  const tomaBenzo = (p.antecedentes && benzo.test(p.antecedentes.medicacionNoDolor || '')) ||
                    meds.some(m => benzo.test(m.farmaco + ' ' + (m.nombreLibre || '')));
  if (mme.total > 0 && tomaBenzo) {
    avisos.push({nivel:'alto', titulo:'Opioide junto con benzodiacepina',
      texto:'Es la combinación con mayor riesgo de depresión respiratoria y muerte por sobredosis. ' +
            'Si no se puede evitar, usar la dosis más baja de ambos, indicar naloxona domiciliaria e ' +
            'instruir a la familia. Planificar el descenso de la benzodiacepina.'});
  }

  if (tiene('pregabalina') && mme.total > 0) {
    avisos.push({nivel:'medio', titulo:'Gabapentinoide junto con opioide',
      texto:'La combinación aumenta el riesgo de sedación y depresión respiratoria. Revisar la ' +
            'necesidad de ambos y vigilar la somnolencia, sobre todo al iniciar o subir dosis.'});
  }

  /* --- función renal -------------------------------------------------- */
  if (renalGrave) {
    if (tiene('aine')) avisos.push({nivel:'alto', titulo:'AINE con función renal comprometida',
      texto:'Los AINE están contraindicados con filtrado menor a 30 ml/min. Suspender y buscar ' +
            'alternativa: paracetamol, dipirona o un tópico.'});
    if (tiene('pregabalina') || tiene('gabapentina'))
      avisos.push({nivel:'alto', titulo:'Gabapentinoide sin ajuste renal',
        texto:'La pregabalina y la gabapentina se eliminan íntegras por riñón. Con filtrado menor a 30 ' +
              'hay que reducir a un cuarto de la dosis habitual. No ajustarlo es la causa más común de ' +
              'somnolencia, ataxia y caídas.'});
    if (tiene('morfina')) avisos.push({nivel:'alto', titulo:'Morfina con insuficiencia renal',
      texto:'El metabolito morfina-6-glucurónido se acumula y produce sedación, mioclonías y depresión ' +
            'respiratoria tardía. Preferir metadona, fentanilo o buprenorfina, que no dependen del riñón.'});
    if (tiene('duloxetina')) avisos.push({nivel:'alto', titulo:'Duloxetina contraindicada',
      texto:'Contraindicada con filtrado menor a 30 ml/min. Rotar a un tricíclico, que no requiere ajuste renal.'});
  } else if (renalMod) {
    if (tiene('pregabalina') || tiene('gabapentina'))
      avisos.push({nivel:'medio', titulo:'Ajustar el gabapentinoide por función renal',
        texto:'Con filtrado entre 30 y 60 ml/min corresponde la mitad de la dosis habitual.'});
  }

  /* --- edad ----------------------------------------------------------- */
  if (mayor) {
    if (tiene('amitriptilina')) avisos.push({nivel:'medio', titulo:'Tricíclico en mayor de 65 años',
      texto:'La amitriptilina figura en los criterios de Beers como potencialmente inapropiada en el ' +
            'adulto mayor por sus efectos anticolinérgicos y el riesgo de caídas. La nortriptilina da ' +
            'el mismo beneficio analgésico con bastante mejor tolerancia.'});
    if (tiene('ciclobenzaprina')) avisos.push({nivel:'medio', titulo:'Relajante muscular en mayor de 65 años',
      texto:'Los relajantes de acción central están desaconsejados en el adulto mayor: sedación, ' +
            'confusión y caídas superan al beneficio.'});
    if (tiene('aine')) avisos.push({nivel:'medio', titulo:'AINE en mayor de 65 años',
      texto:'Riesgo digestivo, renal y cardiovascular aumentado. Si se sostiene, indicar inhibidor de ' +
            'bomba de protones y controlar función renal y presión arterial.'});
  }

  /* --- comorbilidades específicas ------------------------------------- */
  if (c.ante.has('cardiopatia') && (tiene('amitriptilina') || tiene('nortriptilina')))
    avisos.push({nivel:'alto', titulo:'Tricíclico con cardiopatía',
      texto:'Contraindicado tras infarto reciente y en arritmias. Pedir ECG basal y evaluar el QTc antes de sostenerlo.'});
  if (tiene('metadona'))
    avisos.push({nivel:'medio', titulo:'Metadona: control de QT',
      texto:'Requiere ECG basal, a los 30 días y con cada aumento. Con QTc mayor a 500 ms, suspender. ' +
            'Su vida media es larga y errática: la toxicidad aparece días después de subir la dosis.'});
  if (tiene('carbamazepina') || tiene('oxcarbazepina'))
    avisos.push({nivel:'medio', titulo:'Control de natremia',
      texto:'Ambas producen hiponatremia, más frecuente en el adulto mayor y con diuréticos. ' +
            'Natremia basal, al mes y luego periódica. La carbamazepina además exige hemograma y hepatograma.'});
  if (c.ante.has('epilepsia') && tiene('tramadol'))
    avisos.push({nivel:'alto', titulo:'Tramadol con antecedente convulsivo',
      texto:'El tramadol baja el umbral convulsivo y está contraindicado en epilepsia no controlada.'});
  if (c.ante.has('glaucoma') && (tiene('amitriptilina') || tiene('nortriptilina')))
    avisos.push({nivel:'alto', titulo:'Tricíclico con glaucoma',
      texto:'Contraindicado en glaucoma de ángulo cerrado.'});
  if (c.ante.has('prostatismo') && (tiene('amitriptilina') || tiene('nortriptilina')))
    avisos.push({nivel:'medio', titulo:'Tricíclico con prostatismo',
      texto:'Riesgo de retención urinaria aguda. Advertirlo al paciente.'});
  if (c.ante.has('hepatica') && (tiene('paracetamol') || tiene('duloxetina')))
    avisos.push({nivel:'medio', titulo:'Hepatopatía',
      texto:'Paracetamol: máximo 2 g/día. Duloxetina: contraindicada en hepatopatía.'});

  /* --- lo que falta --------------------------------------------------- */
  if (mme.total > 0 && !/laxante|bisacodilo|lactulosa|polietilenglicol|senosidos|picosulfato/i
        .test(JSON.stringify(p.medicacion) + (p.antecedentes && p.antecedentes.medicacionNoDolor || ''))) {
    avisos.push({nivel:'medio', titulo:'Falta profilaxis de constipación',
      texto:'Hay un opioide indicado y ningún laxante. La constipación por opioides es universal y NO ' +
            'desarrolla tolerancia: se previene desde el primer día con un estimulante más un osmótico. ' +
            'Es la causa más frecuente de abandono del tratamiento.'});
  }
  if (mme.total >= 50 && !/naloxona/i.test(JSON.stringify(p.medicacion))) {
    avisos.push({nivel:'medio', titulo:'Considerar naloxona domiciliaria',
      texto:'Con 50 MME/día o más, corresponde ofrecer naloxona e instruir a un conviviente en su uso.'});
  }
  if (mme.total > 0 && !p.escalas?.ort) {
    avisos.push({nivel:'info', titulo:'Falta evaluar el riesgo de uso problemático',
      texto:'Hay opioide indicado y el Opioid Risk Tool no está completado. Conviene hacerlo antes de sostener el tratamiento.'});
  }

  /* --- fibromialgia y opioides ---------------------------------------- */
  if (c.ante.has('fibromialgia') && mme.total > 0) {
    avisos.push({nivel:'alto', titulo:'Opioide en fibromialgia',
      texto:'Los opioides están desaconsejados en fibromialgia por todas las guías. No mejoran el ' +
            'cuadro, pueden producir hiperalgesia y empeoran la evolución a largo plazo. Planificar el descenso.'});
  }

  const orden = {alto:0, medio:1, info:2};
  avisos.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
  return {avisos, mme};
}

/* Interpreta "75mg" o "75 mg cada 12hs" y devuelve los miligramos por día. */
function mgDiariosDe(m) {
  if (m.mgDia != null) return Number(m.mgDia) || 0;
  const dosis = String(m.dosis || '');
  const mg = parseFloat((dosis.match(/([\d.,]+)\s*mg/i) || [])[1] || '0'.replace(',', '.'));
  if (!mg) return 0;
  const frec = String(m.frecuencia || '');
  let veces = 1;
  const cada = (frec.match(/cada\s*(\d+)/i) || [])[1];
  if (cada) veces = 24 / Number(cada);
  else if (/8\s*h|tres veces|3 veces/i.test(frec)) veces = 3;
  else if (/12\s*h|dos veces|2 veces/i.test(frec)) veces = 2;
  else if (/6\s*h|cuatro veces/i.test(frec)) veces = 4;
  return mg * veces;
}

function mcgHoraDe(m) {
  const t = String(m.dosis || '');
  return parseFloat((t.match(/([\d.,]+)\s*mcg/i) || [])[1] || 0);
}

/* =========================================================================
   6. SUGERENCIA DE PLAN
   -------------------------------------------------------------------------
   Toma el sindrome elegido y filtra su esquema de tratamiento contra las
   contraindicaciones REALES de este paciente. Un plan que recomienda AINE a
   un paciente en dialisis no es una ayuda, es un riesgo.
   ========================================================================= */

function sugerirPlan(sindromeId, p, c) {
  const s = SINDROMES.find(x => x.id === sindromeId);
  if (!s) return null;

  const renalGrave = c.ante.has('renal') ||
    (p.antecedentes && Number(p.antecedentes.filtrado) > 0 && Number(p.antecedentes.filtrado) < 30);
  const hepatica = c.ante.has('hepatica');
  const mayor = c.edad >= 65;
  const embarazo = c.ante.has('embarazo');
  const alergias = normalizar((p.antecedentes && p.antecedentes.alergias) || '');

  function revisar(item) {
    const f = FARMACOS[item.farmaco];
    if (!f) return {...item, nombre:item.farmaco, reparos:[]};
    const reparos = [];

    if (renalGrave) {
      if (/contraindicad/i.test(f.ajusteRenal || '')) reparos.push('CONTRAINDICADO con este filtrado renal');
      else if (/imprescindible|reducir|ajustar/i.test(f.ajusteRenal || '')) reparos.push('Requiere ajuste renal: ' + f.ajusteRenal);
    }
    if (hepatica && /contraindicad|evitar/i.test(f.ajusteHepatico || ''))
      reparos.push('Evitar por hepatopatía');
    if (mayor && item.farmaco === 'amitriptilina')
      reparos.push('En mayor de 65 años, preferir nortriptilina');
    if (mayor && ['aine','ciclobenzaprina'].includes(item.farmaco))
      reparos.push('Desaconsejado en el adulto mayor');
    if (embarazo && ['aine','pregabalina','gabapentina','carbamazepina','duloxetina'].includes(item.farmaco))
      reparos.push('Revisar seguridad en el embarazo antes de indicarlo');
    if (alergias && normalizar(f.nombre).split(/[\s(]/).some(w => w.length > 4 && alergias.includes(w)))
      reparos.push('POSIBLE ALERGIA declarada: verificar');
    for (const cc of (f.contraindicaciones || [])) {
      const n = normalizar(cc);
      if ((c.ante.has('epilepsia')   && /epilep|convuls/.test(n)) ||
          (c.ante.has('cardiopatia') && /infarto|arritmia|cardiac/.test(n)) ||
          (c.ante.has('glaucoma')    && /glaucoma/.test(n)) ||
          (c.ante.has('prostatismo') && /prostat/.test(n)))
        reparos.push('Contraindicación relativa: ' + cc);
    }
    return {...item, nombre:f.nombre, inicio:f.inicio, titulacion:f.titulacion,
            maxima:f.maxima, latencia:f.latencia, reparos};
  }

  const t = s.tratamiento || {};
  return {
    sindrome: s,
    objetivo: t.objetivo || '',
    noFarmacologico: t.noFarmacologico || [],
    primeraLinea: (t.primeraLinea || []).map(revisar),
    segundaLinea: (t.segundaLinea || []).map(revisar),
    tercera: (t.tercera || []).map(revisar),
    evitar: t.evitar || [],
    estudios: s.estudios || [],
    procedimientos: (s.procedimientos || []).map(id => ({id, ...(PROCEDIMIENTOS[id] || {})}))
                                            .filter(x => x.nombre),
    controles: s.controles || {},
    irruptivo: s.irruptivo || '',
    criterios: s.criterios || '',
    referencias: s.referencias || []
  };
}

/* =========================================================================
   7. LECTURA COMPLETA — lo que la aplicacion "opina" de un paciente
   ========================================================================= */

function analizar(p) {
  const c = construirContexto(p);
  return {
    contexto: c,
    fenotipo: fenotipar(c),
    diferencial: evaluarSindromes(c),
    banderas: revisarBanderas(p, c),
    seguridad: revisarSeguridad(p, c),
    completitud: medirCompletitud(p, c)
  };
}

/* Que falta para que el analisis valga algo. Se muestra al medico para que
   sepa cuanto pesa lo que la aplicacion le esta diciendo. */
function medirCompletitud(p, c) {
  const faltan = [];
  if (!(p.dolor && (p.dolor.mapa || []).length)) faltan.push('el mapa corporal');
  if (!(p.dolor && p.dolor.descriptores || []).length) faltan.push('los descriptores del dolor');
  if (p.dolor && p.dolor.nrsPromedio == null) faltan.push('la intensidad promedio');
  if (c.dn4 == null) faltan.push('el DN4');
  if (!c.meses && c.meses !== 0) faltan.push('la fecha de inicio del dolor');
  if (!(p.examen && (p.examen.signos || []).length)) faltan.push('el examen físico');
  const total = 6;
  return {
    faltan,
    porcentaje: Math.round(((total - faltan.length) / total) * 100),
    suficiente: faltan.length <= 2
  };
}

/* ================ efectividad.js ================ */
/* =========================================================================
   EFECTIVIDAD DEL TRATAMIENTO
   -------------------------------------------------------------------------
   El indicador de color y porcentaje que acompaña a cada paciente y a cada
   tratamiento.

   POR QUE NO ES SOLO EL DOLOR
   Medir el exito de un tratamiento de dolor cronico unicamente por la baja
   de la escala numerica es el error clasico, y produce dos distorsiones
   opuestas: pacientes que bajaron dos puntos y volvieron a trabajar figuran
   como fracaso, y pacientes sedados con opioides que declaran menos dolor
   pero no salen de la cama figuran como exito.

   Por eso la efectividad se compone de cuatro cosas, con el peso que las
   recomendaciones IMMPACT le dan a cada dominio nucleo:

     40%  ALIVIO DEL DOLOR      caida porcentual del NRS respecto del basal
     30%  FUNCION               interferencia (BPI) o indice especifico
     20%  IMPRESION DEL PACIENTE  PGIC
     10%  CARGA FARMACOLOGICA   variacion del MME diario y del numero de farmacos
     -    EFECTOS ADVERSOS      penalizan hasta 15 puntos

   Los umbrales de color salen de la literatura, no de una preferencia
   estetica: 30% de alivio es el minimo clinicamente relevante y 50% es la
   respuesta sustancial (IMMPACT, Dworkin 2008).
   ========================================================================= */
'use strict';

const PESOS_EFECTIVIDAD = {dolor:0.40, funcion:0.30, pgic:0.20, medicacion:0.10};

const BANDAS_EFECTIVIDAD = [
  {hasta:-1,  clave:'empeoro',  etiqueta:'Empeoró',              color:'#d92b2b', texto:'#fff',
   accion:'Revisar el diagnóstico antes de cambiar el tratamiento. Un empeoramiento sostenido ' +
          'suele significar que el mecanismo del dolor no es el que se supuso.'},
  {hasta:14,  clave:'nula',     etiqueta:'Sin respuesta',        color:'#f2711c', texto:'#fff',
   accion:'Por debajo del 15% no hay cambio perceptible para el paciente. Suspender lo que no ' +
          'funciona antes de agregar algo nuevo.'},
  {hasta:29,  clave:'minima',   etiqueta:'Respuesta mínima',     color:'#f2b705', texto:'#3a2c00',
   accion:'Cambio perceptible pero por debajo del umbral clínicamente relevante. Optimizar dosis ' +
          'antes de rotar: buena parte de los fracasos son por dosis insuficiente o tiempo insuficiente.'},
  {hasta:49,  clave:'relevante',etiqueta:'Respuesta relevante',  color:'#8cc63f', texto:'#243d05',
   accion:'Alivio clínicamente relevante (≥30%). Sostener y consolidar la ganancia funcional.'},
  {hasta:100, clave:'sustancial',etiqueta:'Respuesta sustancial',color:'#2f9e5f', texto:'#fff',
   accion:'Respuesta sustancial (≥50%). Consolidar, espaciar controles y planificar el descenso ' +
          'de lo que ya no haga falta.'}
];

function bandaEfectividad(pct) {
  for (const b of BANDAS_EFECTIVIDAD) if (pct <= b.hasta) return b;
  return BANDAS_EFECTIVIDAD[BANDAS_EFECTIVIDAD.length - 1];
}

/* -------------------------------------------------------------------------
   Cambio porcentual entre dos valores, en la direccion "mejor".
   Devuelve null cuando falta alguno de los dos: es importante distinguir
   "no mejoro" de "no lo sabemos".
   ------------------------------------------------------------------------- */
function mejoraPct(basal, actual, mayorEsMejor) {
  if (basal == null || actual == null) return null;
  basal = Number(basal); actual = Number(actual);
  if (mayorEsMejor) {
    const techo = 100;
    if (techo === basal) return actual >= basal ? 0 : -100;
    return Math.round(((actual - basal) / (techo - basal)) * 100);
  }
  if (basal === 0) return actual === 0 ? 0 : -100;
  return Math.round(((basal - actual) / basal) * 100);
}

/* =========================================================================
   EFECTIVIDAD GLOBAL DEL PACIENTE
   ========================================================================= */

function efectividadPaciente(p) {
  const r = {
    porcentaje: null, banda: null, componentes: {}, faltan: [],
    confianza: 'baja', serie: [], resumen: ''
  };

  const evos = (p.evoluciones || []).slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));

  /* --- 1. dolor ------------------------------------------------------- */
  const nrsBasal  = primerNRS(p);
  const nrsActual = ultimoNRS(p);
  const dolor = mejoraPct(nrsBasal, nrsActual, false);
  if (dolor == null) r.faltan.push('intensidad basal o actual del dolor');
  else r.componentes.dolor = {
    valor:dolor, basal:nrsBasal, actual:nrsActual, peso:PESOS_EFECTIVIDAD.dolor,
    etiqueta:'Alivio del dolor',
    detalle:'NRS ' + nrsBasal + ' → ' + nrsActual
  };

  /* --- 2. función ----------------------------------------------------- */
  let funcion = null, detalleFuncion = '';
  const indice = ['odi', 'ndi', 'bpi'].find(id => historialEscala(p, id).length >= 2);
  if (indice) {
    const h = historialEscala(p, indice);
    funcion = mejoraPct(h[0].total, h[h.length - 1].total, false);
    detalleFuncion = ESCALAS[indice].sigla + ' ' + h[0].total + ' → ' + h[h.length - 1].total;
  }
  if (funcion == null) r.faltan.push('un índice funcional medido al menos dos veces (BPI, Oswestry o NDI)');
  else r.componentes.funcion = {valor:funcion, peso:PESOS_EFECTIVIDAD.funcion,
    etiqueta:'Función', detalle:detalleFuncion};

  /* --- 3. impresión del paciente -------------------------------------- */
  const pgic = ultimaEscala(p, 'pgic');
  if (pgic == null) r.faltan.push('la impresión global de cambio del paciente (PGIC)');
  else {
    /* 4 es "sin cambios" y es el cero de la escala; 7 es el máximo. */
    const v = Math.round(((pgic - 4) / 3) * 100);
    r.componentes.pgic = {valor:v, peso:PESOS_EFECTIVIDAD.pgic, etiqueta:'Impresión del paciente',
      detalle:(ESCALAS.pgic.items[0].op.find(o => o.v === pgic) || {}).t || ('PGIC ' + pgic)};
  }

  /* --- 4. carga farmacológica ----------------------------------------- */
  /* En dolor oncologico la carga opioide NO mide el exito del tratamiento:
     subir la dosis mientras la enfermedad progresa es hacer bien las cosas, y
     penalizarlo convierte una buena analgesia paliativa en un "fracaso" del
     8%. En ese escenario el dominio se omite y el resto se reparte el peso. */
  const oncologico = (p.diagnostico && (p.diagnostico.sindromeId === 'dolor_oncologico' ||
                     /MG30\.1/.test(p.diagnostico.icd || '')));
  const mmeBasal  = (!oncologico && p.mmeBasal != null) ? p.mmeBasal : null;
  const mmeActual = calcularMME((p.medicacion || [])
    .filter(m => FARMACOS[m.farmaco] && FARMACOS[m.farmaco].grupo === 'Opioide')
    .map(m => ({id:m.farmaco, mgDia:mgDiariosDe(m), mcgHora:mcgHoraDe(m)}))).total;
  if (mmeBasal != null) {
    let v = mmeBasal === 0
      ? (mmeActual === 0 ? 0 : -50)          /* empezó sin opioide y ahora tiene: cuenta en contra */
      : mejoraPct(mmeBasal, mmeActual, false);
    /* Triplicar una dosis baja da -200% y arrastra el total a un número que no
       significa nada. El dominio pesa un 10%: que se exprese dentro de su rango. */
    v = Math.max(-100, Math.min(100, v));
    r.componentes.medicacion = {valor:v, peso:PESOS_EFECTIVIDAD.medicacion,
      etiqueta:'Carga opioide', detalle:mmeBasal + ' → ' + mmeActual + ' MME/día'};
  }

  /* --- combinar ------------------------------------------------------- */
  let suma = 0, pesos = 0;
  for (const k of Object.keys(r.componentes)) {
    const comp = r.componentes[k];
    suma  += Math.max(-100, Math.min(100, comp.valor)) * comp.peso;
    pesos += comp.peso;
  }
  if (!pesos) {
    r.resumen = 'Todavía no hay datos suficientes para medir la efectividad. ' +
                'Hace falta al menos una intensidad basal y una de control.';
    return r;
  }

  let pct = Math.round(suma / pesos);

  /* --- penalización por efectos adversos ------------------------------- */
  const adversos = (p.evoluciones || []).flatMap(e => e.adversos || []);
  const graves = adversos.filter(a => a && a.grave).length;
  const leves  = adversos.length - graves;
  const castigo = Math.min(15, graves * 8 + leves * 2);
  if (castigo) {
    r.componentes.adversos = {valor:-castigo, peso:0, etiqueta:'Efectos adversos',
      detalle:adversos.length + ' registrado' + (adversos.length === 1 ? '' : 's') +
              (graves ? ', ' + graves + ' grave' + (graves === 1 ? '' : 's') : '')};
    pct -= castigo;
  }

  r.porcentaje = Math.max(-100, Math.min(100, pct));
  r.banda = bandaEfectividad(r.porcentaje);

  /* --- confianza del número -------------------------------------------- */
  const dominios = Object.keys(r.componentes).filter(k => k !== 'adversos').length;
  r.confianza = dominios >= 3 ? 'alta' : dominios === 2 ? 'media' : 'baja';

  /* --- serie temporal para el gráfico ---------------------------------- */
  r.serie = evos.filter(e => e.nrs != null).map(e => ({fecha:e.fecha, nrs:e.nrs}));
  if (nrsBasal != null) {
    const inicio = p.dolor && p.dolor.fechaHistoria || p.creado;
    r.serie.unshift({fecha:(inicio || '').slice(0, 10), nrs:nrsBasal, basal:true});
  }

  r.resumen = r.banda.etiqueta + ' — ' + r.porcentaje + '%. ' +
    (r.confianza === 'baja'
      ? 'El número se apoya en un solo dominio: tomarlo como orientativo.'
      : r.confianza === 'media'
        ? 'Basado en dos dominios.'
        : 'Basado en ' + dominios + ' dominios: es una medida sólida.');

  return r;
}

/* =========================================================================
   EFECTIVIDAD DE UN TRATAMIENTO EN PARTICULAR
   -------------------------------------------------------------------------
   Se mide dentro de la ventana en que ese tratamiento estuvo activo, no
   sobre toda la historia. De otro modo un farmaco arrastra el merito o la
   culpa de lo que hizo el anterior.
   ========================================================================= */

function efectividadTratamiento(p, tratamiento) {
  const t = tratamiento;
  const desde = t.inicio || '';
  const hasta = t.fin || '9999';

  const dentro = (p.evoluciones || [])
    .filter(e => e.fecha && e.fecha >= desde && e.fecha <= hasta && e.nrs != null)
    .sort((a, b) => a.fecha.localeCompare(b.fecha));

  const basal = t.nrsInicio != null ? Number(t.nrsInicio)
              : (dentro.length ? dentro[0].nrs : null);
  const actual = dentro.length ? dentro[dentro.length - 1].nrs : null;

  const pct = mejoraPct(basal, actual, false);
  const banda = pct == null ? null : bandaEfectividad(pct);

  /* Tiempo transcurrido: un fármaco evaluado antes de su latencia no es un
     fracaso, es una evaluación prematura, y conviene decirlo. */
  const dias = desde ? Math.floor((Date.now() - new Date(desde + 'T12:00:00').getTime()) / 86400000) : null;
  const f = FARMACOS[t.farmaco];
  let advertencia = '';
  if (f && f.latencia && dias != null && dias < 21 && (pct == null || pct < 30)) {
    advertencia = 'Lleva ' + dias + ' días. ' + f.nombre + ' necesita ' + f.latencia.toLowerCase() +
                  '. Evaluar el fracaso ahora sería prematuro.';
  }
  if (f && f.titulacion && dias != null && dias < 14) {
    advertencia = advertencia || 'Todavía en período de titulación.';
  }

  return {
    porcentaje: pct, banda, basal, actual, dias,
    mediciones: dentro.length, advertencia,
    serie: dentro.map(e => ({fecha:e.fecha, nrs:e.nrs}))
  };
}

/* Historial de una escala a lo largo de las evoluciones, mas el valor
   inicial de la historia clinica. */
function historialEscala(p, id) {
  const salida = [];
  const base = p.escalas && p.escalas[id];
  if (base && base.total != null) salida.push({fecha:base.fecha || (p.creado || '').slice(0, 10), total:base.total});
  for (const e of (p.evoluciones || [])) {
    const v = e.escalas && e.escalas[id];
    if (v != null) salida.push({fecha:e.fecha, total:typeof v === 'object' ? v.total : v});
  }
  return salida.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
}

/* =========================================================================
   GRAFICO DE EVOLUCION — SVG generado a mano
   -------------------------------------------------------------------------
   Se dibuja directo en SVG y sin ninguna libreria: son cinco lineas de
   matematica y evita cargar 300 KB de dependencia para mostrar seis puntos.
   El color de cada punto sigue el mismo semaforo que el mapa corporal, para
   que el ojo no tenga que aprender dos codigos distintos.
   ========================================================================= */

function graficoEvolucion(serie, ancho, alto) {
  const W = ancho || 480, H = alto || 150;
  const mI = 34, mD = 12, mS = 14, mInf = 26;
  const gw = W - mI - mD, gh = H - mS - mInf;

  if (!serie || serie.length === 0) {
    return '<div class="grafico-vacio">Sin mediciones registradas todavía.</div>';
  }

  const x = i => mI + (serie.length === 1 ? gw / 2 : (i / (serie.length - 1)) * gw);
  const y = v => mS + gh - (Math.max(0, Math.min(10, v)) / 10) * gh;

  let svg = '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
            'aria-label="Evolución de la intensidad del dolor">';

  /* Bandas de fondo: la zona verde es el objetivo, la roja el dolor severo. */
  svg += '<rect x="' + mI + '" y="' + y(10) + '" width="' + gw + '" height="' + (y(7) - y(10)) +
         '" fill="#d92b2b" opacity=".07"/>';
  svg += '<rect x="' + mI + '" y="' + y(7)  + '" width="' + gw + '" height="' + (y(4) - y(7)) +
         '" fill="#f2b705" opacity=".07"/>';
  svg += '<rect x="' + mI + '" y="' + y(4)  + '" width="' + gw + '" height="' + (y(0) - y(4)) +
         '" fill="#2f9e5f" opacity=".07"/>';

  for (const v of [0, 5, 10]) {
    svg += '<line x1="' + mI + '" y1="' + y(v) + '" x2="' + (W - mD) + '" y2="' + y(v) +
           '" stroke="currentColor" opacity=".14"/>';
    svg += '<text x="' + (mI - 7) + '" y="' + (y(v) + 4) + '" text-anchor="end" ' +
           'font-size="10" fill="currentColor" opacity=".55">' + v + '</text>';
  }

  const puntos = serie.map((s, i) => x(i) + ',' + y(s.nrs)).join(' ');
  if (serie.length > 1) {
    svg += '<polyline points="' + puntos + '" fill="none" stroke="currentColor" ' +
           'stroke-width="2" opacity=".45" stroke-linejoin="round"/>';
  }

  serie.forEach((s, i) => {
    const c = colorDolor(s.nrs);
    svg += '<circle cx="' + x(i) + '" cy="' + y(s.nrs) + '" r="' + (s.basal ? 6 : 5) + '" ' +
           'fill="' + c.color + '" stroke="' + c.borde + '" stroke-width="1.5"><title>' +
           esc(fechaCorta(s.fecha)) + ' — NRS ' + s.nrs + (s.basal ? ' (basal)' : '') +
           '</title></circle>';
  });

  /* Solo la primera y la última fecha: con seis etiquetas no se lee nada. */
  svg += '<text x="' + mI + '" y="' + (H - 7) + '" font-size="10" fill="currentColor" opacity=".55">' +
         esc(fechaCorta(serie[0].fecha)) + '</text>';
  if (serie.length > 1) {
    svg += '<text x="' + (W - mD) + '" y="' + (H - 7) + '" text-anchor="end" font-size="10" ' +
           'fill="currentColor" opacity=".55">' + esc(fechaCorta(serie[serie.length - 1].fecha)) + '</text>';
  }

  return svg + '</svg>';
}

/* Anillo de porcentaje: el indicador redondo que se ve en la lista de
   pacientes y en el encabezado de cada historia. */
function anilloEfectividad(pct, tam) {
  const T = tam || 56, r = T / 2 - 5, C = 2 * Math.PI * r;
  if (pct == null) {
    return '<svg class="anillo" viewBox="0 0 ' + T + ' ' + T + '" width="' + T + '" height="' + T + '">' +
           '<circle cx="' + T/2 + '" cy="' + T/2 + '" r="' + r + '" fill="none" ' +
           'stroke="currentColor" stroke-width="4" opacity=".18"/>' +
           '<text x="' + T/2 + '" y="' + (T/2 + 4) + '" text-anchor="middle" font-size="13" ' +
           'fill="currentColor" opacity=".45">—</text></svg>';
  }
  const b = bandaEfectividad(pct);
  const visible = Math.max(0, pct) / 100;
  return '<svg class="anillo" viewBox="0 0 ' + T + ' ' + T + '" width="' + T + '" height="' + T + '">' +
    '<circle cx="' + T/2 + '" cy="' + T/2 + '" r="' + r + '" fill="none" stroke="currentColor" ' +
    'stroke-width="4" opacity=".15"/>' +
    '<circle cx="' + T/2 + '" cy="' + T/2 + '" r="' + r + '" fill="none" stroke="' + b.color + '" ' +
    'stroke-width="4" stroke-linecap="round" stroke-dasharray="' + (C * visible) + ' ' + C + '" ' +
    'transform="rotate(-90 ' + T/2 + ' ' + T/2 + ')"/>' +
    '<text x="' + T/2 + '" y="' + (T/2 + 5) + '" text-anchor="middle" font-size="14" ' +
    'font-weight="600" fill="' + b.color + '">' + pct + '%</text></svg>';
}

/* ================ email.js ================ */
/* =========================================================================
   CORREO
   -------------------------------------------------------------------------
   Dos envios, y nada mas que dos:

     1. Al PACIENTE, el enlace a su cuestionario.
     2. Al CONSULTORIO, el aviso de que un cuestionario llego completo.

   Si el envio no esta configurado, las dos funciones devuelven false sin
   romper nada y la aplicacion muestra el enlace en pantalla.
   ========================================================================= */
'use strict';

function envioConfigurado() {
  return !!(typeof ENVIO_URL === 'string' && ENVIO_URL && ENVIO_CLAVE);
}

function mandar(carga) {
  if (!envioConfigurado()) return Promise.resolve(false);
  /* Se usa 'text/plain' a proposito: evita el preflight CORS que Apps Script
     no responde. El cuerpo sigue siendo JSON y del otro lado se parsea igual. */
  return fetch(ENVIO_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({...carga, clave:ENVIO_CLAVE})
  })
  .then(r => r.json())
  .then(r => !!(r && r.ok))
  .catch(e => { console.error('Envío de correo:', e); return false; });
}

function enviarEnlacePorMail(email, enlace, dni) {
  const asunto = MARCA.nombre + ' — su cuestionario previo a la consulta';
  const cuerpo =
'<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;' +
'max-width:560px;margin:0 auto;color:#141821;line-height:1.55">' +
'<h2 style="margin:0 0 4px;letter-spacing:.06em">' + esc(MARCA.nombre) + '</h2>' +
'<p style="margin:0 0 22px;color:#828b9c;font-size:13px">' + esc(MARCA.bajada) + '</p>' +
'<p>Recibimos su solicitud para completar el cuestionario previo a la consulta.</p>' +
'<p style="margin:24px 0"><a href="' + enlace + '" ' +
'style="background:#2d6a72;color:#fff;padding:13px 24px;border-radius:9px;' +
'text-decoration:none;display:inline-block;font-weight:600">Completar mi cuestionario</a></p>' +
'<p style="font-size:13px;color:#4a5364">Si el botón no funciona, copie y pegue esta dirección ' +
'en su navegador:<br><span style="word-break:break-all;font-family:monospace;font-size:12px">' +
esc(enlace) + '</span></p>' +
'<p style="font-size:13px;color:#4a5364"><b>Guarde este correo.</b> Este enlace es personal y ' +
'es el único que le permite volver a entrar para seguir completándolo. Puede hacerlo en varias ' +
'veces: lo que escriba se guarda solo.</p>' +
'<hr style="border:0;border-top:1px solid #dde1e9;margin:26px 0">' +
'<p style="font-size:11.5px;color:#828b9c;line-height:1.5">' + esc(LEGAL_PIE) + '</p>' +
'<p style="font-size:11.5px;color:#828b9c">Si usted no solicitó este cuestionario, ignore ' +
'este correo: sin abrir el enlace no se registra ningún dato suyo.</p></div>';

  return mandar({para:email, asunto, html:cuerpo, tipo:'enlace-cuestionario', ref:dni});
}

/* Aviso al consultorio. Deliberadamente NO lleva datos clinicos: solo dice
   que hay algo nuevo para mirar. Un correo con la historia adentro es una
   historia clinica viajando por un canal que no controlamos. */
function avisarAlMedico(precarga) {
  if (!MARCA.email) return Promise.resolve(false);
  const d = precarga.datos || {};
  const quien = [d.apellido, d.nombre].filter(Boolean).join(', ') || ('DNI ' + precarga.dni);
  const urgente = (d.banderas || []).length > 0;

  const cuerpo =
'<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;' +
'max-width:520px;color:#141821;line-height:1.55">' +
'<h3 style="margin:0 0 12px">Cuestionario completado</h3>' +
'<p><b>' + esc(quien) + '</b> completó y envió el cuestionario previo a la consulta.</p>' +
(precarga.turno ? '<p>Turno: <b>' + esc(fechaCorta(precarga.turno)) + '</b></p>' : '') +
(urgente ? '<p style="background:#fdecea;border-left:3px solid #d92b2b;padding:10px 13px;' +
'border-radius:7px"><b>Marcó síntomas de alarma en la sección de otros síntomas.</b> ' +
'Conviene revisarlo antes del turno.</p>' : '') +
'<p style="font-size:13px;color:#4a5364">Está disponible en la aplicación, en ' +
'<b>Pacientes precargados</b>. Por resguardo de los datos, el contenido del cuestionario ' +
'no viaja por correo.</p></div>';

  return mandar({para:MARCA.email, asunto:'[' + MARCA.nombre + '] Cuestionario de ' + quien,
                 html:cuerpo, tipo:'aviso-medico'});
}

/* ================ ui-ventanas.js ================ */
/* =========================================================================
   GESTOR DE VENTANAS
   -------------------------------------------------------------------------
   Toda la navegacion de la aplicacion pasa por aca. No hay rutas, ni menu,
   ni botones de volver: hay una PILA de ventanas.

     abrir({...})        apila una ventana nueva a la derecha
     volverA(indice)     cierra todo lo que esta a la derecha de esa posicion
     refrescar()         vuelve a dibujar la ventana activa sin perder el scroll

   Las ventanas de atras se dibujan como LOMOS verticales sobre el borde
   izquierdo. Tocar un lomo vuelve a esa ventana. Eso es todo el sistema de
   navegacion, y por eso no hace falta ningun menu.

   Una ventana se declara asi:
     {id, titulo, sub, ancha, ctx, dibujar(cuerpo, ctx)}
   donde dibujar() recibe el nodo del cuerpo y lo llena. Si la ventana
   necesita rehacerse cuando cambian los datos, no guarda nada: se vuelve a
   llamar a dibujar() y listo.
   ========================================================================= */
'use strict';

const PILA = [];

function abrir(def) {
  /* Si esa ventana ya esta abierta, no se duplica: se vuelve a ella. */
  const ya = PILA.findIndex(v => v.id === def.id);
  if (ya >= 0) {
    PILA.length = ya + 1;
    PILA[ya] = {...PILA[ya], ...def};
  } else {
    PILA.push(def);
  }
  pintarPila();
}

function volverA(indice) {
  PILA.length = Math.max(1, indice + 1);
  pintarPila();
}

function cerrarUltima() {
  if (PILA.length > 1) { PILA.pop(); pintarPila(); }
}

function reemplazar(def) {
  if (PILA.length) PILA[PILA.length - 1] = def;
  else PILA.push(def);
  pintarPila();
}

/* Redibuja solo el cuerpo de la ventana activa, conservando la posicion del
   scroll. Es lo que se llama despues de guardar algo: el medico no pierde
   el lugar donde estaba escribiendo. */
function refrescarVentanaActiva() {
  if (!PILA.length) return;
  const cuerpo = $('#pila .ventana:last-child .cuerpo');
  if (!cuerpo) { pintarPila(); return; }
  const y = cuerpo.scrollTop;
  const v = PILA[PILA.length - 1];
  cuerpo.innerHTML = '';
  try { v.dibujar(cuerpo, v.ctx); } catch (e) { errorEnVentana(cuerpo, e); }
  cuerpo.scrollTop = y;
  pintarLomos();
}
const refrescar = refrescarVentanaActiva;

function pintarPila() {
  const lienzo = $('#pila');
  if (!lienzo) return;
  lienzo.innerHTML = '';

  PILA.forEach((v, i) => {
    const ultima = i === PILA.length - 1;

    if (!ultima) {
      const lomo = document.createElement('div');
      lomo.className = 'lomo';
      lomo.title = v.titulo;
      lomo.innerHTML = '<b>' + esc(v.titulo) + '</b>';
      lomo.onclick = () => volverA(i);
      lienzo.appendChild(lomo);
      return;
    }

    const vent = document.createElement('section');
    vent.className = 'ventana' + (v.ancha ? ' ancha' : '');
    vent.innerHTML =
      '<header><div><h2>' + esc(v.titulo) + '</h2>' +
      (v.sub ? '<div class="sub">' + esc(v.sub) + '</div>' : '') +
      '</div><div class="espacio"></div>' +
      (i > 0 ? '<button class="cerrar" title="Cerrar esta ventana">✕</button>' : '') +
      '</header><div class="cuerpo"></div>';

    const cerrar = $('.cerrar', vent);
    if (cerrar) cerrar.onclick = cerrarUltima;

    const cuerpo = $('.cuerpo', vent);
    try { v.dibujar(cuerpo, v.ctx); } catch (e) { errorEnVentana(cuerpo, e); }
    lienzo.appendChild(vent);
  });

  /* La ventana activa siempre a la vista, aunque haya muchos lomos. */
  requestAnimationFrame(() => { lienzo.scrollLeft = lienzo.scrollWidth; });
}

function pintarLomos() { /* los lomos no cambian al refrescar el cuerpo */ }

function errorEnVentana(cuerpo, e) {
  console.error(e);
  cuerpo.innerHTML =
    '<div class="alerta alto"><b>Esta ventana no se pudo dibujar</b>' +
    '<p>' + esc(e && e.message ? e.message : String(e)) + '</p>' +
    '<p class="nota">El resto de la aplicación sigue funcionando y los datos están a salvo. ' +
    'Cerrá esta ventana y volvé a intentarlo.</p></div>';
}

function bloque(titulo, contenidoHTML) {

function marca(texto, color) {

}

function dato(rotulo, valor) {

/* Grupo de opciones que se marcan tocandolas. */
function opciones(nodo, lista, seleccion, alCambiar, multiple) {
  const cont = document.createElement('div');
  cont.className = 'opciones';
  const sel = new Set(multiple ? (seleccion || []) : (seleccion != null ? [seleccion] : []));

  /* El grupo se repinta A SI MISMO al tocarlo.

     Antes solo avisaba hacia afuera y daba por sentado que quien lo usaba iba
     a redibujar la pantalla. Donde eso no pasaba —los descriptores del dolor,
     entre otros— el dato se guardaba bien pero la opcion no se marcaba: el
     paciente tocaba "Quemante", no veia ningun cambio, y volvia a tocar, con
     lo cual la desmarcaba. Peor que no funcionar: funcionaba al reves de lo
     que se veia. */
  function pintar() {
    cont.innerHTML = '';
    for (const o of lista) {
      const valor = o.v !== undefined ? o.v : o;
      const texto = o.t !== undefined ? o.t : o;
      const b = document.createElement('div');
      b.className = 'op' + (sel.has(valor) ? ' on' : '') +
                    (o.clase ? ' ' + o.clase : '');
      b.textContent = texto;
      b.onclick = () => {
        if (multiple) {
          sel.has(valor) ? sel.delete(valor) : sel.add(valor);
          pintar();
          alCambiar([...sel]);
        } else {
          const nuevo = sel.has(valor) ? null : valor;
          sel.clear();
          if (nuevo != null) sel.add(nuevo);
          pintar();
          alCambiar(nuevo);
        }
      };
      cont.appendChild(b);
    }
  }
  pintar();

  nodo.appendChild(cont);
  return cont;
}

/* Escala numerica 0 a 10 con el color del semaforo del dolor. */
function escalaNRS(nodo, valor, alCambiar, etiquetas) {
  const cont = document.createElement('div');
  cont.className = 'nrs';

  /* La escala se repinta A SI MISMA. Antes avisaba hacia afuera y quien la
     usaba rehacia la pantalla entera, con lo cual el paciente elegia un
     numero y la pagina lo devolvia al principio: tenia que volver a bajar con
     el dedo por cada una de las cuatro intensidades. */
  let actual = valor;

  function pintar() {
    cont.innerHTML = '';
    for (let i = 0; i <= 10; i++) {
      const n = document.createElement('div');
      n.className = 'n' + (actual === i ? ' on' : '');
      n.textContent = i;
      if (actual === i) {
        const c = colorDolor(i);
        n.style.background = i === 0 ? 'var(--verde)' : c.color;
        n.style.color = i >= 3 && i <= 6 ? '#3a2c00' : '#fff';
      }
      n.onclick = () => {
        actual = (actual === i) ? null : i;
        pintar();
        alCambiar(actual);
      };
      cont.appendChild(n);
    }
  }
  pintar();

  nodo.appendChild(cont);
  const pie = document.createElement('div');
  pie.className = 'nrs-pie';
  const e = etiquetas || ['sin dolor', 'el peor dolor imaginable'];
  pie.innerHTML = '<span>' + esc(e[0]) + '</span><span>' + esc(e[1]) + '</span>';
  nodo.appendChild(pie);
  return cont;
}

/* Campo de texto conectado a un objeto. Guarda al salir del campo, no en
   cada tecla: escribir no debe disparar una escritura en la nube por letra. */
function campo(nodo, rotulo, obj, clave, opciones) {
  const o = opciones || {};
  const cont = document.createElement('div');
  cont.className = 'campo';
  const id = 'c_' + Math.random().toString(36).slice(2, 8);
  const etiqueta = rotulo ? '<label for="' + id + '">' + esc(rotulo) + '</label>' : '';
  const valor = esc(obj[clave] == null ? '' : obj[clave]);

  if (o.area) {
    cont.innerHTML = etiqueta + '<textarea id="' + id + '" rows="' + (o.filas || 3) + '" ' +
      'placeholder="' + esc(o.pista || '') + '">' + valor + '</textarea>';
  } else if (o.lista) {
    const ops = o.lista.map(x => {
      const v = x.v !== undefined ? x.v : x, t = x.t !== undefined ? x.t : x;
      return '<option value="' + esc(v) + '"' + (String(obj[clave]) === String(v) ? ' selected' : '') +
             '>' + esc(t) + '</option>';
    }).join('');
    cont.innerHTML = etiqueta + '<select id="' + id + '"><option value="">— elegir —</option>' + ops + '</select>';
  } else {
    cont.innerHTML = etiqueta + '<input id="' + id + '" type="' + (o.tipo || 'text') + '" ' +
      'value="' + valor + '" placeholder="' + esc(o.pista || '') + '"' +
      (o.max != null ? ' max="' + o.max + '"' : '') + '>';
  }
  if (o.ayuda) cont.insertAdjacentHTML('beforeend', '<div class="ayuda">' + esc(o.ayuda) + '</div>');

  const control = $('#' + id, cont);
  const guardar = () => {
    obj[clave] = control.value;
    if (o.alCambiar) o.alCambiar(control.value);
  };
  control.addEventListener('change', guardar);
  control.addEventListener('blur', guardar);
  nodo.appendChild(cont);
  return control;
}

/* Confirmacion propia, para no usar el confirm() del navegador en acciones
   que borran cosas. */
function confirmar(titulo, texto, alAceptar, textoBoton) {
  const capa = document.createElement('div');
  capa.className = 'selector-dolor';
  capa.innerHTML =
    '<div><h3 style="font-size:16px;margin-bottom:8px">' + esc(titulo) + '</h3>' +
    '<p class="nota" style="margin-bottom:16px">' + esc(texto) + '</p>' +
    '<div class="fila"><div class="superficie peligro" data-si><b>' +
    esc(textoBoton || 'Sí, continuar') + '</b></div>' +
    '<div class="superficie" data-no><b>Cancelar</b></div></div></div>';
  capa.querySelector('[data-si]').onclick = () => { capa.remove(); alAceptar(); };
  capa.querySelector('[data-no]').onclick = () => capa.remove();
  capa.onclick = e => { if (e.target === capa) capa.remove(); };
  document.body.appendChild(capa);
}

/* ================ ui-mapa.js ================ */
/* =========================================================================
   MAPA CORPORAL INTERACTIVO
   -------------------------------------------------------------------------
   El paciente toca la silueta donde le duele y elige la intensidad de ese
   punto en una escala de 0 a 10. El punto queda del color que le
   corresponde: verde, verde claro, amarillo, naranja o rojo.

   Que se gana con eso, respecto de la cruz de toda la vida:
     - el medico ve la topografia Y la severidad de un vistazo, sin leer;
     - el dolor irradiado se distingue del dolor principal por el color;
     - la aplicacion puede calcular el indice de dolor generalizado y la
       plausibilidad neuroanatomica, porque cada punto sabe en que zona cayo.

   Funciona con el dedo, con el mouse y con el lapiz. Las coordenadas se
   guardan en las unidades del lienzo de 200x520 y no en pixeles, asi el
   dibujo es identico en el telefono del paciente y en el monitor del
   consultorio.
   ========================================================================= */
'use strict';

const CUERPO_W = 200, CUERPO_H = 520;

/* -------------------------------------------------------------------------
   Dibuja las dos vistas. `puntos` es el array que se va a modificar en el
   lugar; `alCambiar` se llama despues de cada modificacion para guardar.
   Con `soloLectura` en verdadero se dibuja igual pero no se puede tocar:
   es como lo ve el medico en la historia clinica y como sale impreso.
   ------------------------------------------------------------------------- */
function dibujarMapa(nodo, puntos, alCambiar, soloLectura) {
  const cont = document.createElement('div');
  cont.className = 'mapa';
  const VISTAS = [{v:'f', t:'Vista frontal'}, {v:'d', t:'Vista posterior'}];

  for (const vista of VISTAS) {
    const caja = document.createElement('div');
    caja.className = 'mapa-vista';
    caja.dataset.vista = vista.v;
    cont.appendChild(caja);
  }
  nodo.appendChild(cont);
  nodo.insertAdjacentHTML('beforeend', leyendaColores());

  /* Un solo lugar donde se decide qué pasa al tocar la silueta: si se tocó
     un punto existente se edita, y si no, se crea uno nuevo. Al redibujar se
     vuelve a llamar a esta misma función, así que no hay dos copias de la
     misma lógica que puedan quedar desincronizadas. */
  function alTocar(vista, svg, e) {
    const marca = e.target.closest('.punto');
    if (marca) {
      editarPunto(puntos, Number(marca.dataset.i), aplicar);
      return;
    }
    const c = coordenadasDe(svg, e);
    if (!c) return;
    const nuevo = {v:vista, x:Math.round(c.x), y:Math.round(c.y), i:5};
    elegirIntensidad(nuevo.i, zonaDe(nuevo.x, nuevo.y, vista), valor => {
      if (valor == null) return;
      nuevo.i = valor;
      puntos.push(nuevo);
      aplicar();
    });
  }

  function aplicar() {
    redibujar();
    if (alCambiar) alCambiar(puntos);
  }

  function redibujar() {
    for (const vista of VISTAS) {
      const caja = $('.mapa-vista[data-vista="' + vista.v + '"]', cont);
      caja.innerHTML = '<span>' + vista.t + '</span>' + svgSilueta(vista.v, puntos);
      if (soloLectura) continue;
      const svg = $('svg', caja);
      svg.addEventListener('click', e => alTocar(vista.v, svg, e));
    }
  }

  redibujar();
  return {redibujar};
}

/* Del evento del navegador a las coordenadas del lienzo del cuerpo. */
function coordenadasDe(svg, evento) {
  const caja = svg.getBoundingClientRect();
  if (!caja.width) return null;
  const cx = evento.clientX != null ? evento.clientX
           : (evento.touches && evento.touches[0] ? evento.touches[0].clientX : null);
  const cy = evento.clientY != null ? evento.clientY
           : (evento.touches && evento.touches[0] ? evento.touches[0].clientY : null);
  if (cx == null) return null;
  return {
    x: ((cx - caja.left) / caja.width)  * CUERPO_W,
    y: ((cy - caja.top)  / caja.height) * CUERPO_H
  };
}

/* -------------------------------------------------------------------------
   El SVG de una vista, con la silueta y los puntos que le corresponden.
   ------------------------------------------------------------------------- */
function svgSilueta(vista, puntos) {
  let s = '<svg class="silueta" viewBox="0 0 ' + CUERPO_W + ' ' + CUERPO_H + '" ' +
          'preserveAspectRatio="xMidYMid meet" role="img" ' +
          'aria-label="Silueta del cuerpo, ' + (vista === 'f' ? 'vista frontal' : 'vista posterior') +
          '. Tocá donde te duele.">';

  for (const parte of SILUETA.centro) {
    s += '<path class="cuerpo-parte" d="' + parte + '"/>';
  }
  /* Las piezas laterales se dibujan una vez tal cual y otra espejadas sobre
     la linea media (x = 100). La simetria queda garantizada por la
     transformacion y no por haber tipeado bien las dos mitades. */
  /* La nariz va solo de frente: es lo que distingue las dos vistas de un
     vistazo, sin tener que leer el rotulo de arriba. */
  if (vista === 'f') {
    for (const rasgo of (SILUETA.frente || [])) {
      s += '<path class="cuerpo-parte" d="' + rasgo + '"/>';
    }
  }

  for (const parte of SILUETA.lado) {
    s += '<path class="cuerpo-parte" d="' + parte + '"/>';
    s += '<path class="cuerpo-parte" d="' + parte + '" transform="translate(200,0) scale(-1,1)"/>';
  }

  /* Línea media discreta: ayuda a ubicarse y a marcar simetrías. */
  s += '<line x1="100" y1="60" x2="100" y2="500" stroke="currentColor" ' +
       'opacity=".12" stroke-dasharray="3 5"/>';

  (puntos || []).forEach((p, i) => {
    if (p.v !== vista) return;
    const c = colorDolor(p.i);
    const z = zonaDe(p.x, p.y, p.v);
    s += '<g class="punto" data-i="' + i + '">' +
         '<circle cx="' + p.x + '" cy="' + p.y + '" r="9" fill="' + c.color +
         '" fill-opacity=".28"/>' +
         '<circle cx="' + p.x + '" cy="' + p.y + '" r="6" fill="' + c.color +
         '" stroke="' + c.borde + '" stroke-width="1.4"/>' +
         '<text x="' + p.x + '" y="' + (p.y + 3.4) + '" text-anchor="middle" ' +
         'font-size="8" font-weight="700" fill="' + (p.i >= 3 && p.i <= 6 ? '#3a2c00' : '#fff') +
         '" pointer-events="none">' + p.i + '</text>' +
         '<title>' + esc(nombreZona(z)) + ' — intensidad ' + p.i + '/10</title></g>';
  });

  return s + '</svg>';
}

function leyendaColores() {
  return '<div class="leyenda-dolor">' +
    COLOR_DOLOR.map((t, k) => {
      const desde = k === 0 ? 1 : COLOR_DOLOR[k - 1].hasta + 1;
      return '<span><i style="background:' + t.color + '"></i>' + desde + '–' + t.hasta +
             ' ' + esc(t.nombre.toLowerCase()) + '</span>';
    }).join('') + '</div>';
}

/* -------------------------------------------------------------------------
   Selector de intensidad. Aparece cuando se marca un punto nuevo.
   ------------------------------------------------------------------------- */
function elegirIntensidad(valorInicial, zona, alTerminar) {
  const capa = document.createElement('div');
  capa.className = 'selector-dolor';
  const caja = document.createElement('div');
  caja.innerHTML =
    '<h3 style="font-size:16px">' + esc(nombreZona(zona)) + '</h3>' +
    '<p class="nota" style="margin:4px 0 16px">¿Cuánto le duele en este punto?</p>';

  let valor = valorInicial;
  const zonaNRS = document.createElement('div');
  caja.appendChild(zonaNRS);
  const pintarNRS = () => {
    zonaNRS.innerHTML = '';
    escalaNRS(zonaNRS, valor, v => { valor = v == null ? 0 : v; pintarNRS(); },
              ['casi no duele', 'dolor insoportable']);
  };
  pintarNRS();

  const acciones = document.createElement('div');
  acciones.className = 'fila';
  acciones.style.marginTop = '18px';
  caja.appendChild(acciones);

  acciones.appendChild(superficie('Marcar este punto', null, () => {
    capa.remove(); alTerminar(valor == null ? 5 : valor);
  }, 'acento'));
  acciones.appendChild(superficie('Cancelar', null, () => { capa.remove(); alTerminar(null); }));

  capa.appendChild(caja);
  capa.onclick = e => { if (e.target === capa) { capa.remove(); alTerminar(null); } };
  document.body.appendChild(capa);
}

/* Tocar un punto ya marcado: se cambia la intensidad o se borra. */
function editarPunto(puntos, indice, alTerminar) {
  const p = puntos[indice];
  if (!p) return;
  const zona = zonaDe(p.x, p.y, p.v);

  const capa = document.createElement('div');
  capa.className = 'selector-dolor';
  const caja = document.createElement('div');
  caja.innerHTML =
    '<h3 style="font-size:16px">' + esc(nombreZona(zona)) + '</h3>' +
    '<p class="nota" style="margin:4px 0 16px">Cambiá la intensidad o quitá el punto.</p>';

  let valor = p.i;
  const zonaNRS = document.createElement('div');
  caja.appendChild(zonaNRS);
  const pintarNRS = () => {
    zonaNRS.innerHTML = '';
    escalaNRS(zonaNRS, valor, v => { valor = v == null ? 0 : v; pintarNRS(); },
              ['casi no duele', 'dolor insoportable']);
  };
  pintarNRS();

  const acciones = document.createElement('div');
  acciones.className = 'fila';
  acciones.style.marginTop = '18px';
  caja.appendChild(acciones);
  acciones.appendChild(superficie('Guardar', null, () => {
    p.i = valor == null ? 0 : valor; capa.remove(); alTerminar();
  }, 'acento'));
  acciones.appendChild(superficie('Quitar este punto', null, () => {
    puntos.splice(indice, 1); capa.remove(); alTerminar();
  }, 'peligro'));

  capa.appendChild(caja);
  capa.onclick = e => { if (e.target === capa) capa.remove(); };
  document.body.appendChild(capa);
}

/* =========================================================================
   LECTURA DEL MAPA PARA EL MEDICO
   -------------------------------------------------------------------------
   El resumen que acompaña al dibujo en la historia clinica. Traduce la nube
   de puntos a las tres cosas que cambian una conducta: donde duele mas, si
   la distribucion es discreta o generalizada, y si sigue un territorio
   nervioso.
   ========================================================================= */
function resumenMapa(puntos) {
  const l = leerMapa(puntos);
  if (!l.total) {
    return '<p class="nota">El mapa corporal está vacío. Es el dato que más cambia el ' +
           'análisis automático: sin él no se puede calcular la distribución del dolor, ' +
           'el índice de dolor generalizado ni la plausibilidad neuroanatómica.</p>';
  }

  const raiz = raizDominante(l);
  const colorDist = {localizada:'verde', regional:'lima', multifocal:'ambar', generalizada:'rojo'}[l.distribucion];

  let h = '<div class="fila" style="margin-bottom:12px">';
  h += '<div style="flex:1 1 130px">' + marca(l.total + ' punto' + (l.total === 1 ? '' : 's'), 'neutro') + '</div>';
  h += '<div style="flex:1 1 130px">' + marca('Distribución ' + l.distribucion, colorDist) + '</div>';
  h += '<div style="flex:1 1 130px">' + marca('Máxima ' + l.intensidadMax + '/10',
        colorDolor(l.intensidadMax).nombre === 'Leve' ? 'verde' : l.intensidadMax >= 7 ? 'rojo' : 'ambar') + '</div>';
  if (l.bilateral) h += '<div style="flex:1 1 130px">' + marca('Bilateral', 'violeta') + '</div>';
  h += '</div>';

  h += '<dl style="margin:0">';
  h += dato('Zonas comprometidas',
    l.zonas.slice(0, 8).map(z => {
      const c = colorDolor(z.i);
      return '<span style="display:inline-flex;align-items:center;gap:5px;margin:0 9px 4px 0">' +
        '<i style="width:9px;height:9px;border-radius:50%;background:' + c.color +
        ';display:inline-block"></i>' + esc(nombreZona(z.z)) + ' <b>' + z.i + '</b></span>';
    }).join('') + (l.zonas.length > 8 ? '<span class="nota"> y ' + (l.zonas.length - 8) + ' más</span>' : ''));

  h += dato('Índice de dolor generalizado (WPI)',
    l.wpi + ' / 19 regiones · ' + l.areas.length + ' de 5 áreas corporales' +
    (l.wpi >= 7 && l.areas.length >= 4
      ? ' ' + marca('cumple el criterio de extensión de fibromialgia', 'ambar') : ''));

  if (raiz) {
    h += dato('Territorio nervioso predominante',
      '<b>' + esc(raiz.raiz) + '</b> — ' + raiz.proporcion + '% de las marcas' +
      (raiz.proporcion >= 35
        ? ' ' + marca('distribución neuroanatómicamente plausible', 'violeta')
        : ' <span class="nota">(distribución dispersa: no sigue un territorio único)</span>') +
      (raiz.top.length > 1 ? '<div class="nota">También comprometidos: ' + esc(raiz.top.slice(1).join(', ')) + '</div>' : ''));
  }
  h += '</dl>';
  return h;
}

/* ================ ui-auth.js ================ */
/* =========================================================================
   ENTRADA CON CUENTA
   -------------------------------------------------------------------------
   Se usa Firebase Authentication con correo y contraseña. NO hay claves
   numericas compartidas: una clave de cuatro digitos que sabe todo el
   consultorio no identifica a nadie, y en una historia clinica hace falta
   saber quien escribio que.

   Las cuentas se crean DESDE LA APLICACION, pero solo con un codigo de
   invitacion que emite el titular (ver ui-equipo.js). No hay registro
   abierto: tener una cuenta de Firebase no alcanza para entrar, hace falta
   figurar en /dolor/equipo, y eso lo exigen las reglas de la base.
   ========================================================================= */
'use strict';

function pantallaEntrada() {
  document.body.innerHTML =
    '<div id="app"><div class="lienzo" style="align-items:center;justify-content:center">' +
    '<section class="ventana" style="max-width:420px;flex:0 1 420px">' +
    '<div class="cuerpo" id="entrada"></div></section></div></div>' +
    '<div id="avisos"></div>';
  const c = $('#entrada');

  c.insertAdjacentHTML('beforeend',
    '<div style="text-align:center;padding:14px 0 22px">' +
    '<div style="font-size:26px;font-weight:700;letter-spacing:.09em">' + esc(MARCA.nombre) + '</div>' +
    (MARCA.firma ? '<div style="font-size:13px;color:var(--acento);margin-top:2px">' +
      esc(MARCA.firma) + '</div>' : '') +
    '<div class="nota" style="margin-top:3px">' + esc(MARCA.bajada) + '</div></div>');

  if (!firebaseConfigurado()) {
    c.insertAdjacentHTML('beforeend',
      '<div class="alerta medio"><b>Firebase todavía no está configurado</b>' +
      '<p>La aplicación va a funcionar solo en este dispositivo: sin sincronización y sin ' +
      'portal del paciente. Para activarlos hay que completar <span class="mono">' +
      'src/firebase-config.js</span> y pegar las reglas de <span class="mono">' +
      'reglas-firebase.txt</span>.</p></div>');
    c.appendChild(superficie('Entrar en modo local', 'Los datos quedan solo en esta computadora',
      () => { ESTADO.usuario = {email:'local', rol:'medico'}; iniciarAplicacion(); }, 'acento'));
    return;
  }

  const d = {email:'', clave:''};
  campo(c, 'Correo', d, 'email', {tipo:'email'});
  campo(c, 'Contraseña', d, 'clave', {tipo:'password'});

  c.appendChild(superficie('Entrar', null, () => {
    if (!emailValido(d.email) || !d.clave) return avisar('Completá el correo y la contraseña.', 'error');
    fbAuth.signInWithEmailAndPassword(d.email.trim(), d.clave)
      .then(() => avisar('Bienvenido.', 'ok'))
      .catch(e => {
        const m = {
          'auth/user-not-found':'No hay ninguna cuenta con ese correo.',
          'auth/wrong-password':'La contraseña no es correcta.',
          'auth/invalid-credential':'El correo o la contraseña no son correctos.',
          'auth/too-many-requests':'Demasiados intentos. Esperá unos minutos.',
          'auth/network-request-failed':'Sin conexión a internet.'
        }[e.code] || e.message;
        avisar(m, 'error');
      });
  }, 'acento'));

  c.insertAdjacentHTML('beforeend',
    '<p class="nota" style="margin-top:16px">¿Todavía no tenés cuenta? Se crea desde acá, ' +
    'con el <b>código de invitación</b> que te da el titular del consultorio. Si sos el ' +
    'titular y es la primera vez, no hace falta código.</p>');

  /* La pregunta de la primera vez ("¿y yo cómo entro?") tiene que estar
     contestada acá y no solamente en un archivo aparte: es justo el momento
     en que nadie va a ir a buscar el manual. */
  c.appendChild(superficie('Crear mi cuenta',
    'Con el código de invitación que te dio el titular', pantallaRegistro, 'suave'));

  c.appendChild(superficie('Olvidé mi contraseña', null, () => {
    if (!emailValido(d.email)) return avisar('Escribí primero tu correo arriba.', 'error');
    fbAuth.sendPasswordResetEmail(d.email.trim())
      .then(() => avisar('Te mandamos un correo para restablecerla.', 'ok'))
      .catch(() => avisar('No se pudo enviar el correo.', 'error'));
  }, 'fina'));
}

function vigilarSesion() {
  if (!fbAuth) { pantallaEntrada(); return; }
  fbAuth.onAuthStateChanged(u => {
    if (!u) { ESTADO.usuario = null; pantallaEntrada(); return; }

    ESTADO.usuario = {uid:u.uid, email:u.email, rol:null};

    /* Estar logueado NO alcanza: hay que figurar en el equipo. Se consulta el
       propio registro, que es lo unico que las reglas dejan leer a alguien
       que todavia no es miembro. */
    /* Mientras una cuenta se esta creando NO hay que mirar el equipo: Firebase
       inicia la sesion en cuanto nace la cuenta, y eso ocurre unos
       milisegundos ANTES de que se escriba el registro del miembro. Sin esta
       espera, cada persona recien invitada aterrizaba en "tu cuenta no
       pertenece a este consultorio" la primera vez que entraba. */
    if (window.REGISTRANDO) return;

    leerMiembro(u.uid, 3);
  });
}

/* Lee el registro del miembro y, si no aparece, reintenta un par de veces
   antes de dar por hecho que no pertenece al equipo. La red tarda, y decirle
   a alguien que no tiene acceso cuando en realidad si lo tiene es de las
   cosas que mas confunden. */
function leerMiembro(uid, intentos) {
  fbDb.ref('dolor/equipo/' + uid).once('value')
      .then(s => {
        const m = s.val();
        if (!m) {
          if (intentos > 0) { setTimeout(() => leerMiembro(uid, intentos - 1), 900); return; }
          pantallaSinAcceso(); return;
        }
        ESTADO.usuario.rol = m.rol;
        ESTADO.usuario.nombre = m.nombre;
        marcarInstalado(m);
        iniciarAplicacion();
      })
      .catch(() => {
        /* Si ni siquiera se puede leer el propio registro, o las reglas no
           estan publicadas o no hay conexion. Se dice cual de las dos. */
        if (ESTADO.conectado === false) {
          avisar('Sin conexión. Reintentando…', 'aviso');
          setTimeout(() => leerMiembro(uid, intentos), 3000);
        } else {
          pantallaSinAcceso();
        }
      });
}



/* ================ ui-equipo.js ================ */
/* =========================================================================
   EQUIPO: ALTAS, INVITACIONES Y ROLES
   -------------------------------------------------------------------------
   POR QUE NO HAY REGISTRO ABIERTO, Y POR QUE TAMPOCO HACE FALTA IR A LA
   CONSOLA DE FIREBASE

   Firebase permite que cualquiera que tenga la direccion de la aplicacion se
   cree una cuenta, porque la clave del proyecto viaja dentro del index.html
   y eso es asi por diseño. Si las reglas de la base dijeran "dejo entrar a
   cualquiera que este logueado", cualquier persona podria registrarse sola y
   leer todas las historias clinicas.

   La solucion no es prohibir el registro: es separar DOS cosas que suelen
   confundirse.

     · Tener una CUENTA en Firebase  →  cualquiera puede sacarse una.
     · Pertenecer al EQUIPO          →  solo por invitacion del titular.

   Las reglas de la base exigen lo segundo. Una cuenta que no figura en
   /dolor/equipo no puede leer ni escribir absolutamente nada, aunque haya
   logrado registrarse.

   Con eso, las altas se pueden hacer comodamente desde la aplicacion:
   el titular invita, la persona se registra con el codigo, y listo. Nadie
   tiene que entrar a la consola de Firebase mas que una vez, para la primera
   cuenta.

   LA PRIMERA CUENTA
   Cuando /dolor/equipo esta vacio, la aplicacion deja crear la primera cuenta
   directamente, y quien la crea queda como TITULAR. Es la unica ventana
   abierta que existe y se cierra sola en cuanto hay un miembro. Por eso el
   instructivo insiste en crear esa cuenta apenas se publica la aplicacion y
   no dias despues.
   ========================================================================= */
'use strict';

const ROLES = {
  titular: {
    nombre:'Titular',
    detalle:'Acceso completo. Es la única que puede invitar y dar de baja.',
    puede:['clinica','agenda','equipo','ajustes']
  },
  medico: {
    nombre:'Médico',
    detalle:'Acceso clínico completo: historias, motor, medicación, procedimientos.',
    puede:['clinica','agenda','ajustes']
  },
  secretaria: {
    nombre:'Secretaría',
    detalle:'Agenda, datos de filiación y bandeja de precargados. NO ve el contenido ' +
            'clínico de las historias: ni diagnóstico, ni medicación, ni evoluciones.',
    puede:['agenda']
  }
};

/* ¿Puede el usuario actual hacer esto? En modo local no hay equipo y se
   asume acceso completo: es una sola computadora sin sincronizar. */
function puede(accion) {
  if (!firebaseConfigurado()) return true;
  const yo = miembroActual();
  if (!yo) return false;
  return (ROLES[yo.rol] || ROLES.secretaria).puede.includes(accion);
}

function miembroActual() {
  if (!ESTADO.usuario || !ESTADO.usuario.uid) return null;
  return (ESTADO.equipo || {})[ESTADO.usuario.uid] || null;
}

function esTitular() {
  const yo = miembroActual();
  return !!yo && yo.rol === 'titular';
}

/* Codigo de invitacion legible: seis grupos de cuatro no se dictan por
   telefono sin equivocarse. Cuatro grupos de cuatro, en mayusculas y sin
   caracteres que se confundan (0/O, 1/I/L). */
function codigoInvitacion() {
  const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const a = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(a);
  const s = [...a].map(b => abc[b % abc.length]).join('');
  return s.match(/.{1,4}/g).join('-');
}

/* =========================================================================
   REGISTRO DESDE LA APLICACION
   ========================================================================= */

/* -------------------------------------------------------------------------
   Marca publica de instalacion.

   Quien todavia no tiene cuenta NO puede leer /dolor/equipo: las reglas se lo
   impiden, y esta bien que asi sea. Pero entonces la pantalla de registro no
   tiene forma de saber si el consultorio ya tiene titular, y creia siempre
   que estaba vacio: le ofrecia a cualquiera el alta de titular, aunque la
   base despues se lo rechazara.

   Por eso hay un unico dato PUBLICO en toda la base: un si o un no que dice
   "este consultorio ya esta instalado". No revela nada —ni quien es, ni
   cuantos son, ni ningun correo— y es lo que permite que la pantalla diga la
   verdad antes de pedir nada.
   ------------------------------------------------------------------------- */
function consultarInstalado() {
  /* En modo local no hay equipo ni nube: se comporta como recien instalado. */
  if (!fbDb) return Promise.resolve(false);
  return fbDb.ref('dolor/publico/instalado').once('value')
    .then(s => s.val() === true)
    .catch(() => true);   /* ante la duda, se exige codigo */
}

/* La marca de instalado se escribe al crear la primera cuenta. Pero los
   consultorios que ya tenian titular ANTES de que existiera esa marca se
   quedaron sin ella, y entonces la pantalla de registro seguia ofreciendo el
   alta de titular a cualquiera. Se repara sola: cuando entra un titular y la
   marca no esta, se pone. Una vez, en silencio, y no vuelve a pasar. */
function marcarInstalado(miembro) {
  if (!fbDb || !miembro || miembro.rol !== 'titular') return;
  fbDb.ref('dolor/publico/instalado').once('value')
    .then(s => { if (s.val() !== true) return fbDb.ref('dolor/publico/instalado').set(true); })
    .catch(() => {});
}

/* La pantalla de registro pide SIEMPRE el codigo de invitacion, y solo ofrece
   el alta de titular cuando alguien la pide expresamente.

   Antes era al reves: consultaba la marca de instalado y, si no estaba,
   ofrecia el alta de titular. El problema es que "la marca no esta" no
   significa "no hay titular": significa que no se pudo leer, o que se
   escribio con una version anterior, o que las reglas la bloquean. Frente a
   la duda, la pantalla se comportaba de la manera mas permisiva, que es
   justo la que no corresponde.

   Ahora la duda se resuelve al reves y quien manda es la base: si alguien
   fuerza el alta de titular con un titular ya existente, las reglas la
   rechazan y se le dice por que. */
function pantallaRegistro() {
  const c = $('#entrada');
  if (!c) return;
  dibujarRegistro(c, true);
}

function dibujarRegistro(c, instalado) {
  c.innerHTML =
    '<div style="text-align:center;padding:10px 0 18px">' +
    '<div style="font-size:20px;font-weight:700;letter-spacing:.07em">' + esc(MARCA.nombre) + '</div>' +
    '<div class="nota">Crear mi cuenta</div></div>';

  /* La salida va ARRIBA: en la pantalla anterior estaba al final de un texto
     largo y quien entraba por error no encontraba como volver. */
  c.appendChild(superficie('◀ Volver', null, pantallaEntrada, 'fina'));

  const d = {email:'', clave:'', clave2:'', codigo:'', nombre:''};
  const equipoVacio = !instalado;   // true solo si se pidio el alta de titular

  if (equipoVacio) {
    c.insertAdjacentHTML('beforeend',
      '<div class="alerta medio"><b>Alta de titular</b>' +
      '<p>Esto solo funciona si el consultorio <b>todavía no tiene ninguna cuenta</b>. ' +
      'Si ya hay un titular, la base va a rechazar el alta y hay que pedirle un código ' +
      'de invitación.</p></div>');
    c.appendChild(superficie('Tengo un código de invitación', null,
      () => dibujarRegistro(c, true), 'fina'));
  } else {
    campo(c, 'Código de invitación', d, 'codigo',
      {pista:'XXXX-XXXX-XXXX-XXXX',
       ayuda:'Con el código de invitación que te dio el titular. Se escribe con guiones, ' +
             'como te lo pasaron.'});
  }

  campo(c, 'Nombre y apellido', d, 'nombre');
  campo(c, 'Correo', d, 'email', {tipo:'email'});
  campo(c, 'Contraseña', d, 'clave', {tipo:'password',
    ayuda:'Al menos 8 caracteres. No la reutilices de otro servicio.'});
  campo(c, 'Repetir la contraseña', d, 'clave2', {tipo:'password'});

  c.appendChild(superficie('Crear mi cuenta', null, () => {
    if (!d.nombre.trim())          return avisar('Poné tu nombre y apellido.', 'error');
    if (!emailValido(d.email))     return avisar('El correo no parece válido.', 'error');
    if ((d.clave || '').length < 8) return avisar('La contraseña necesita al menos 8 caracteres.', 'error');
    if (d.clave !== d.clave2)      return avisar('Las dos contraseñas no coinciden.', 'error');

    const email = d.email.trim().toLowerCase();
    const cod = (d.codigo || '').trim().toUpperCase();

    const seguir = invitacion => {
      if (!equipoVacio) {
        if (!invitacion)
          return avisar('Ese código de invitación no existe.', 'error');
        if (invitacion.usada)
          return avisar('Ese código ya fue usado. Pedí uno nuevo.', 'error');
        if (String(invitacion.email).toLowerCase() !== email)
          return avisar('El código fue emitido para otro correo (' +
                        invitacion.email + '). Registrate con ese.', 'error');
      }

      /* Se marca que hay un alta en curso para que la vigilancia de sesion no
         mire el equipo antes de que el registro exista. Ver ui-auth.js. */
      window.REGISTRANDO = true;

      fbAuth.createUserWithEmailAndPassword(email, d.clave)
        .then(cred => {
          const uid = cred.user.uid;
          const miembro = {
            uid, email, nombre:d.nombre.trim(),
            rol: equipoVacio ? 'titular' : invitacion.rol,
            alta: ahora(),
            codigo: equipoVacio ? '' : cod
          };
          return fbDb.ref('dolor/equipo/' + uid).set(miembro)
            .then(() => {
              if (!equipoVacio) {
                return fbDb.ref('dolor/invitaciones/' + cod)
                  .update({usada:true, usadaEn:ahora(), usadaPor:uid});
              }
              /* Primera cuenta: se cierra la puerta para el que venga despues. */
              return fbDb.ref('dolor/publico/instalado').set(true);
            })
            .then(() => {
              avisar(equipoVacio
                ? 'Cuenta de titular creada. Ya podés invitar al resto desde Ajustes → Equipo.'
                : 'Cuenta creada. Bienvenido.', 'ok', 8000);
              /* Recien ahora el registro existe: se libera la vigilancia y se
                 la vuelve a disparar para que entre con el rol ya cargado. */
              window.REGISTRANDO = false;
              vigilarSesion();
            });
        })
        .catch(e => {
          window.REGISTRANDO = false;
          const m = {
            'auth/email-already-in-use':'Ya existe una cuenta con ese correo. Probá entrar, ' +
              'o usá «Olvidé mi contraseña».',
            'auth/weak-password':'La contraseña es demasiado débil.',
            'auth/invalid-email':'El correo no es válido.',
            'auth/operation-not-allowed':'El registro por correo no está habilitado en ' +
              'Firebase. Hay que activarlo en Authentication → Sign-in method.',
            'auth/network-request-failed':'Sin conexión a internet.',
            'PERMISSION_DENIED': equipoVacio
              ? 'La base rechazó el alta de titular: este consultorio YA tiene una cuenta. ' +
                'Pedile al titular un código de invitación.'
              : 'La base rechazó el alta. Puede ser que el código ya se haya usado, que ' +
                'sea para otro correo, o que las reglas de reglas-firebase.txt no estén ' +
                'publicadas.'
          }[e.code] || e.message;
          avisar(m, 'error', 9000);
          /* Si la cuenta de Firebase llego a crearse pero el alta en el equipo
             fallo, queda una cuenta que existe y no sirve para nada. Se cierra
             la sesion para que el proximo intento arranque limpio y no quede
             la persona en la pantalla de "no pertenecés". */
          if (fbAuth.currentUser) fbAuth.signOut().catch(() => {});
        });
    };

    if (equipoVacio) return seguir(null);
    fbDb.ref('dolor/invitaciones/' + cod).once('value')
      .then(s => seguir(s.val()))
      .catch(() => avisar('No se pudo verificar el código. ¿Hay internet?', 'error'));
  }, 'acento'));

  /* La salida esta arriba y no se repite: dos superficies que hacen lo mismo
     en la misma pantalla obligan a leer las dos para descubrir que no habia
     que elegir nada. */
  if (!equipoVacio) {
    c.insertAdjacentHTML('beforeend',
      '<p class="nota" style="margin-top:16px;padding-top:12px;' +
      'border-top:1px solid var(--linea)">¿Sos el titular y el consultorio todavía no ' +
      'tiene ninguna cuenta? Esa primera cuenta se crea sin código.</p>');
    c.appendChild(superficie('Crear la cuenta de titular',
      'Solo la primera vez, cuando no hay ninguna otra cuenta',
      () => dibujarRegistro(c, false), 'fina'));
  }
}
