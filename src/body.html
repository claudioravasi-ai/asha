<div id="app">
  <div class="barra">
    <div class="marca" id="volverInicio" title="Volver al inicio">
      <!-- El nombre y la firma los completa build.py leyendo marca.js. Escritos
           a mano se veia el nombre viejo durante una centesima de segundo, hasta
           que el JavaScript los reemplazaba. -->
      <b id="marcaNombre">{{MARCA_NOMBRE}}</b><span id="marcaFirma">{{MARCA_FIRMA}}</span><span id="marcaBajada">{{MARCA_BAJADA}}</span>
    </div>
    <div class="espacio"></div>
    <span class="version-barra" id="versionBarra">{{VERSION}}</span>
    <div class="conexion" id="conexion" title="Estado de sincronización"></div>
    <div class="usuario" id="usuario" title="Tu cuenta"></div>
  </div>
  <div class="lienzo" id="pila"></div>
</div>
<div id="avisos"></div>
